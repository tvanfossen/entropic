- id: REQ-SAFE-001
  name: Untrusted bytes are sanitized at ingress, never at egress
  module: Cross-Cutting Safety
  description: 'nlohmann::json::dump() throws type_error.316 on invalid UTF-8. That exception
    was ''permanently fixed'' five separate times — gh#112/113, gh#114, gh#118, gh#132, gh#136
    — and each fix patched one egress site, one .dump() among the ~18 in the facade alone
    plus more in core. That strategy cannot converge: the exits multiply with every feature,
    so instance N+1 always lands on a site nobody had reached.


    The entrances do not multiply. Untrusted bytes become a std::string at a small, enumerable
    set of points, and everything downstream copies an already-valid string. Sanitizing there
    makes every dump safe by construction, including dumps not yet written. This is architecture
    design decision 56: when a defect class recurs, count the exits and the entrances and
    guard whichever is bounded.


    The enumerated ingress points are: the decode loops where model bytes first become result.content
    (plain, MTP, and the streaming accumulator); the tool-call argument serializer; the result
    string returned by ServerManager::execute; text a POST_TOOL_CALL hook returns across a
    plugin .so boundary; and the storage delegation read boundary (delegation_row_to_json,
    delegation_summary_to_json).


    sanitize_utf8 validates per RFC 3629 and replaces each malformed run with U+FFFD, advancing
    one byte on failure so the scanner resynchronises. It must leave valid text byte-identical
    — a fix that corrupted every response to prevent a rare one would be worse than the crash.


    KNOWN INCOMPLETE BOUNDARY: the storage MESSAGES read path is NOT sanitized. message_row_to_json
    and conversation_row_to_json return raw col_text(); only the five delegation sites sanitize.
    Whether a malformed row is reachable is unproven — build_message_row takes an already-parsed
    json&, so the writer may be transitively protected. This requirement describes the rule;
    the unproven boundary is tracked separately and must not be read as satisfied here.


    Merged in reconciliation from REQ-API-011, REQ-INFER-014, REQ-MCP-018 and REQ-STOR-006
    — four statements of one policy at four of its boundaries.'
  acceptance_criteria: '[REQ-API-011]

    GIVEN a message list containing malformed UTF-8 bytes WHEN serialize_messages is

    called THEN it does not throw type_error.316 and produces parseable JSON.

    GIVEN valid UTF-8 content THEN it is preserved byte-for-byte.

    GIVEN a mix of valid and malformed messages THEN order and roles are preserved

    and only the malformed content is repaired.

    GIVEN a multi-byte codepoint straddling the byte cap WHEN utf8_safe_substr is

    called THEN the cut lands before that codepoint; 3- and 4-byte sequences behave

    identically; a string already within the cap is returned as-is.


    [REQ-INFER-014]

    Given a truncated multi-byte codepoint (a lead byte with no continuation),

    When sanitized, Then nlohmann::json can serialize it; given valid text,

    Then sanitization leaves it byte-identical. Given tool calls with JSON-

    valued argument strings, Then the serialized array preserves their natural

    types, preserves call order, and does not throw on invalid UTF-8.


    [REQ-MCP-018]

    Given ASCII or well-formed multi-byte input, Then output is byte-identical;

    Given lone continuation bytes, truncated sequences, overlong encodings, or

    UTF-16 surrogate codepoints, Then each malformed run becomes U+FFFD and the

    output round-trips through nlohmann::json::dump without throwing;

    Given a POST_TOOL_CALL hook returning malformed UTF-8, Then the stored

    message content is sanitized.


    [REQ-STOR-006]

    Given a delegation whose result_summary contains a split CJK codepoint

