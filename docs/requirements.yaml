- id: REQ-DELEG-001
  name: Delegation admission guards reject before a child loop runs
  module: Delegation and Pipelines
  description: 'Before dispatching any child loop the engine applies three guards,

    each of which pushes a typed rejection message into the lead''s

    context and returns the loop to EXECUTING so the lead can pivot:

    (1) delegation_depth >= MAX_DELEGATION_DEPTH; (2) a cycle — the

    target equals the current locked_tier or appears in

    delegation_ancestor_tiers, catching A->B->A before the depth cap

    wastes turns; (3) a repeat-failure block — the target equals

    last_failed_delegation_target and consecutive_failed_delegations has

    reached max_consecutive_failed_delegations (default 2, configurable);

    (4) gh#160 — `delegation.isolation: sandbox` is configured but the

    child could reach an EXTERNAL MCP tool that does not declare

    `readOnlyHint: true`, which the engine cannot move into a sandbox.

    Failure counting resets on success or a target switch, deliberately

    NOT on an intervening non-delegation tool call. Pipelines enforce

    the same depth cap with a [PIPELINE REJECTED] message, and the same

    isolation-reach check across every stage — one pipeline shares one

    sandbox, so one unsafe stage breaks containment for all of them.

    WHY the repeat cap (gh#64): pre-fix, a lead retrying a specialist

    that could not emit a tool call burned 30+ identical delegations

    before its own iteration cap stopped it.

    '
  acceptance_criteria: 'Given delegation_depth at MAX_DELEGATION_DEPTH, When a delegation
    is

    dispatched, Then it is rejected and no child runs.

    Given a target present in delegation_ancestor_tiers, When

    is_delegation_cycle is evaluated, Then it returns true.

    Given N consecutive failures against the same target with

    max_consecutive_failed_delegations = N, When the lead re-delegates,

    Then it is blocked with a "[DELEGATION REJECTED] ... stop retrying"

    message; and a different target or a success resets the counter.

    '
  verified_by: 'SCENARIO "delegation guards reject depth/cycle/repeat/pipeline-depth";

    "is_delegation_cycle flags ancestor reuse";

    "is_delegation_repeat_blocked enforces consecutive cap";

    "max_consecutive_failed_delegations is configurable" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/engine_test.cpp;

    TEST_CASE "delegation rejected at MAX_DELEGATION_DEPTH" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/auto_chain_test.cpp

    '
  version: 2.10.4
- id: REQ-DELEG-002
  name: Delegation lifecycle from preconditions to result fold-back
  module: Delegation and Pipelines
  description: 'A delegation runs three preconditions in order — tier resolves to a

    valid ChildContextInfo, the consumer start callback does not return

    REJECT, and (when `delegation.isolation: sandbox` is configured and a

    sandbox manager therefore exists) sandbox creation

    succeeds — each failing case returning a typed DelegationResult

    ("Unknown tier: X", "Delegation rejected by consumer", "(DELEGATION

    FAILED: session sandbox unavailable)") rather than silently running

    against the parent''s cwd (gh#33). The child context is fresh:

    depth+1, the parent''s conversation id propagated so the storage FK

    holds (gh#48), the ancestor tier chain extended with the parent''s

    locked tier, and exactly two messages — the tier

    system prompt and the task with any completion instructions

    appended. The child is LOCKED to its target tier before the child

    loop runs, which is the key ToolExecutor::check_tier_allowed reads:

    an empty locked_tier bypasses enforcement entirely, so a child that

    arrived unlocked would be silently unrestricted. The child carries no

    tool list of its own — v2.13.0 removed ChildContextInfo::tools and

    LoopContext::all_tools, which the facade never populated and nothing

    in the engine ever read. A child''s menu comes from tier config via

    get_tool_prompt(tier), and its dispatch gate from the tier''s

    allowed_tools. The ON_DELEGATE hook may cancel; storage records are

    opened and completed around the child run; todo state is saved,

    replaced with a fresh list, and restored. The summary is extracted

    preferring the explicit completion summary, falling back to the last

    assistant message, then a placeholder. The resume variant (gh#32)

    seeds the child with a prior delegation''s conversation loaded from

    storage instead of a cold system/user pair, but enforces the same

    preconditions and surfaces a typed error when the id cannot be

    loaded. Consumer callbacks are snapshotted under a mutex before use

    and invoked behind an exception shield that treats a throw as REJECT.

    '
  acceptance_criteria: 'Given an unknown tier, When execute_delegation runs, Then the result

    is unsuccessful with an "Unknown tier" summary and no child loop runs.

    Given a start callback returning REJECT, When delegation is

    attempted, Then the child loop never runs.

    Given a child context built from a parent at depth D, Then the child

    is at D+1 with a fresh two-message history and completion

    instructions appended when explicit_completion is set.

    Given a tier that supplies a system prompt, When the child loop

    runs, Then ctx.locked_tier is the delegation target, not empty.

    Given a child that emitted an explicit completion summary, When the

    summary is extracted, Then it is preferred over the last assistant

    message; with neither, a placeholder is returned.

    Given a throwing consumer callback, When it is invoked, Then the

    exception is contained and treated as REJECT.

    '
  verified_by: 'TEST_CASE "execute_delegation returns error for unknown tier";

    "a delegated child is locked to its target tier — the key the

    dispatch allowlist reads";

    "child context has correct depth"; "child context has fresh

    messages"; "completion instructions injected for

    explicit_completion"; "extract_summary prefers explicit completion

    summary"; "extract_summary falls back to last assistant message";

    "extract_summary returns placeholder when no response"; "todo list

    saved and restored across delegation"; "start_cb ACCEPT lets

    delegation proceed"; "start_cb REJECT aborts delegation before child

    loop runs"; "execute_resume_delegation handles seed history

    variants"; "execute_resume_delegation precondition rejections";

    "Storage interface lifecycle integration"; "Exception shields treat

    throwing callbacks as REJECT" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/delegation_manager_test.cpp;

    SCENARIO "resume_delegation failure paths surface typed errors" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/engine_test.cpp

    '
  version: 2.13.0
- id: REQ-DELEG-003
  name: Relay-single-delegate promotion with coverage-gap suppression
  module: Delegation and Pipelines
  description: 'For a tier registered via set_relay_single_delegate, a successful

    child result is promoted directly as the lead''s answer: the engine

    fires POST_GENERATE on the relayed content, writes

    metadata["explicit_completion_summary"], and sets COMPLETE. A child

    that terminated synthetically (non-empty terminal_reason) is relayed

    as "[partial — budget_exhausted] <summary>". If the child signalled

    coverage_gap, auto-relay is SUPPRESSED and instead a typed

    "[COVERAGE GAP from <tier>]" message carrying the summary, gap

    description and suggested files is injected so the lead can chain to

    a follow-up specialist, with state returning to EXECUTING.

    Every relay path writes a disambiguating metadata["relay_status"] —

    coverage_gap_suppressed, budget_exhausted_relayed, validated, or

    validation_skipped — derived from the validation provider''s verdict.

    Outside relay tiers, a successful delegation ends the parent turn as

    COMPLETE unless the parent tier requires explicit completion, in

    which case the loop continues at EXECUTING.

    '
  acceptance_criteria: 'Given a relay tier and a child that hit its iteration cap, When the

    result is finalized, Then the lead''s content is prefixed

    "[partial — budget_exhausted]" and relay_status is

    "budget_exhausted_relayed".

    Given a relay tier and a child result with coverage_gap set, When

    the result is finalized, Then no relay occurs, a [COVERAGE GAP]

    message with the suggested files is injected, relay_status is

    "coverage_gap_suppressed", and state is EXECUTING.

    Given a child that set coverage_gap via entropic.complete, When the

    child result is built, Then the flag and its fields propagate onto

    the DelegationResult; absent the flag the fields stay default.

