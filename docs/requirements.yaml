- id: REQ-COMPACT-002
  name: Fill-gated tool-result pruning and persistent context anchors
  module: Context Management
  description: 'Tool results are stubbed to "[Previous: <tool> result — N chars,

    pruned]" only once context fill reaches warning_threshold_percent

    and only for results older than tool_result_ttl iterations; below

    that threshold pruning is a no-op. WHY (issue #6): pre-2.1.3 pruning

    fired every iteration regardless of fill — one 25-minute session

    against a 32K window recorded 78 prune events at 29% peak fill,

    discarding evidence the tier then re-fetched (16 duplicate tool call

    warnings). Setting warning_threshold_percent to 0 restores the old

    always-prune behavior. The original content is preserved in message

    metadata before stubbing so the validator can still see the

    evidence, and already-stubbed messages are never re-pruned. A

    context-usage warning is injected at the same threshold and not

    repeated within one iteration.

    Separately, messages marked with an anchor key survive across

    run() calls and are re-injected at loop entry, so pinned context is

    not lost to compaction or a new turn.

    '
  acceptance_criteria: 'Given context fill below warning_threshold_percent, When

    prune_old_tool_results runs, Then nothing is pruned; once fill

    crosses the threshold, TTL-aged results are stubbed.

    Given warning_threshold_percent = 0, Then pruning always engages.

    Given a pruned result, Then its original content is retained in

    metadata and a second prune pass leaves the stub untouched.

    Given a keep_recent count, When prune_tool_results runs, Then that

    many most recent results are left intact.

    Given an anchored message, When a second run() executes, Then the

    anchor is still present.

    '
  verified_by: 'TEST_CASE "prune_old_tool_results TTL-based at high context fill";

    "prune_old_tool_results is a no-op below warning threshold";

    "prune_old_tool_results engages once fill crosses threshold";

    "prune_old_tool_results preserves original_content in metadata";

    "prune_old_tool_results respects warning_threshold_percent=0";

