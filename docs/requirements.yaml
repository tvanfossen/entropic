- id: REQ-LOOP-007
  name: Engine-authored transcript shaping keeps the system prompt bit-stable
  module: Agent Loop
  description: 'All per-turn engine state the model needs (iteration N/MAX, a

    one-shot "previous turn rejected" validation feedback line, a

    one-shot anti-spiral warning) is injected as a fresh trailing USER

    message, never by mutating the system message. WHY: mutating the

    system message invalidates the prompt cache on every turn — the

    system block must stay byte-identical across turns for the KV prefix

    to be reused (issue #16, v2.1.4). One-shot fields are cleared after

    emission.

    The engine also normalizes the tool-result transcript so downstream

    final-text extraction sees prose, not machine envelopes: an

    entropic.complete result is folded into the preceding empty

    assistant message (gh#68), any entropic.* result whose JSON body is

    an {"action": ...} envelope is defanged into "(engine: <action>

    directive accepted)" (gh#88), and on a successful non-explicit-

    completion delegation the child summary is folded backward into the

    lead''s empty assistant turn (gh#119). Each fold refuses when its

    preconditions are absent (non-empty assistant prose, non-complete

    tool, missing summary metadata, empty history).

    '
