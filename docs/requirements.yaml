- id: REQ-MCP-025
  name: External servers are discovered safely, directive-stripped, and health-monitored
  module: MCP Servers and Tool Dispatch
  description: 'ExternalMCPClient speaks JSON-RPC 2.0 over a Transport (StdioTransport

    fork/exec+pipes, or SSETransport), performing the MCP initialize handshake

    then tools/list, caching prefixed tool names, and dispatching tools/call

    with a timeout. Security: the `directives` array in an external response is

    ALWAYS stripped and replaced with an empty array — an external server can

    never inject delegate, stop_processing, phase_change, or any other

    engine-level directive (CWE-94). Servers come from YAML config and from

    `.mcp.json` discovery (project file first, then `~/.entropic/.mcp.json`,

    first match per name wins), where discovery skips names that would shadow an

    already-registered server, skips the engine''s own socket via a deterministic

    project-derived socket path, skips malformed entries and stdio entries with

    no command instead of aborting the whole file, and filters a blocklist of

    environment variables that could hijack the child process (CWE-426/CWE-94).

    A HealthMonitor thread detects connection loss and reconnects with

    exponential backoff plus jitter, capped at max_delay and exhausted at

    max_retries, posting status events to a queue the engine thread drains — no

    cross-thread mutation of engine state — and refreshing the tool list on

    successful reconnect. `interrupt_external_tools()` aborts in-flight external

    calls within ~100ms so Ctrl+C does not wait out a transport timeout.

    Transport display names are sanitized (leading slash, brackets, control

    characters) before they reach log/UI markup.

    '
  acceptance_criteria: 'Given a connected external server, When a tool is executed, Then the

    envelope''s directives array is empty regardless of what the server returned;

    When the transport is disconnected or times out, Then an error result is

    returned rather than a hang; Given a `.mcp.json` entry shadowing an existing

    name, or missing a command, or containing a blocked env var, Then the entry

    is skipped or the variable filtered and the remaining entries still load;

    Given repeated reconnect failures, Then delay grows exponentially with

    jitter, caps at max_delay, and the policy reports exhaustion at max_retries.

    '
  verified_by: '"Execute sends tools/call and returns result" (asserts directives empty),

