- id: REQ-CFG-007
  name: Usable configuration with no user config present
  module: Configuration
  description: 'A fresh install with no `~/.entropic/config.yaml`, no consumer defaults and

    no project `config.local.yaml` must still yield a valid, usable config

    rather than an error or an empty tier set. When no layer supplied any

    configuration (`load_config`) or no tiers were produced (`load_layered`),

    the loader falls back to the bundled `default_config.yaml` found under the

    resolved data directory, and — for `load_config`, which owns a concrete

    global path — copies it to `~/.entropic/config.yaml` so the fallback runs

    exactly once and the user gets an editable starting file.


    `load_layered` deliberately passes an EMPTY global path to suppress that

    side effect. WHY (gh#109 follow-up): `exists("")` is always false, so

    without an empty-path guard every fresh-install call through `load_layered`

    threw a filesystem_error from `create_directories("")`. If no bundled

    default exists either, the loader warns and returns success with compiled

    defaults — it does not fabricate tiers.


    The consumer-defaults layer is intentionally non-fatal: a parse failure

    there is logged as a warning and loading continues, so a broken app-shipped

    default cannot brick a user who has a valid global config.

    '
  acceptance_criteria: 'GIVEN both a missing global and a missing project path, WHEN load_config

    runs, THEN the bundled-default path is exercised and the call completes

    without throwing (outcome depends on install state). GIVEN a project_dir

    with no config, WHEN load_layered runs, THEN it returns without a

    filesystem error and never attempts to create a global config. GIVEN a

    global config exists, THEN the bundled-default fallback is not reached.

    '
  verified_by: "SCENARIO(\"load_config drives global + project + env + validate chain\")\n\
    \  (GIVEN \"load_config with both missing falls into load_bundled_default\",\n   and the\
    \ global-layer-alone branch) — tests/unit/config/loader_test.cpp\nSCENARIO(\"load_layered\
    \ overlays a project config.local.yaml when present\") —\n  tests/unit/config/loader_test.cpp\n\
    (auto-create of ~/.entropic/config.yaml, and the non-fatal consumer-layer\n parse failure:\
    \ none)\n"
