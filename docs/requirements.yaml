- id: REQ-INFER-016
  name: Speculative decoding is gated on compatibility and must not change the output
  module: Inference Backends
  description: 'A draft/target pairing is admitted only after a metadata-only

    compatibility query (no llama_context allocated just to learn viability),

    mirrored into entropic because upstream''s equivalent became file-private

    and only throws from a constructor. The gate refuses: recurrent targets

    (Mamba/RWKV) AND hybrid targets (Jamba, Granite-Hybrid, Nemotron-H,

    QWEN35/QWEN35MOE, QWEN3NEXT, KIMI_LINEAR, FALCON_H1, PLAMO2, LFM2/LFM2MOE)

    — upstream does not self-disable for these and hybrid SSM targets produce

    divergent logits at the first speculative-batch boundary because the

    chunked SSM scan does not carry recurrent state across ubatch boundaries;

    vocab-type mismatch; BOS/EOS id or add-behaviour mismatch; vocab size

    delta over 128; and token-text mismatch in the checked range. Each failure

    returns a specific diagnostic identifying the first rule that failed.


    The correctness contract for both speculative kernels is that output is

    distribution-identical to plain decode: one on_token per ACCEPTED token,

    cancel honoured between accept rounds, and the sampler chain mirrored

    exactly (REQ-INFER-006). A draft model that fails to load degrades to

    plain decode and logs, but never blocks engine init — speculative is

    opt-in.

    '
  acceptance_criteria: 'Given a matching pair, Then check_compat reports compatible; given
    null

    handles, a recurrent or hybrid target, or any vocab/BOS/EOS/size/text

    mismatch, Then it reports incompatible with the specific diagnostic. Given

    a compatible pair on a real model, Then speculative output is bit-

    identical to plain decode on rejection cases. Given MTP at temperature>0,

    Then the empirical output distribution matches plain decode.

    '
  verified_by: 'TEST_CASE "speculative compat: matching pair returns compatible", "null

    handles rejected", "recurrent target is rejected", "hybrid target is

    rejected", "vocab type mismatch rejected", "BOS mismatch rejected", "BOS-

    add behavior mismatch rejected", "EOS mismatch rejected", "vocab size

    delta within tolerance" / "over tolerance rejected", "token text mismatch

    rejected", "token text in skipped range ignored" —

    tests/unit/inference/speculative_compat_test.cpp;

    SCENARIO "Speculative decoding produces bit-identical output vs plain …"

    — tests/model/test_speculative_correctness.cpp;

    TEST_CASE "gh#108 MTP is lossless at temperature>0 (empirical

    distribution check)" — tests/model/test_gh108_mtp_guards.cpp;

    TEST_CASE "gh#106 MTP kernel: engaged + lossless-coherent" —

    tests/model/test_gh106_mtp.cpp

