- id: REQ-VALID-002
  name: Critique-and-revise loop with typed verdicts and content safety valve
  module: Constitutional Validation
  description: 'Validation runs as a grammar-constrained critique pass whose

    structured JSON verdict drives up to config.max_revisions revision

    attempts (max_revisions = 0 is critique-only). Every terminal state

    is a distinct verdict the consumer can act on: passed, revised,

    rejected_reverted_length, rejected_max_revisions, skipped,

    paused_pending_consumer, passed_consumer_override — each with its

    own log line and stored as last_result.

    Two deliberate safety behaviors: (a) a revision whose output is

    shorter than half the original is DISCARDED and the original kept

    (verdict rejected_reverted_length) because small models under

    revision pressure collapse output into apologies; (b) a critique

    response whose JSON cannot be parsed is treated as COMPLIANT

    (fail-open) rather than triggering a revision loop on a parse error

    — the grammar constraint is the real enforcement, this is the net

    when grammar loading fails. A critique generation failure likewise

    returns the original content unchanged.

    '
  acceptance_criteria: 'Given compliant critique JSON, When validate runs, Then content is

    unchanged and verdict is passed.

    Given a non-compliant critique, When a revision succeeds, Then

    verdict is revised and revision_count reflects the attempts; when

    max_revisions is exhausted, verdict is rejected_max_revisions and

    the last output is returned.

    Given a revision shorter than 50% of the original, Then the revision

    is discarded, the original is preserved, and verdict is

    rejected_reverted_length.

    Given malformed critique JSON, Then the result defaults to compliant

    and no revision loop runs.

    Given max_revisions = 0, Then critique runs but no revision is

    attempted.

    '
  verified_by: 'SCENARIO "Compliant output returns unchanged"; "Non-compliant output

    triggers revision via Path A"; "Max revisions exhausted returns last

    output"; "Critique-only mode (max_revisions: 0)"; "Revision safety

    valve rejects gutted output"; "Length safety valve marks verdict

    rejected_reverted_length"; "Malformed critique JSON returns safe

    default"; "Malformed critique JSON defaults to compliant"; "Critique

    generation failure returns original"; "Passed verdict set on clean

    critique"; "Revised verdict set when revision applied cleanly";

    "Last result is populated after validation" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/constitutional_validator_test.cpp

    '
  version: 2.10.4
- id: REQ-VALID-003
  name: Consumer-driven pause, resume and accept of a failing validation
  module: Constitutional Validation
  description: 'When auto-revision is disabled (gh#30), a failing critique does not

    silently retry: validation stops at verdict paused_pending_consumer

    and stashes enough state (result, critique, messages JSON, tier) for

    the consumer to either resume_retry() — which runs the revision loop

    ignoring the disabled flag and converges to a normal verdict — or

    accept_last() — which finalizes the paused attempt as

    passed_consumer_override. Both return ENTROPIC_ERROR_INVALID_STATE

    when nothing is paused, and both clear the pending state.

    Consumers get progress signals for the multi-second critique window:

    an attempt-boundary callback fires once per revision attempt, and

    critique start/end callbacks bracket each critique generation. All

    callback slots are snapshotted under a mutex before invocation and

    consumer throws are swallowed at the .so boundary.

    '
  acceptance_criteria: 'Given set_auto_retry(false) and a rejecting critique, When validate

    runs, Then verdict is paused_pending_consumer and no revision runs.

    Given a paused validation, When accept_last() is called, Then the

    verdict becomes passed_consumer_override; when resume_retry() is

    called, Then the revision loop runs and converges.

    Given a revision loop of N attempts, Then the attempt-boundary

    callback fires N times; and critique start/end callbacks bracket the

    generate call.

    '
  verified_by: 'SCENARIO "set_auto_retry(false) pauses validation on rejection";

    "accept_last() finalizes paused attempt as consumer-override";

    "resume_retry() runs the revision loop and converges";

    "attempt_boundary_cb fires per revision"; "Critique start/end

    callbacks fire around the generate call" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/constitutional_validator_test.cpp

    '
  version: 2.10.4
