- id: REQ-MCP-016
  name: Anti-spiral tracking warns softly then hard-blocks repeated identical tools
  module: MCP Servers and Tool Dispatch
  description: 'ToolExecutor counts consecutive calls of the same tool. Reaching

    `max_consecutive_same_tool` populates a one-shot pending warning that the

    next system reminder delivers, telling the model to pivot tools or complete.

    Reaching the hard-block threshold rejects the call PRE-execute with kind

    rejected_anti_spiral and no dispatch at all. The hard-block threshold comes

    from `max_consecutive_same_tool_hard_block`; a negative sentinel derives it

    as `max_consecutive_same_tool + 2`, and a non-negative value is honoured

    verbatim so an operator can effectively disable the hard block while

    keeping the soft advisory.

    '
  acceptance_criteria: 'Given repeated calls of the same tool up to the hard-block threshold,

    When the next call arrives,

    Then it is rejected before dispatch with kind rejected_anti_spiral;

    Given the sentinel hard-block value, Then the effective threshold is the

    soft limit plus two.

    '
  verified_by: '"Anti-spiral hard block stops dispatch and emits ...", "Anti-spiral hard

    block uses derived default when sentinel set"

    — tests/unit/mcp/tool_executor_test.cpp

    '
