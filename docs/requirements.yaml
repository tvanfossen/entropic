- id: REQ-API-002
  name: Handle lifecycle — create, configure, destroy, NULL-safe teardown
  module: Public C API and Facade
  description: '`entropic_create` is the sole allocator of an engine handle. It allocates
    with

    `new (std::nothrow)`, returns ENTROPIC_ERROR_OUT_OF_MEMORY (not an exception) on

    failure, ENTROPIC_ERROR_INVALID_ARGUMENT for a NULL out-pointer, and sets

    `*handle = NULL` on every failure path. A freshly created handle owns only

    Phase-0 state (hook registry, api_mutex, last_error, `configured`/`running`

    flags, a monotonic `log_id`); all subsystem `unique_ptr`s stay null until

    `entropic_configure*`.


    `entropic_destroy` is NULL-safe (a no-op) and tears subsystems down in a

    deliberate order that is itself a requirement: (1) stop and reset the external

    bridge FIRST because it holds a raw back-pointer to the handle and runs worker

    threads; (2) silence inference logging; (3) destroy the per-handle

    `InterfaceContext` before the orchestrator, since its callbacks hold a raw

    orchestrator pointer; (4) unregister the per-handle log sink so a later handle

    reusing the same `log_id` opens `session.log` fresh; (5) `delete handle`, whose

    member destruction order reverses construction.


    WHY: the gh#58 series established that use-after-free at teardown is the

    dominant multi-handle failure mode. Every step here is a fix for a specific

    dangling-pointer or stranded-thread incident.

    '
  acceptance_criteria: 'GIVEN a NULL out-pointer WHEN entropic_create is called THEN it returns

    ENTROPIC_ERROR_INVALID_ARGUMENT and does not crash.

    GIVEN a created handle WHEN entropic_destroy is called THEN resources release

    cleanly; calling entropic_destroy(NULL) afterwards is a safe no-op.

    GIVEN a created-but-unconfigured handle THEN every subsystem entry point

    reports INVALID_STATE rather than dereferencing a null subsystem pointer.

    '
  verified_by: 'SCENARIO("Create and destroy lifecycle") — tests/unit/api/facade_integration_test.cpp

    SCENARIO("Double destroy is safe") — tests/unit/api/facade_integration_test.cpp

    TEST_CASE("entropic_create rejects NULL out-pointer") — tests/unit/api/entropic_capi_test.cpp

    TEST_CASE("entropic_destroy on NULL is a no-op") — tests/unit/api/entropic_capi_test.cpp

    '
  version: 2.10.4
- id: REQ-API-003
  name: Multiple handles are fully independent within one process
  module: Public C API and Facade
  description: 'N `entropic_handle_t` values may be created, configured, run, and destroyed

    concurrently in one process. Each handle owns its own config, orchestrator,

    engine, MCP subsystems, observers, `last_error` string, and `log_id`. No

    per-handle state may live in process-global or function-local `static` storage.


    Concretely this covers: the per-handle `InterfaceContext` backing

    `inference_iface.user_data` (was a process-global static before v2.2.6), the

    per-handle `last_error` (before v2.2.6 `entropic_last_error` ignored its handle

    argument and returned one thread-local buffer, making every facade error write

    unreadable), and per-handle `session.log` routing via `HandleAwareSink` keyed on

    `log_id` (gh#59, v2.3.1). `entropic::HandleApiLock` is the single RAII primitive

    that acquires `api_mutex` and installs the handle''s log scope together.


    WHY: the sassafras-class consumer runs an ensemble of handles in one process.

    gh#58 and its follow-ups were all crashes or cross-talk caused by process-global

    state that a single-handle test suite could never expose.


    Merged in reconciliation with REQ-INFER-022 — the same rule stated from another subsystem''s
    end.'
  acceptance_criteria: '[REQ-API-003]

    GIVEN two handles created in one process WHEN both are configured from distinct

    JSON THEN both succeed, the handle pointers differ, and neither corrupts the

    other.

    GIVEN handle h2 has just been configured WHEN a run is issued on h1 THEN it does

    not segfault.

    GIVEN two handles with distinct failures WHEN entropic_last_error is read on each

    THEN each returns its own message, not the other''s.

    GIVEN three handles THEN all coexist and destroy independently.


    [REQ-INFER-022]

    Given two independently constructed backends, Then both start with the

    default staging and neither observes the other''s writes, in either

    staging order. Given a pool of N backends with alternating staging, Then

    each retains exactly the value it was given.'
  verified_by: '[REQ-API-003]

    SCENARIO("Two handles configure independently") — tests/unit/api/multi_handle_test.cpp

    SCENARIO("Three handles can coexist") — tests/unit/api/multi_handle_test.cpp

    SCENARIO("entropic_last_error returns per-handle state (v2.2.6)") — tests/unit/api/multi_handle_test.cpp

    SCENARIO("h1.run() after h2.configure() does not segfault (v2.2.6)") — tests/unit/api/multi_handle_test.cpp

    SCENARIO("Two GPU-resident handles can coexist (v2.2.8 target)") — tests/unit/api/multi_handle_test.cpp


    [REQ-INFER-022]

    SCENARIO "gh#134 staged tool-choice state does not leak between backends"

    — tests/unit/inference/multi_handle_state_test.cpp;

    SCENARIO "Orchestrator multi-instance side-by-side construction" —

    tests/unit/inference/orchestrator_test.cpp

    (tool_grammar_ isolation is inferred, not measured — see GAPS)'
