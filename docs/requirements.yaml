- id: REQ-STOR-001
  name: Owned SQLite connection with forward-only schema migration
  module: Persistence and Storage
  description: 'The storage layer owns its SQLite schema in code, not in external .sql assets.

    `SqliteDatabase::initialize()` creates any missing parent directories, opens the

    file with SQLITE_OPEN_READWRITE|CREATE|FULLMUTEX, enables `PRAGMA foreign_keys=ON`

    and `PRAGMA journal_mode=WAL`, then runs a sequential, named, forward-only

    migration set (`001_initial`, `002_fts`, `003_delegations`,

    `004_compaction_snapshots`) recorded in a `migrations` table with a UNIQUE name.

    Already-applied migrations are skipped; a failing migration aborts initialize()

    and reports false rather than leaving a half-migrated database behind.

    WHY: the same database file is reopened by every engine handle and by long-lived

    consumer processes across engine versions. Because migrations are name-keyed and

    idempotent, an older database is upgraded in place on next open, and reopening a

    current database is a no-op — no consumer ever has to run a migration tool.

    '
  acceptance_criteria: 'Given a fresh database path, When initialize() is called, Then it
    returns true,

    the file exists on disk, and is_open() reports true.

    Given an initialized database, When the migrations table is queried ordered by id,

    Then exactly the 4 migrations appear in declaration order.

    Given an already-initialized database, When a second SqliteDatabase is constructed

    on the same path and initialized, Then it succeeds and the migration count is

    still 4 (migrations were not re-applied).

    '
  verified_by: 'SCENARIO("Database creates file and initializes") — tests/unit/storage/database_test.cpp

    SCENARIO("Migrations run in order") — tests/unit/storage/database_test.cpp

    SCENARIO("Migrations are idempotent") — tests/unit/storage/database_test.cpp

    '
  version: 2.10.4
- id: REQ-STOR-002
  name: Serialized, parameter-bound statement execution
  module: Persistence and Storage
  description: 'Every database operation goes through `execute` / `execute_raw` / `fetch_one`
    /

    `fetch_all`, each of which takes the instance mutex for its whole duration and

    prepares/finalizes its own statement. Callers never see a raw statement outside a

    binder or extractor callback, and all user-supplied values reach SQL through

    `sqlite3_bind_*` placeholders rather than string concatenation — including the

    LIKE pattern used by delegation search. Operations on a closed connection are a

    safe no-op (false / 0), not a crash.

    WHY: the engine drives storage from the agentic loop, hook callbacks, and

    delegation threads concurrently. Application-level serialization on top of

    SQLITE_OPEN_FULLMUTEX means concurrency is a correctness non-issue for callers,

    and placeholder binding means model-authored text can never be SQL.

    '
  acceptance_criteria: 'Given an initialized database and a conversation row, When 4 threads
    each insert

    10 messages concurrently, Then all 40 rows are present and the database is not

    corrupted.

    Given an INSERT with bound parameters, When the row is selected back, Then the

    round-tripped values match exactly.

    A check asserts execute/fetch_one/fetch_all return false/false/0 when the

    connection is closed.

    '
  verified_by: 'SCENARIO("Concurrent access does not corrupt") — tests/unit/storage/database_test.cpp

    SCENARIO("Basic INSERT and SELECT round-trip") — tests/unit/storage/database_test.cpp

    '
  version: 2.10.4
- id: REQ-STOR-003
  name: Conversation and message persistence with generated identity
  module: Persistence and Storage
  description: '`SqliteStorageBackend` assigns every conversation, message, delegation and

    snapshot a locally generated UUID v4 primary key and a UTC ISO-8601

    `created_at`/`updated_at` — identity is never supplied by the caller, so two

    handles writing the same database cannot collide. Messages are accepted as a JSON

    array and persisted per row (role, content, tool_calls, tool_results,

    token_count, is_compacted, identity_tier), with absent fields defaulting rather

    than failing; a payload that is not a JSON array is rejected. `save_messages`

    also stamps the parent conversation''s `updated_at`, which is the ordering key for

    listing. `load_conversation` returns `{conversation, messages}` with messages in

    `created_at ASC` order, and re-parses the stored `tool_calls`/`tool_results`/

    `metadata` blobs back into real JSON so consumers never see double-encoded

    strings. Deleting a conversation is a single DELETE that relies on the schema''s

    ON DELETE CASCADE. `save_snapshot` durably stores the full pre-compaction message

    array plus its message count, so compaction is never lossy on disk.

    WHY: tool-call history and pre-compaction transcripts are the record consumers

    resume and audit against; the round-trip must be exact and ordered.

    '
  acceptance_criteria: 'Given a new backend, When create_conversation is called, Then it returns
    a

    36-character UUID with ''-'' separators.

    Given a conversation with saved messages, When load_conversation is called, Then

    the result carries the conversation object and the messages in insertion order

    with role/content preserved.

    Given several conversations, When list_conversations is called with limit/offset,

    Then results are paginated, carry a message_count, and are ordered by updated_at

    descending.

    Given a conversation with messages, When delete_conversation is called, Then the

    conversation and its messages are gone.

    Given a title update, When the conversation is reloaded, Then the new title is

    returned.

    Given a message array, When save_snapshot is called, Then a compaction_snapshots

    row exists with the full JSON and the correct message_count.

    '
  verified_by: 'SCENARIO("Create conversation returns valid UUID") — tests/unit/storage/backend_test.cpp

    SCENARIO("Save and load conversation round-trips") — tests/unit/storage/backend_test.cpp

    SCENARIO("List conversations with pagination") — tests/unit/storage/backend_test.cpp

    SCENARIO("Delete conversation cascades") — tests/unit/storage/backend_test.cpp

    SCENARIO("Update conversation title") — tests/unit/storage/backend_test.cpp

    SCENARIO("Compaction snapshot saved") — tests/unit/storage/backend_test.cpp

    '
