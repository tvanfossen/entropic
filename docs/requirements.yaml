- id: REQ-LOOP-006
  name: Interrupt and pause semantics across nested loops
  module: Agent Loop
  description: 'interrupt() is callable from any thread, is idempotent (it logs and

    propagates to the external transport-abort callback only on the 0->1

    transition, because it is polled per token), and causes the loop to

    transition to INTERRUPTED at the next iteration boundary or at

    pending-dispatch time. run_loop(inherit_interrupt = true) — the path

    child delegation loops take — must NOT clear the flag, so a parent

    interrupt raised just before the child was dispatched is honored;

    run_loop(inherit_interrupt = false), the fresh top-level turn, clears

    both the interrupt and pause flags. A finish_reason of "interrupted"

    from the backend also yields INTERRUPTED; "length" continues the loop.

    pause()/cancel_pause() gate the PAUSED state and the on_pause_prompt

    injection path.

