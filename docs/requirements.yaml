- id: REQ-MCP-023
  name: Bash and git servers gate on operator approval, not command pattern matching; bash enforces a timeout on the whole process group
  module: MCP Servers and Tool Dispatch
  description: '`bash.execute` deliberately has no command allowlist or denylist: the

    security model is that the engine''s approval flow gates whether the tool

    runs at all, and the operator approves the exact `command` string shown.

    The one validation performed is on `working_dir`, because it is

    concatenated into a shell `cd` clause and could smuggle commands the

    operator never saw — a cwd containing any of `;&|`$<>` newline, quotes,

    globs, or brackets, or that is not an existing directory, is rejected with

    an error result and no execution. Because approval granularity matters,

    BashServer overrides `get_permission_pattern` to key on the base command

    ("execute:<base_cmd> *") so "always allow" applies to a command family

    rather than every shell invocation. Both servers capture combined

    stdout+stderr with the process exit code in the result, and re-target via

    `set_working_dir` so sandbox swaps work without

    reconstructing the server. GitServer exposes status/diff/log/add/commit/

    branch/checkout/reset against its repo root.

    Since v2.13.0 bash ENFORCES its timeout (`mcp.bash.timeout_seconds`,

    default 30, >= 1 or the config load fails): each command runs as

    `/bin/sh -c` leading its OWN process group, with stdout and stderr on one

    pipe and stdin on /dev/null. When the wall-clock limit passes, the whole

    group is SIGKILLed, the shell is reaped, and the result is a typed

    `{"error":"timeout","message","timeout_seconds","elapsed_ms","output"}`

    — the message names the limit and the elapsed time, and `output` keeps

    what the command printed before the kill. When a command finishes inside

    the limit, anything it left running in its group (background jobs) is

    killed before the call returns, so no process outlives the tool call and

    no zombie is left; a background child holding the output pipe no longer

    holds the call open. A process that deliberately leaves the group

    (setsid) escapes; its output is abandoned after a 2 s grace. A command

    killed by signal N reports exit code 128+N. Until v2.13.0 the timeout

    was stored and never read, and bash.h claimed the server "blocks

    dangerous commands" — it never did; command gating is the permission

    layer and tool approval.

    '
  acceptance_criteria: 'Given a command writing to stdout or stderr, Then both are captured
    with

    the exit code; Given a nonexistent command, Then an error result is

    returned rather than a throw; Given a working_dir containing shell

    metacharacters or naming a non-directory, Then the call is rejected before

    any shell runs; Given `python -m x`, Then the permission pattern names the

    base command; git tools stage, commit, branch, checkout, and reset against

    the repo root.

    Given a command that outlives the timeout, Then it returns a timeout error

    well before it would have finished, naming the limit, and afterwards the

    shell is reaped and no live process remains in its group; Given a command

    that starts a background child, Then the child is dead once the call

    returns, and a child holding the output pipe does not hold the call open;

    Given a command inside its limit, Then its own exit code and both output

    streams are returned; Given mcp.bash.timeout_seconds, Then the dispatched

    server uses it (absent: 30), and 0 or a negative value fails the load.

    '
  verified_by: '"bash: a command that outlives the timeout is killed with its whole

    process group, and the model is told why", "bash: a background child is not

    left running after the command returns", "bash: a background child holding

    the output pipe does not hang the call", "bash: a command inside its limit

    still reports its own exit code and output" —

    tests/unit/mcp/servers/bash_test.cpp; SCENARIO "mcp.bash.timeout_seconds

    reaches the dispatched bash server" —

