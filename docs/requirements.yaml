- id: REQ-STOR-005
  name: Delegation record lifecycle with parent-conversation guard
  module: Persistence and Storage
  description: '`create_delegation` atomically provisions a child conversation (titled from
    the

    target tier and the first 60 chars of the task, tagged with the target tier as

    model_id), writes a delegations row in status `running`, and returns both ids.

    `complete_delegation` transitions the row to `completed`/`failed` with an optional

    result summary and a completion timestamp. Records are retrievable three ways:

    by parent (`get_delegations`, created_at ASC), by id (`get_delegation_by_id`), and

    by case-insensitive substring over `result_summary` restricted to completed rows,

    most-recent-first (`search_delegations`). `max_turns` is persisted as SQL NULL

    when unset and surfaces as JSON null, not 0.

    WHY (gh#48): an empty `parent_conversation_id` used to reach the FK-bound INSERT

    and fail silently while the engine still logged "Created delegation", hiding the

    fault. The backend now refuses empty parents up front, clears both out-params,

    logs the refusal, and only logs success when the INSERT actually succeeded.

    '
  acceptance_criteria: 'Given a parent conversation, When create_delegation is called, Then
    a delegation

    id and a child conversation id are returned and the record is retrievable via

    get_delegations; When complete_delegation marks it completed with a summary, Then

    the reloaded record shows the status and summary.

    Given an empty parent_conversation_id, When create_delegation is called, Then it

    returns false and both output ids are left empty.

    Given a stored delegation, When get_delegation_by_id is called with its id, Then

    the single row is returned; with an unknown id, Then it returns false.

    Given several delegations, When search_delegations is called with a substring,

    Then only completed rows whose result_summary contains it are returned, bounded

    by max_results.

    '
  verified_by: 'SCENARIO("Delegation lifecycle") — tests/unit/storage/backend_test.cpp

    SCENARIO("create_delegation refuses empty parent (gh#48)") — tests/unit/storage/backend_test.cpp

    SCENARIO("get_delegation_by_id retrieves a single delegation row") — tests/unit/storage/backend_test.cpp

    SCENARIO("search_delegations finds completed rows by substring") — tests/unit/storage/backend_test.cpp

    '
