- id: REQ-MCP-022
  name: Glob, grep, and read honour .gitignore plus .explorerignore semantics
  module: MCP Servers and Tool Dispatch
  description: 'IgnoreMatcher loads gitignore-style rules recursively from every

    `.gitignore` under the workspace root — each anchored at its own directory,

    matching git''s documented behavior — then layers the root `.explorerignore`

    on top so a workspace can both add exclusions and re-include with `!`.

    Supported syntax: filename globs (`*`, `?`, `[abc]`), directory-only

    patterns (trailing `/`), root- and path-anchored patterns, double-star

    recursion, negation, comments, and blank lines. Matching is path-relative

    (never filename-only) and last-match-wins so negations can re-include.

    `load()` clears prior rules and is safe to call repeatedly when the working

    directory changes. Malformed patterns and character classes are tolerated

    rather than throwing. WHY: before v2.1.4 a hardcoded four-entry skip list

    let build artifacts, generated XML, and vendor blobs drown real grep/glob

    matches in the model''s context. Since v2.13.0 (gh#161) the work is bounded

    as well as correct: discovery prunes the skip-list directories and any

    directory the rules loaded so far exclude, a query consults only the rules

    anchored on the path''s own ancestry and stops at the first match walking

    that subset backwards, and the glob/grep walk itself is capped by

    `filesystem.max_walk_entries` with an explicit truncation notice appended

    to the tool result when the cap fires.

    '
  acceptance_criteria: 'Given a rule set, When paths are tested, Then filename globs match
    at any

    depth, `build/` matches the directory and its descendants, a trailing-slash

    pattern does not match a same-named file, a leading slash anchors at root,

    an embedded slash anchors the path, negation re-includes and is order

    sensitive, comments and blanks are skipped, and re-loading clears prior

    rules; a malformed character class does not throw. Given a deep tree of

    nested `.gitignore` files, When a path is tested, Then the number of regex

    evaluations is bounded by the rules on that path''s own ancestry, a

    `.gitignore` inside `.git`/`node_modules`/`__pycache__`/`.venv` or inside an

    already-excluded directory is never loaded, and a later rule at a shallower

    base still overrides an earlier one at a deeper base; Given a walk that

    exceeds `filesystem.max_walk_entries`, Then glob and grep both append a

    truncation notice naming the entry count to the tool result.

    '
  verified_by: 'All TEST_CASEs in tests/unit/mcp/servers/ignore_matcher_test.cpp,

    notably "IgnoreMatcher: directory pattern matches dir + descendants",

    "IgnoreMatcher: negation order matters (last-match-wins)",

    "IgnoreMatcher::load discovers nested .gitignore ...",

    "IgnoreMatcher::load is idempotent; re-load clears ...",

    "IgnoreMatcher tolerates a malformed character class";

    plus "test_glob_respects_gitignore",

    "test_glob_respects_explorerignore_supplementary",

    "test_explorerignore_negation_re_includes_path",

    "test_glob_announces_a_truncated_walk",

    "test_grep_announces_a_truncated_walk",

    "test_glob_and_grep_are_silent_when_the_walk_completes"

