    called THEN

    it returns ENTROPIC_OK and the slot is stashed (not dropped).

    GIVEN a NULL handle WHEN any observer setter is called THEN INVALID_HANDLE.

    GIVEN a registered stream observer WHEN a non-streaming entropic_run completes

    THEN the observer is invoked exactly once with token="" and len==0.

