- id: REQ-BRIDGE-001
  name: External bridge exposes the engine over a peer-authenticated unix socket
  module: External Bridge
  description: 'ExternalBridge lets a separate process drive an already-running engine over
    a unix domain socket, so a consumer does not pay a model load per query. It is the server
    side of the surface the `entropic mcp-bridge` relay speaks to (REQ-PROD-002).


    The socket is the trust boundary and is defended accordingly: the socket file is created
    0600 inside a 0700 directory, a pre-existing path that is a symlink is refused rather
    than followed, and each accepted connection is authenticated with SO_PEERCRED so only
    the owning uid may drive the engine. A process registry keyed on the canonical bound path
    prevents two bridges binding the same socket.


    Long-running asks are asynchronous: run_async_ask registers a task, returns its id immediately,
    and records progress through queued -> running -> running:<tier> -> done|failed|cancelled.
    Terminal status is additionally written to a sentinel file per task, atomically, so a
    consumer that died mid-ask can recover the outcome after restart. cleanup_expired_tasks
    reaps both the in-memory task and its sentinel. Subscribed clients receive notifications
    by broadcast, and a phase observer may be attached to exactly one task at a time with
    stale observer calls detected rather than misattributed.


    Written during reconciliation: this subsystem was ORPHANED by the parallel sweep. Its
    header sat in the MCP sweep''s scope and its implementation in the facade sweep''s; MCP
    deliberately declined it expecting facade to claim it, and facade did not. Zero of the
    112 swept requirements referenced it, against 26 SCENARIOs in tests/unit/mcp/external_bridge_test.cpp.
    Recorded here because a split-ownership subsystem is exactly what a per-subsystem sweep
    cannot see.'
  acceptance_criteria: 'GIVEN an explicit socket_path WHEN the bridge is constructed THEN
    it binds that path and registers it canonically.

    GIVEN a socket path that already exists as a symlink WHEN start() is called THEN it refuses
    rather than following the link.

    GIVEN a created socket THEN the socket file is 0600 and its parent directory 0700.

    GIVEN an async ask WHEN it reaches each terminal status THEN exactly one sentinel file
    is written per terminal status, atomically.

    GIVEN an unknown task_id WHEN handle_ask_status is called THEN it returns a typed error
    rather than an empty success.

    GIVEN expired and fresh tasks WHEN cleanup_expired_tasks runs THEN expired tasks and their
    sentinel files are removed and fresh ones are kept.

    GIVEN a null handle THEN async_sentinel_dir is empty and an async ask completes with an
    error rather than faulting.'
  verified_by: '26 SCENARIOs in tests/unit/mcp/external_bridge_test.cpp, including:

    SCENARIO("handle_ask_status returns error for unknown task_id")

    SCENARIO("Async ask registers task and completes with error on null handle")

    SCENARIO("Cleanup removes expired tasks but keeps fresh ones")

    SCENARIO("write_sentinel writes one file per terminal status")

    SCENARIO("run_async_ask writes a sentinel atomically with status")

    SCENARIO("cleanup_expired_tasks removes sentinel files")

    SCENARIO("ExternalBridge constructs with explicit socket_path")'
