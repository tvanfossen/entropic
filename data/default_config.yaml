# SPDX-License-Identifier: Apache-2.0
# Entropic Default Configuration
# Bundled with the C++ engine. Fallback when no global/project config exists.
# Hardware params only — inference behavior lives in identity frontmatter.

models:
  lead:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40
    # gh#42 (v2.1.8): primary is multimodal — pair the bundled mmproj
    # so the lead tier (which is also the default per `default: lead`)
    # carries vision capability. Other tiers continue to share the same
    # base model weights via the orchestrator's model pool — no extra
    # VRAM cost beyond the single mmproj (~0.9 GB).
    mmproj: primary_mmproj
    capabilities: [text, vision]

  arch:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40

  eng:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40

  qa:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40

  ux:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40

  ui:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40

  analyst:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40

  compactor:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40

  scribe:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40

  benchmark_judge:
    path: primary
    adapter: qwen35
    context_length: 131072
    gpu_layers: 40

  default: lead

routing:
  enabled: false
  fallback_tier: lead

log_level: INFO

mcp:
  enable_filesystem: true
  enable_bash: true
  enable_git: true
  enable_diagnostics: true
  enable_web: true
  bash:
    # Wall-clock limit on ONE bash.execute call, in seconds (>= 1; 0 or a
    # negative value fails the config load). On expiry the command's whole
    # process group — background children included — is killed and the model
    # gets a typed `timeout` error naming the limit and the elapsed time.
    # Anything a command leaves running in the background is killed when it
    # returns. Until v2.13.0 this limit existed only on paper; raise it if
    # your tools run long builds or test suites through bash.
    # The bash tool does NOT filter commands: gate them with
    # permissions.allow / permissions.deny and tool approval.
    timeout_seconds: 30
  filesystem:
    # Paths OUTSIDE the project root (mcp.working_dir, else the cwd):
    #   false    — refuse every one ("Path escapes project root: ...")
    #   true     — serve every one, read AND write, no prompt
    #   optional — ask the host's path approver (entropic_set_path_approval_callback)
    #              with the resolved path and read/write; with NO approver
    #              registered the call is REFUSED with a typed
    #              `outside_root_approval_required` error. Never fails open.
    # Until v2.13.0 this shipped `true`, which gave the model unconfined read
    # and write of the whole filesystem on bundled defaults. A
    # ~/.entropic/config.yaml auto-created from an older copy of this file
    # still says `true`: edit it to take the new default.
    # permissions.auto_approve does NOT approve an escape — it skips per-tool
    # prompts, it does not widen the filesystem boundary. Named workspaces
    # are always confined to their own root, whatever is set here.
    allow_outside_root: optional
    # Precedence: outside_root_deny > outside_root_allow > allow_outside_root.
    # Absolute paths (~ expanded), matched by SUBTREE: /opt/data covers
    # /opt/data/x but never /opt/database.
    # outside_root_allow:     # pre-approved, never prompted
    #   - ~/notes
    # outside_root_deny:      # always refused, even with allow_outside_root: true
    #   - ~/.ssh
  external:
    enabled: false
    rate_limit: 10
    # gh#145: a consumer app hosting this engine presents its OWN identity.
    # tool_prefix namespaces the advertised tools (sumac.ask, sumac.status);
    # server_name is what a person sees in their MCP server list. Both default
    # to "entropic", so leaving them unset is exactly the pre-2.12.0 behaviour.
    # tool_prefix: entropic
    # server_name: entropic
    # Optional per-tool description overrides, keyed by bare suffix. The
    # description is what a MODEL reasons over when choosing a tool, so a host
    # with one specific job should say what that job is rather than describe
    # the transport.
    # tool_descriptions:
    #   ask: "Review this repository against the documentation ruleset."
