# SPDX-License-Identifier: Apache-2.0
# Entropic Engine Requirements
#
# Source of truth for @req traceability tags, cross-referenced by doxygen-guard
# (see .doxygen-guard.yaml -> impact.requirements.file).
#
# DERIVED FROM THE IMPLEMENTATION, NOT WRITTEN AHEAD OF IT. The engine is a
# shipped system at v2.10.4; these entries describe what it already
# guarantees. They were produced by eight parallel shallow sweeps, one per
# librentropic-* grouping, then reconciled: cross-cutting rules that each sweep
# restated at its own boundary were merged into single REQ-ABI-* / REQ-SAFE-*
# entries, and one orphaned subsystem (REQ-BRIDGE-001) was written during
# reconciliation because no sweep owned it.
#
# History: a 140-entry catalog existed at v2.0.2 and was deleted as collateral
# in commit 2edfb4e ("v2.1.0 pre-release cleanup", docs/ purge). Nothing failed
# loudly, because all three consumers of this file fail open when it is absent:
# check_req_exists self-disables on an empty catalog, check_req_coverage tests
# only that the config names a path, and impact reporting degrades to "No
# requirements affected." That is why the coverage gate matters more than the
# catalog does.
#
# ID conventions
#   REQ-<MODULE>-NNN   module-scoped requirement
#   REQ-ABI-NNN        cross-cutting: rules holding at every .so boundary
#   REQ-SAFE-NNN       cross-cutting: rules holding at every trust boundary
#   REQ-PROD-NNN       product-level promise a user observes externally
#
# Fields
#   id                   stable identifier; referenced by @req tags in source
#   name                 <= 80 chars
#   module               functional group
#   description          what the system must do, and why when non-obvious
#   acceptance_criteria  how it is verified
#   verified_by          the Catch2 SCENARIO(s) or gate that verify it
#   version              version this requirement was recorded against
#
# A requirement whose verified_by is "none" is a claim without verification.
# Those are deliberate and tracked — not oversights to be quietly deleted.
- id: REQ-ABI-001
  name: Pure C at every .so boundary — opaque handles and explicit ownership
  module: Cross-Cutting ABI
  description: 'Architecture design rule 1, stated once. Entropic ships four independent .so
    boundaries — the facade (entropic.h), the inference backend (interfaces/i_inference_backend.h),
    storage (entropic_storage_backend_t), and the MCP plugin factory. Every one of them crosses
    only C-safe types: an opaque handle typedef whose struct body stays private, entropic_error_t
    codes, function pointers, and const char* JSON. No C++ type, template, reference, default
    argument, or exception appears in any crossing signature.


    Three properties hold at all four boundaries. Handles are opaque — the struct body lives
    in a private header a consumer never sees. Every entry point tolerates NULL for its handle
    and for each pointer parameter, returning a typed error or a documented sentinel rather
    than faulting. Ownership is explicit — strings returned across the boundary are allocated
    by the producing library and released by its paired NULL-safe free function, never by
    the consumer''s allocator.


    Symbol visibility is deny-by-default (CMAKE_CXX_VISIBILITY_PRESET hidden), so a symbol
    reaches the boundary only by carrying ENTROPIC_EXPORT. A bare definition silently inherits
    hidden visibility and vanishes from the export table — the trap behind gh#133.


    Merged in reconciliation from REQ-API-001, REQ-INFER-003 and REQ-STOR-007, which stated
    this rule at three of the four boundaries. The MCP plugin boundary keeps its own requirement
    because its ABI-version lock is an additional mechanism, not a restatement.'
  acceptance_criteria: '[REQ-API-001]

    A translation unit compiled as pure C99 (not C++) that includes only

    <entropic/entropic.h> compiles, links, and can name entropic_handle_t,

    entropic_error_t, entropic_hook_point_t, entropic_hook_callback_t,

    entropic_version(), and entropic_api_version(). The compile-time

    ENTROPIC_API_VERSION constant equals the runtime entropic_api_version()

    return value. Every symbol the Python wrapper resolves out of librentropic.so

    is present in the export manifest.


    [REQ-INFER-003]

    Given a NULL handle or NULL out-pointer, When any C entry point is

    called, Then it returns the documented error code and does not crash.

    Given a backend implementation that throws, When called through the C

    ABI, Then the exception is caught and mapped to an error code. Given

    entropic_inference_free(nullptr) or entropic_inference_destroy(nullptr),

    Then both are no-ops.


    [REQ-STOR-007]

    Given a valid db_path, When create/initialize/destroy are called in sequence, Then

    the handle is non-NULL, initialize returns ENTROPIC_OK, and destroy is clean.

    Given a NULL handle, When any storage entry point is called, Then it returns

    ENTROPIC_ERROR_INVALID_ARGUMENT (or NULL) and does not crash.

    Given a NULL db_path, When entropic_storage_create is called, Then it returns

    nullptr.

    Given a handle, When the full conversation, delegation, snapshot/stats and search

    surfaces are driven end-to-end through the C ABI, Then each round-trips the same

    data as the C++ API.'
  verified_by: '[REQ-API-001]

    tests/unit/api/header_c99_test.c (compiled as C, main() names every public type)

    SCENARIO("API version is queryable at runtime") — tests/unit/api/api_version_test.cpp

    SCENARIO("Compile-time API version matches runtime") — tests/unit/api/api_version_test.cpp

    SCENARIO("Library version matches the canonical VERSION file") — tests/unit/api/api_version_test.cpp

    TestPipWrapperSymbols::test_all_2_1_4_symbols_declared — tests/unit/test_bindings_abi.py


    [REQ-INFER-003]

    TEST_CASE "entropic_inference_load/activate/deactivate/unload/state/

    generate/generate_streaming/complete/count_tokens rejects NULL handle"

    (family), "entropic_inference_load catches exceptions and returns

    LOAD_FAILED", "entropic_inference_generate catches backend exceptions",

    "inference C ABI: exception paths + parse_params field sweep",

    "entropic_inference_free tolerates nullptr", "entropic_inference_destroy

    with nullptr is a no-op", "entropic_plugin_api_version returns the wire

    version" — tests/unit/inference/inference_c_api_test.cpp


    [REQ-STOR-007]

    SCENARIO("C API handle lifecycle") — tests/unit/storage/c_interface_test.cpp

    SCENARIO("C API NULL handle returns error") — tests/unit/storage/c_interface_test.cpp

    SCENARIO("Storage C ABI rejects every NULL-handle entry-point") — tests/unit/storage/c_interface_test.cpp

    SCENARIO("Storage C ABI safely returns nullptr on create with NULL db_path") — tests/unit/storage/c_interface_test.cpp

    SCENARIO("Storage handle round-trips a conversation through the C ABI") — tests/unit/storage/c_interface_test.cpp

    SCENARIO("Storage handle exercises delegation create/complete/get through the C ABI")
    — tests/unit/storage/c_interface_test.cpp

    SCENARIO("Storage handle saves snapshot + queries stats through the C ABI") — tests/unit/storage/c_interface_test.cpp'
