- id: REQ-API-010
  name: Observer and callback slots survive configure and fire uniformly
  module: Public C API and Facade
  description: 'The facade owns the authoritative slot for every consumer callback, so

    registration is legal BEFORE `entropic_configure*` and survives engine /

    validator construction. `rewire_observers` re-applies each stored slot onto the

    freshly built subsystems at configure time. Slots covered:

    `stream_observer` (global per-token, fires for streaming, non-streaming, and

    delegate child loops), `state_observer` (every AgentState transition, integers

    mapping 1:1 to `entropic_agent_state_t`), `queue_observer` (mid-generation

    user-message queue drain), `critique_start_cb`/`critique_end_cb` (brackets the

    20-30s constitutional critique generate that AgentState does not signal),

    delegation start/complete callbacks, the validation attempt-boundary callback,

    the error callback, and (v2.13.0) the outside-root path approver

    (`entropic_set_path_approval_callback`, read per call through a facade

    thunk on the default server set). Passing NULL clears a slot.


    End-of-turn is uniform: at the end of any `entropic_run` / `entropic_run_as` /

    `entropic_run_streaming` the stream observer is invoked once with

    `(token="", len=0)` as a synthetic completion sentinel, so a consumer can detect

    end-of-turn without knowing which entry point was used.


    Callback threading contract: observers may fire from the engine thread, a

    delegation child-loop thread, or the external-bridge worker thread, so consumer

    callbacks must be thread-safe; and no callback may re-enter the entropic API

    (deadlock risk). The critique slot is snapshotted under a mutex before each fire

    so an in-flight critique cannot observe a torn reassignment.

    '
