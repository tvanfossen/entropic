- id: REQ-MCP-001
  name: MCPServerBase holds the shared logic; concrete servers override only deltas
  module: MCP Servers and Tool Dispatch
  description: 'Every in-process MCP server derives from MCPServerBase, which owns a

    ToolRegistry and implements tool registration, `list_tools()` (JSON array

    of definitions), `execute()` dispatch, and automatic ContextAnchor

    directive injection for any tool whose `anchor_key(args)` returns a

    non-empty key. Four extension points are virtual with safe defaults:

    `get_permission_pattern()` returns the fully-qualified tool name

    (tool-level granularity), `skip_duplicate_check()` returns false,

    `configure()` is a no-op returning true, and `set_working_dir()` is a

    no-op returning true. Concrete servers (filesystem, bash, git, entropic,

    web, diagnostics) subclass, construct their ToolBase instances, register

    them, and override only what differs. WHY: this is the project''s

    three-layer rule (C interface -> concrete base holding 80% of logic ->

    thin implementation); it also means a new server cannot accidentally

    lose anchoring, envelope shape, or permission-pattern behavior.

    '
  acceptance_criteria: 'Given a server subclassing MCPServerBase with one registered tool,

    When execute() is called for that tool,

    Then the tool''s execute() runs and the response is returned as a

    ServerResponse envelope; when the tool declares an anchor_key a

    context_anchor directive is present, and when it does not the directives

    array is empty. A subclass that overrides nothing reports the tool name

    as its permission pattern and false for skip_duplicate_check.

    '
  verified_by: '"Server registers tools", "Execute dispatches to tool",

    "Context anchor auto-injection", "No anchor by default",

    "Default permission pattern", "Default skip duplicate check"

    — tests/unit/mcp/server_base_test.cpp

    '
  version: 2.10.4
- id: REQ-MCP-002
  name: Tool results always cross boundaries as a ServerResponse JSON envelope
  module: MCP Servers and Tool Dispatch
  description: 'Every tool execution — in-process, dlopen plugin, or external MCP server —

    returns the same JSON envelope: `{"result":"<text shown to the model>",

    "directives":[{"type":"<wire name>"},...]}`. Directive enum values are

    serialised through a fixed name table (stop_processing, tier_change,

    delegate, pipeline, complete, clear_self_todos, inject_context,

    prune_messages, context_anchor, phase_change, notify_presenter); an

    out-of-range value serialises as "unknown" rather than reading past the

    table. Tools with no side effects emit an empty directives array. WHY: the

    envelope is the single contract the engine''s DirectiveProcessor and the C

    ABI both parse, so a uniform shape means the routing layer never has to

    know which kind of server answered.

    '
  acceptance_criteria: 'Given a tool returning result text and directives,

    When the server serialises the response,

    Then the output parses as JSON with a string `result` and an array

    `directives` whose entries carry a `type` string from the wire name table.

    Error paths (unknown tool, unknown server, permission denied, disconnected

    external server) use the same envelope with the error text in `result`.

    '
  verified_by: '"ServerResponse JSON envelope" — tests/unit/mcp/server_base_test.cpp;

    "Unknown tool returns error" — tests/unit/mcp/server_base_test.cpp;

    "Unknown server returns error", "Permission denied blocks execution"

    — tests/unit/mcp/server_manager_test.cpp

    '
  version: 2.10.4
- id: REQ-MCP-003
  name: ToolRegistry dispatch is defensive about unknown and null tools
  module: MCP Servers and Tool Dispatch
  description: 'ToolRegistry maps tool name to a non-owning ToolBase pointer (the server

    retains ownership of the tool objects). It answers `has_tool`,

    `get_definitions`, `get_tools_json`, and `dispatch`. Registering a nullptr

    is a logged no-op rather than a stored null entry, re-registering an

    existing name logs a warning, and dispatching an unknown name returns an

    error ServerResponse instead of dereferencing a missing tool. WHY: tool

    registration happens in server constructors where a failed

    `load_tool_definition` or a copy-paste name collision would otherwise

    produce a crash at first model call rather than a diagnosable log line.

    '
  acceptance_criteria: 'Given a registry with one registered tool,

    When dispatch() is called with an unregistered name,

    Then an error ServerResponse is returned and nothing is dereferenced;

    register_tool(nullptr) leaves the registry size unchanged; a duplicate

    registration logs a warning; get_definitions returns exactly one pointer

    per registered tool and an empty vector for an empty registry.

    '
  verified_by: '"Register and dispatch tool", "has_tool returns false for unknown",

    "get_tools_json returns definitions", "Dispatch unknown returns error",

    "Duplicate registration warns", "register_tool with nullptr is a logged

    no-op", "get_definitions returns one pointer per registered tool",

    "get_definitions on an empty registry returns an empty vector"

    — tests/unit/mcp/tool_registry_test.cpp

    '
  version: 2.10.4
- id: REQ-MCP-004
  name: Plugin C ABI is pure C, version-locked, and exported under hidden visibility
  module: MCP Servers and Tool Dispatch
  description: '`include/entropic/interfaces/i_mcp_server.h` declares the nine entry points

    an MCP server `.so` must export: entropic_plugin_api_version,

    entropic_create_server, entropic_mcp_server_{name,list_tools,execute,

    configure,set_working_dir,destroy}, and entropic_free. Only an opaque

    handle type crosses the boundary — no C++ ABI, no exceptions. Ownership is

    explicit: strings from list_tools/execute are caller-owned and freed with

    that plugin''s entropic_free; the name string is server-owned for the handle

    lifetime; inputs are borrowed for the call. Every declaration carries

    ENTROPIC_EXPORT so that a plugin defining the function plainly still

    exports it under `-fvisibility=hidden` (the common plugin build), which

    otherwise yields an `.so` exporting nothing and failing every dlsym.

    Signatures and the handle type are LOCKED at API version 1; any signature

    change requires bumping the reported version. Tool descriptors use

    `inputSchema` (camelCase) matching the bundled `data/tools/*/*.json`.

    '
  acceptance_criteria: 'Given the fixture plugin built the way a third-party plugin would
    be built,

    When its `.so` is inspected/dlopened,

    Then all nine entry points resolve and the reported API version equals

    ENTROPIC_MCP_PLUGIN_API_VERSION. A string returned by the plugin is

    released through the plugin''s own entropic_free, never the engine''s

    allocator.

    '
  verified_by: '"gh#133 control: the fixture plugin exports the full contract"

    — tests/unit/mcp/plugin_loader_test.cpp

    '
  version: 2.10.4
- id: REQ-MCP-005
  name: Configured plugins load loudly or fail loudly — never silently skipped
  module: MCP Servers and Tool Dispatch
  description: '`ServerManager::load_plugins()` walks `mcp.plugins`, and for each path

    performs dlopen, dlsym of all nine entry points, an API-version check, then

    `entropic_create_server()`. A dlopen failure, a missing entry point, or a

    null instance yields ENTROPIC_ERROR_PLUGIN_LOAD_FAILED; a mismatched

    version yields ENTROPIC_ERROR_PLUGIN_VERSION_MISMATCH. Every configured

    path is attempted so one broken plugin does not hide the diagnosis of the

    rest, each failure is logged with its path, and the FIRST failure''s code is

    returned. A plugin whose reported name collides with an already-registered

    in-process, plugin, or external server is refused rather than shadowing it.

    An empty plugin list is a vacuous ENTROPIC_OK. WHY: a configured-but-absent

    plugin would leave the operator''s stated intent unmet with no signal —

    fail-fast-and-loud rather than silent fallback.

    '
  acceptance_criteria: 'Given `mcp.plugins` naming a `.so` that does not exist,

    When load_plugins runs,

    Then it returns ENTROPIC_ERROR_PLUGIN_LOAD_FAILED (not OK) and logs the

    path; given a plugin reporting a different API version it returns

    ENTROPIC_ERROR_PLUGIN_VERSION_MISMATCH; given an empty list it returns

    ENTROPIC_OK.

    '
  verified_by: '"gh#133 a missing plugin .so fails loud, not silently",

    "gh#133 a version-mismatched plugin is rejected with its own code",

    "gh#133 an empty plugin list is a no-op success"

    — tests/unit/mcp/plugin_loader_test.cpp

    '
  version: 2.10.4
- id: REQ-MCP-006
  name: Plugin instances get serialised calls and ordered teardown
  module: MCP Servers and Tool Dispatch
  description: 'PluginServer holds a per-instance mutex around execute(), configure(), and

    set_working_dir() so the threading promise the plugin header makes to

    authors — "the engine never runs these concurrently on one handle, so keep

    your state unguarded" — is true by construction rather than by every

    upstream caller behaving. No ordering is promised between distinct handles,

    the calling thread is not fixed (so plugins must not use thread-local state

    across calls), and destroy() happens-after every other call on that handle.

    Destruction destroys the plugin instance first, then dlcloses the library,

    in that order; the type is non-copyable and non-movable because it owns a

    raw dlopen handle whose mapping the instance''s lifetime depends on.

    '
  acceptance_criteria: 'Given a loaded plugin, When two threads call into the same handle,

    Then calls are serialised (no interleaving inside the plugin). On

    ServerManager shutdown the plugin instance is destroyed before dlclose,

    and PluginServer cannot be copied or moved (compile-time deletion).

    '
  verified_by: none
