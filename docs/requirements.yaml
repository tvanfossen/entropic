- id: REQ-IDEN-001
  name: Tier resolution contract and per-tier loop overrides
  module: Identity and Tiers
  description: 'Core resolves tier identity only through the injected

    TierResolutionInterface (resolve_tier, tier_exists,

    get_handoff_targets, get_tier_param), so core.so has no compile-time

    dependency on prompts.so or inference.so. An unresolvable tier

    yields ChildContextInfo{valid = false} and every consumer of it must

    fail typed rather than proceed. When no external resolver is wired,

    the engine wires internal trampolines over its own tier_info_ /

    handoff_rules_ maps, and get_tier_param surfaces exactly

    explicit_completion, max_iterations, max_tool_calls_per_turn,

    max_consecutive_empty_turns and allowed_tools (CSV), returning empty

    string for an unknown tier or an unset (-1) numeric override.

    Per-identity max_iterations and max_tool_calls_per_turn overrides

    are applied into the LoopContext at loop entry and take precedence

    over LoopConfig; absent a resolver, tier_requires_explicit_completion

    returns false so legacy tests without tier metadata behave as before.

