- id: REQ-PROD-001
  name: Single `entropic` command with a closed, stable subcommand surface
  module: CLI and Distribution
  description: 'One `entropic` executable ships with the engine and dispatches a closed set

    of subcommands: `mcp-bridge`, `download`, `version`. Any other first argument

    prints `entropic: unknown subcommand ''<X>''` plus the usage banner and exits 1;

    `help`/`--help`/`-h` prints the same banner and exits 0. The surface is

    identical across all four install routes (source build, tarball prefix, pip

    wrapper, `inv example`), so a `.mcp.json` or install doc written against one

    route works on all of them.


    The pip wrapper (`python/src/entropic/cli.py`) adds exactly one subcommand of

    its own — `install-engine` — handled in-process; every other argv is passed

    through verbatim via `os.execvp` to `bin/entropic`, so the wrapper can never

    silently diverge from the native surface. When the binary cannot be located

    the wrapper exits 2 telling the user to run `entropic install-engine`.


    `download` takes either a bare registry key (`entropic download primary`) or

    the `--family/--size/--quant` selector triple, plus `--list` and `--dir`. The

    three selector flags must be supplied together; a partial selector or an

    unmatched combination is a named error pointing at `--list`, never a silent

    no-op. Downloads are idempotent — an existing non-empty target file is

    skipped — so reruns and interrupted fetches are cheap.


    WHY closed and audited: v2.1.0''s install-route audit found `entropic ask`

    documented in two places but never implemented, so users hit an unknown-

    subcommand error following the project''s own docs. The subcommand list is now

    a published contract (docs/cli-install-routes.md), and pre-v2.1.7 commands

    (`mcp-connect`, the model-loading flavor of `mcp-bridge`) were removed rather

    than left as undocumented aliases.


    Scope note: this requirement owns the CLI surface. Bundled model registry resolution —
    keys, selectors, search order — is REQ-CFG-003.'
  acceptance_criteria: "- Invoking the built binary with no args, with `--help`, and with\
    \ a bogus\n  subcommand yields, respectively: usage + exit 1, usage + exit 0, and\n  `unknown\
    \ subcommand` + usage + exit 1.\n- `<prefix>/bin/entropic version` exits 0 from a staged\
    \ install tree —\n  asserted by `_smoke_staged_install` inside `inv release-check`.\n\
    - `entropic download --list` prints KEY/SIZE/DESCRIPTION for every entry in\n  `data/bundled_models.yaml`;\
    \ `--family X --size Y --quant Z` resolves to the\n  same key `BundledModels::find_by`\
    \ returns; any incomplete selector errors.\n- The pip wrapper forwards unknown argv unchanged\
    \ and returns 2 (not a\n  traceback) when no engine binary is installed.\n"
  verified_by: 'Partial. `inv release-check` → `_smoke_staged_install` (tasks.py:629) runs

    `<stage>/bin/entropic version`. Registry-key resolution behind `download` is

    covered by SCENARIO "BundledModels find_by (family, size, quant) (gh#62)" and

    SCENARIO "BundledModels resolves keys to paths" in

    /home/tvanfossen/Projects/entropic/tests/unit/config/bundled_models_test.cpp.

    No test exercises the dispatcher''s exit codes, `parse_download_args`,

    `resolve_selector_key`, or the wrapper''s execvp passthrough — contract is

    documented only in /home/tvanfossen/Projects/entropic/docs/cli-install-routes.md.

    '
