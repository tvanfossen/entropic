- id: REQ-MCP-024
  name: Engine-level entropic.* tools validate their arguments and emit typed directives
  module: MCP Servers and Tool Dispatch
  description: 'EntropicServer exposes the engine''s own control surface: todo, complete,

    phase_change, prune_context, plus delegate/pipeline when more than one tier

    is configured (single-tier configs skip registering them entirely), plus the

    read-only introspection tools diagnose, inspect, context_inspect, followup,

    and resume_delegation. Control tools return typed directives (stop_processing,

    delegate, pipeline, complete, phase_change, prune_messages, context_anchor,

    notify_presenter) that the engine''s DirectiveProcessor acts on; introspection

    tools return data with NO directives. Arguments are validated before any

    directive is emitted: pipeline requires at least two stages and rejects a

    stage naming a tier not in tier_names, quoting the offending stage and the

    valid options (gh#129); the todo list is kept PER SESSION (gh#158,

    v2.13.0) — keyed by the session the call routed on, shared with that

    session''s delegated children, never with another session, and released

    when the session''s conversation is dropped, cleared or restored;

    complete with `coverage_gap=true` requires a

    non-empty gap_description; followup rejects non-object args, malformed JSON,

    and an empty query with typed errors; resume_delegation requires

    delegation_id and task. The delegate tool''s tier enum excludes source tiers

    so a tier cannot delegate to itself. All introspection tools read engine

    state through the `entropic_state_provider_t` callback struct and return a

    clear "engine state provider not configured" error when it is absent rather

    than dereferencing a null callback.

