- id: REQ-CFG-002
  name: Whole-block replace semantics for models and routing across layers
  module: Configuration
  description: 'Scalar and per-field merging is additive (REQ-CFG-001), but the `models:`

    and `routing:` blocks are NOT deep-merged across the consumer and project

    layers. When a consumer-defaults file or a project config declares a

    top-level `models:` key, the loader first clears the accumulated tier map,

    the router entry and default_tier; when it declares `routing:`, the routing

    config is reset to its compiled default. Only then is that layer parsed.


    WHY: a consumer''s config is a complete application description, not a

    patch. Without replace semantics a tier the application deliberately does

    not define (say a heavyweight `eng` tier from the user''s personal global)

    leaks into the app''s tier set and becomes routable/loadable — a model the

    app never intended to hold in VRAM. Presence is detected by a top-level key

    probe (`yaml_has_key`) before parsing, so declaring `models:` at all is the

    trigger, independent of which tiers it contains.


    Within a single layer, tiers merge into any same-named tier already present

    (`parse_models_config` seeds the TierConfig from the existing entry), so a

    layer that was NOT preceded by a clear still patches field-by-field.

    '
  acceptance_criteria: 'GIVEN a global config carrying an `eng` tier, WHEN a consumer/project
    layer

    that declares `models:` with `lead` and `researcher` is applied, THEN only

    those two tiers survive, `eng` is gone, and default_tier comes from the new

    layer. GIVEN a layer with no `models:` key, THEN prior tiers are preserved

    intact and only the fields it does declare are overlaid.

    '
  verified_by: "SCENARIO(\"Consumer models block replaces global tiers\") —\n  tests/unit/config/loader_test.cpp\n\
    SCENARIO(\"Layered merge — project overlays global\") (negative case: no\n  models-block\
    \ clear when tiers are patched in place) —\n  tests/unit/config/loader_test.cpp\n"
  version: 2.10.4
- id: REQ-CFG-003
  name: Bundled model registry resolution — keys, selectors, and search order
  module: Configuration
  description: "Every model-bearing config field (`models.<tier>.path`, `models.router.path`,\n\
    `inference.speculative.draft.path`, `mmproj:`) accepts either a bundled\nregistry key\
    \ or a literal filesystem path, resolved at parse time by\n`BundledModels::resolve()`:\n\
    \  - A value matching a registry key resolves to `<dir>/<entry.name>.gguf`,\n    where\
    \ `<dir>` is `$ENTROPIC_MODEL_DIR` (operator override, existence\n    deliberately NOT\
    \ required so a not-yet-downloaded destination works),\n    else `~/.entropic/models`\
    \ or `/opt/entropic/models` — first directory\n    that actually holds the file wins,\
    \ and if neither does the home path is\n    returned so error messages point at the intended\
    \ location.\n  - Any other value is treated as a literal path with `~` expansion.\nA tier\
    \ may alternatively select a model structurally via `family` + `size` +\n`quant` (`BundledModels::find_by`),\
    \ which is resolved through the same path\nmachinery. An explicit `path:` always wins\
    \ over a selector.\n\nThe registry itself (`data/bundled_models.yaml`) is located by\n\
    `auto_discover_and_load()` in a fixed order: `$ENTROPIC_DATA_DIR`, then\nbinary-relative\
    \ `<prefix>/share/entropic` derived via dladdr on the loaded\n.so, then the compile-time\
    \ install path, the source tree, then `data/`\nrelative to CWD. WHY the dladdr step (v2.3.6):\
    \ with only compile-time and\nCWD candidates, any relocated install — i.e. every machine\
    \ that is not the\nbuild host, including container-staged release tarballs — silently\
    \ loaded\nzero models and every `path: primary` key failed to resolve.\n"
  acceptance_criteria: 'GIVEN a loaded registry, WHEN a key is resolved with ENTROPIC_MODEL_DIR

    unset, THEN the result is `~/.entropic/models/<name>.gguf`; WHEN

    ENTROPIC_MODEL_DIR is set, THEN the result is `<that dir>/<name>.gguf`;

    WHEN an absolute path is resolved, THEN it is returned unchanged; WHEN a

