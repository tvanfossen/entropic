- id: REQ-CFG-001
  name: Layered configuration resolution with most-specific-layer-wins precedence
  module: Configuration
  description: "Configuration is resolved by overlaying named layers onto compiled struct\n\
    defaults, in a fixed order where later layers override earlier ones:\n\n  1. Compiled\
    \ defaults (C++ struct initializers in types/config.h)\n  2. Global user config      (~/.entropic/config.yaml)\n\
    \  3. Consumer/app defaults   (default_config.yaml, load_layered only)\n  4. Project-local\
    \ config    (<project_dir>/config.local.yaml)\n  5. Environment overrides   (ENTROPIC_*\
    \ / ENTROPIC_{SECTION}__{FIELD})\n\n`parse_config_file()` is the single merge primitive:\
    \ a key absent from a\nlayer's YAML leaves the value from the prior layer untouched, so\
    \ each layer\nis a patch rather than a whole document. Env overrides are applied AFTER\
    \ all\nfile layers and BEFORE validation, so an operator can always override a\nshipped\
    \ config without editing files, but never past validation.\n\nWHY the consumer layer sits\
    \ above global (changed in v2.0.6): before that,\nconsumer defaults loaded first and a\
    \ user's aggressive personal global\n(e.g. `context_length: 131072`) silently overrode\
    \ an application's\ndeliberate lightweight defaults (`16384`) — inverting the precedence\
    \ a\nconsumer expects. The app knows its own resource envelope; the user's\nproject-local\
    \ file is still the most specific and wins over both.\n\nPublic entry points: `load_config()`\
    \ (global+project), `load_layered()`\n(global+consumer+project+.mcp.json discovery), `load_config_from_file()`\n\
    and `load_config_from_string()` (single-document, no layering — both still\nrun env overrides\
    \ then validation). All return \"\" on success and a\nhuman-readable error string on failure;\
    \ none throw across the boundary.\n"
  acceptance_criteria: 'GIVEN a global config declaring lead.gpu_layers=40, adapter=qwen35
    and an

    eng tier, WHEN a project config that sets only gpu_layers=20 is overlaid,

    THEN gpu_layers becomes 20 while adapter and the eng tier are preserved.

    GIVEN a consumer-defaults file with log_level WARN and a project file with

    log_level ERROR, WHEN load_layered runs, THEN log_level is ERROR and the

    consumer''s tier values survive where the project did not restate them.

    GIVEN ENTROPIC_LOG_LEVEL / ENTROPIC_MODELS__DEFAULT / ENTROPIC_ROUTING__*

    / ENTROPIC_COMPACTION__* / ENTROPIC_VRAM_RESERVE_MB / ENTROPIC_CONFIG_DIR

    are set, WHEN load runs, THEN each overrides the file-derived value; WHEN

    unset, THEN the config is left unchanged (no clobbering with empty).

    Every public entry runs parse -> env overrides -> validate in that order,

    and a parse error short-circuits before validation.

    '
  verified_by: "SCENARIO(\"Layered merge — project overlays global\") —\n  tests/unit/config/loader_test.cpp\n\
    SCENARIO(\"load_layered's consumer-defaults layer overlays before project\") —\n  tests/unit/config/loader_test.cpp\n\
    SCENARIO(\"load_layered overlays a project config.local.yaml when present\") —\n  tests/unit/config/loader_test.cpp\n\
    SCENARIO(\"load_config drives global + project + env + validate chain\") —\n  tests/unit/config/loader_test.cpp\n\
    SCENARIO(\"load_config_from_file is the single-file public entry\") —\n  tests/unit/config/loader_test.cpp\n\
    SCENARIO(\"load_config_from_string drives parse_config_string + validate\") —\n  tests/unit/config/loader_test.cpp\n\
    SCENARIO(\"Parse minimal config\"), SCENARIO(\"Parse config with tiers\") —\n  tests/unit/config/loader_test.cpp\n\
    SCENARIO(\"ENTROPIC_LOG_LEVEL overrides config\"),\nSCENARIO(\"ENTROPIC_ROUTING__ENABLED\
    \ overrides routing flag\"),\nSCENARIO(\"ENTROPIC_COMPACTION__THRESHOLD_PERCENT overrides\
    \ threshold\"),\nSCENARIO(\"ENTROPIC_MODELS__DEFAULT overrides default tier\"),\nSCENARIO(\"\
    ENTROPIC_ROUTING__FALLBACK_TIER overrides fallback\"),\nSCENARIO(\"ENTROPIC_COMPACTION__ENABLED\
