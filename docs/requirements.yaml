- id: REQ-MCP-014
  name: A locked tier's allowed_tools list is enforced at dispatch time
  module: MCP Servers and Tool Dispatch
  description: 'When the loop context has a locked tier and the facade has wired the

    tier -> allowed_tools map, ToolExecutor rejects any call whose tool name is

    not in that tier''s list, with a message naming the tier and the tool and

    kind rejected_unauthorized (gh#83). The map is held as a pointer to the

    facade-owned live map so wiring order does not matter; a null pointer or an

    empty locked tier means no enforcement (the pre-v2.5.2 pass-through).

    Rejections are logged at warning level. WHY: prompt-level "you may only use

    these tools" instructions are advisory to a model; this makes the tier

    restriction a hard gate.

    '
  acceptance_criteria: 'Given a locked tier with an allowed_tools list not containing the
    called

    tool, When the call is processed, Then it is rejected before dispatch with

    a message naming tier and tool; Given no locked tier or no wired map, Then

    the call proceeds unchanged.

    '
