- id: REQ-API-005
  name: Uniform precondition guard on every exported entry point
  module: Public C API and Facade
  description: "Every exported function validates its preconditions before touching engine\
    \ state,\nand the mapping is uniform across the whole surface so a consumer can write\
    \ one\nerror-handling path:\n  - NULL handle                       -> ENTROPIC_ERROR_INVALID_HANDLE\n\
    \  - NULL required in/out pointer      -> ENTROPIC_ERROR_INVALID_ARGUMENT\n  - handle\
    \ not yet configured, or the\n    required subsystem is null        -> ENTROPIC_ERROR_INVALID_STATE\n\
    Shared private predicates `check_orchestrator`, `check_mcp_auth`, and\n`check_identity`\
    \ implement the handle+configured+subsystem check once each,\nrather than repeating it\
    \ per function. Functions that return `char*` instead of\nan error code (e.g. `entropic_list_mcp_servers`,\
    \ `entropic_adapter_list`,\n`entropic_grammar_list`, `entropic_validation_last_result`)\
    \ signal the same\nfailures by returning NULL. Functions returning a scalar\n(`entropic_seconds_since_last_activity`,\
    \ `entropic_check_mcp_key`,\n`entropic_model_has_vision`, `entropic_throughput_tok_per_sec`)\
    \ return a\ndocumented neutral value (0) rather than an error.\n\nWHY: the C boundary\
    \ is the last line of defence against a consumer bug. Nothing\npast this guard may dereference\
    \ a null subsystem pointer.\n"
  acceptance_criteria: 'For each exported function: calling it with a NULL handle returns

    INVALID_HANDLE (or NULL / 0 for non-error-code returns); calling it with a NULL

    required pointer argument returns INVALID_ARGUMENT; calling it on a created-but-

    unconfigured handle returns INVALID_STATE (or a documented benign no-op such as

    entropic_clear_user_message_queue -> OK, entropic_user_message_queue_depth -> 0).

    No call in any of these shapes crashes or throws.

    '
  verified_by: "~200 TEST_CASEs of the form \"entropic_<fn> rejects NULL handle\" /\n  \"\
    rejects NULL out-param\" / \"on unconfigured handle returns INVALID_STATE\"\n  — tests/unit/api/entropic_capi_test.cpp\n\
    SCENARIO(\"queue: NULL handle is rejected on every entry point\") — tests/unit/api/message_queue_abi_test.cpp\n\
    SCENARIO(\"queue: clear on unconfigured handle is OK no-op\") — tests/unit/api/message_queue_abi_test.cpp\n\
    SCENARIO(\"entropic_list_mcp_servers on an unconfigured handle returns NULL\") — tests/unit/api/entropic_mcp_test.cpp\n\
    SCENARIO(\"entropic_storage_close before any open is a safe no-op\") — tests/unit/api/facade_integration_test.cpp\n\
    SCENARIO(\"Load identity with null handle\") — tests/unit/api/identity_api_test.cpp\n"
