- id: REQ-API-013
  name: Identity frontmatter threaded into config before the orchestrator snapshot
  module: Public C API and Facade
  description: 'During configure the facade parses each tier''s identity markdown (explicit

    `identity:` path, else `{data_dir}/prompts/identity_{tier}.md`, unless

    `identity_disabled`) and threads its frontmatter into the tier''s configuration.

    Ordering is a hard requirement: the orchestrator snapshots `h->config` BY VALUE

    in `init_orchestrator`, so all dependency-free SAMPLER knobs must be threaded by

    `thread_frontmatter_samplers()` BEFORE that call — `grammar`, `temperature`,

    `max_output_tokens`, `top_p`, `top_k`, `min_p`, `presence_penalty`,

    `frequency_penalty`, `repeat_penalty`, `enable_thinking`. Engine-dependent

    frontmatter (`allowed_tools`, `validation_rules`, `relay_single_delegate`) is

    applied later, after the engine exists, and the populated per-tier allowed-tools

    map is handed to the `ToolExecutor` by pointer for dispatch-time enforcement.


    WHY: this is a repeated failure class. gh#94 (v2.7.3) threaded samplers AFTER the

    snapshot, so values landed in `h->config` but never in the orchestrator''s frozen

    copy and every tier silently ran `GenerationParams` defaults. gh#95 (v2.7.4)

    dropped the identity `grammar:` key entirely, so a grammar registered fine and

    never enforced. Same class as gh#82/85. A frontmatter field that parses but does

    not reach the backend is indistinguishable from a working feature at the config

    layer — the requirement is end-to-end arrival, not parse success.

    '
  acceptance_criteria: 'GIVEN a tier identity whose frontmatter sets a sampler knob or a grammar
    key

    WHEN the handle is configured THEN the orchestrator''s frozen per-tier config

    carries that value, and generation for that tier runs under it — not under the

    GenerationParams default.

    Grammar resolution precedence holds: an explicit grammar_key beats frontmatter,

    a raw grammar string beats a grammar_key, an unknown key leaves generation

    unconstrained, and a frontmatter grammar name is accepted with or without the

    .gbnf extension.

    '
