    is

    created; given an unknown name, Then GenericAdapter is created. Given

    multi-parameter XML with mixed close tags, Then every parameter is

    extracted. Given a parroted {action: …} envelope and an empty parse, Then

    the recovery substitutes calls and logs. Given a string-typed schema

    parameter parsed as a number, Then it is coerced back to its string form;

    an unknown tool is a no-op.

