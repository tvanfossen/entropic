- id: REQ-MCP-011
  name: Every tool declares its required access level, defaulting to WRITE
  module: MCP Servers and Tool Dispatch
  description: '`ToolBase::required_access_level()` returns MCPAccessLevel::WRITE unless a

    tool overrides it; read-only tools (filesystem read_file/glob/grep/

    list_directory, entropic diagnose/inspect/context_inspect/followup,

    diagnostics tools) override to READ. ServerManager exposes the level per

