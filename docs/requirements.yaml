- id: REQ-MCP-020
  name: A bounded, thread-safe ring buffer retains recent tool calls for introspection
  module: MCP Servers and Tool Dispatch
  description: 'Every completed tool call is recorded into a fixed-capacity (default 100)

    ring buffer with a monotonic sequence number, fully-qualified tool name,

    a params summary of top-level argument KEYS only (never values), status,

    a result summary truncated to 200 characters, elapsed ms, error detail, and

    the loop iteration. When full, the oldest record is overwritten. Reads

    (`recent` newest-first, `all` oldest-first, `to_json`) use a shared_mutex

    so multiple readers can run concurrently with a single writer. This is

    explicitly NOT the audit log — it is a lightweight diagnostic window backing

    `entropic.diagnose`/`entropic.inspect` and the validator''s retry enrichment.

    '
  acceptance_criteria: 'Given more records than capacity, Then size stays at capacity and
    the

    oldest entries are gone while wrap-around ordering stays correct; Given

    concurrent writers and readers, Then no data race and reads return

    well-formed records; params_summary contains only key names; result_summary

    over 200 chars is truncated and shorter ones are unchanged; to_json emits

    valid JSON honouring the count limit and includes error_detail when set.

    '
