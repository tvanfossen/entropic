  name: Family-aware streaming reasoning filter with UTF-8 alignment
  module: Agent Loop
  description: 'Tokens streamed to the consumer callback must have the model

    family''s reasoning block removed, while an optional raw callback

    receives every token unfiltered. Delimiters are constructor

    parameters (default <think>/</think>, e.g. <|channel>/<channel|> for

