- id: REQ-MCP-017
  name: PRE/POST_TOOL_CALL hooks fire on every exit path and POST may rewrite the result
  module: MCP Servers and Tool Dispatch
  description: 'PRE_TOOL_CALL fires with tool name, args, tier, and iteration before

    dispatch; a non-zero return cancels the call. POST_TOOL_CALL fires for

    EVERY outcome — executed, pre-hook cancel, and each precondition rejection —

    carrying tool_name, args, result, directives, elapsed_ms, tier, iteration,

    and the typed result_kind, so no exit path drops the hook. If the hook

    writes `*modified_json`, that string REPLACES the message content the call

    produced (before v2.1.1 the engine freed it without applying it, silently

    breaking redaction/enrichment hooks); a null transformation leaves content

    untouched, and with chained hooks the last write wins. `result_kind` is

    computed before the hook fires and is an INPUT to the hook, so a transformed

    content may not match the kind downstream code carries — intentional.

    '
  acceptance_criteria: 'Given a wired hook pair, When a call succeeds, Then both hooks fire;
    When

    the pre-hook cancels, Then dispatch is skipped and POST still fires; When a

    precondition rejects, Then POST fires with the corresponding kind; When the

    POST hook writes a modified string, Then the resulting message content is

    the modified string on the success, duplicate-rejection, and

    schema-rejection paths alike.

    '
  verified_by: '"PRE/POST_TOOL_CALL fire for successful calls", "PRE_TOOL_CALL cancel

    short-circuits dispatch and still fires POST", "POST_TOOL_CALL hook

    transforms successful tool result content", "POST_TOOL_CALL hook transforms

    duplicate-rejection content", "POST_TOOL_CALL hook transforms

    schema-rejection content", "POST_TOOL_CALL with *modified_json == NULL

    leaves content untouched", "Chained POST_TOOL_CALL hooks: last write wins"

    — tests/unit/mcp/tool_executor_test.cpp

    '
