- id: REQ-STOR-008
  name: Append-only JSONL audit log with rotation and untruncated payloads
  module: Persistence and Storage
  description: 'Every MCP tool call is recorded as exactly one JSON line in `audit.jsonl`
    under

    the configured log dir. The AuditLogger is a passive POST_TOOL_CALL hook observer:

    its static callback always sets `*modified_json = NULL` and returns 0, so it can

    never alter or cancel a tool call, and a malformed hook context is caught and

    logged rather than propagated. Each line carries the per-call payload plus

    logger-supplied metadata (schema `version`, millisecond UTC timestamp,

    `session_id`, and a monotonic `sequence` from an atomic counter). Writes are

    serialized by a mutex and flushed per `flush_interval_entries`, so concurrent tool

    threads produce complete, non-interleaved, non-duplicated lines. Opening an

    existing log appends rather than truncates. When `max_file_size` is exceeded the

    file rotates (`audit.jsonl` -> `.1`, shifting up to `max_files`, oldest dropped).

    `params_json` and `result_content` are written in full — never truncated or

    summarized — because a truncated audit record cannot answer the question it exists

    to answer. With `enabled=false` no file is created and record() is a no-op.

    '
  acceptance_criteria: 'Given an enabled logger, When initialize() is called, Then audit.jsonl
    exists at

    log_path(); When record() is called, Then exactly one parseable JSON line is

    appended carrying tool_name, caller_id, sequence, session_id and timestamp.

    Given multiple records, Then sequence numbers are monotonic and entry_count()

    equals the number of record() calls.

    Given many threads recording concurrently, Then every line is complete valid JSON

    and no sequence number is duplicated.

    Given an existing audit.jsonl, When a new logger initializes, Then prior lines are

    preserved and new ones appended.

    Given max_file_size exceeded, Then the file rotates and the number of retained

    rotated files respects max_files.

    Given oversized params/result strings, When serialized and read back, Then they

    are byte-identical to the input.

    Given enabled=false, When record() is called, Then no file is created.

    '
  verified_by: 'SCENARIO("AuditLogger creates file on initialize") — tests/unit/storage/audit_logger_test.cpp

    SCENARIO("AuditLogger records a single JSONL line") — tests/unit/storage/audit_logger_test.cpp

    SCENARIO("AuditLogger sequence numbers are monotonic") — tests/unit/storage/audit_logger_test.cpp

    SCENARIO("AuditLogger concurrent writes produce no duplicates") — tests/unit/storage/audit_logger_test.cpp

    SCENARIO("Concurrent writes produce complete JSON lines") — tests/unit/storage/audit_logger_test.cpp

    SCENARIO("AuditLogger appends to existing file") — tests/unit/storage/audit_logger_test.cpp

    SCENARIO("AuditLogger rotates at max_file_size") — tests/unit/storage/audit_logger_test.cpp

    SCENARIO("AuditLogger rotation respects max_files") — tests/unit/storage/audit_logger_test.cpp

