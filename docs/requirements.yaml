    returns

    the family marker or "" for CONTENT_ONLY/unknown. Given tool_call_mode

    != "sequential" or an empty marker, Then append_sequential_stop is a

    no-op; given the marker already present in params.stop, Then it is not

    duplicated. Given a sequential tier on a real model, Then generation halts

    at the first closed tool call; the batch-mode contrast may generate past

    it.

