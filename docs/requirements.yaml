- id: REQ-INFER-015
  name: MTP speculative decode fails loud and never silently falls back
  module: Inference Backends
  description: 'When a consumer enables speculative.mtp, the MTP route OWNS the outcome:

    it either runs the target-owned shared-KV MTP kernel or returns a typed,

    actionable error that is propagated to the caller. It must never degrade

    to plain decode, because a silent fallback masks that MTP never engaged

    and the consumer never corrects the config.


    Guards, in order, all fail-loud: the target must be ACTIVE

    (INVALID_STATE); the request must be inside the envelope

    (SPECULATIVE_INCOMPATIBLE_CONFIG); the head GGUF must load (LOAD_FAILED);

    and n_draft+1 must fit n_batch (INCOMPATIBLE_CONFIG, naming both numbers

    and the corrective knob). A non-llama.cpp target yields NOT_SUPPORTED with

    "disable speculative.mtp". Separately, a 1–2 layer draft GGUF routed to

    the CLASSICAL separate-draft path is caught by looks_like_mtp_head and

    refused with a message naming the layer count and speculative.mtp: true —

    that configuration crashes in fattn.cu otherwise.


    The envelope itself has been narrowed to nothing over v2.9.x–v2.10.0:

    tools, flash_attn, temperature>0, grammar and streaming were each removed

    as guards once the underlying gap was actually fixed (stop-handling,

    upstream #25148, the point-mass draft proof, grammar propagation through

    to_common_sampling, and StreamThinkFilter respectively). MTP head setup

    and teardown are serialized against in-flight generation by a mutex so a

    concurrent deactivate cannot free the head context mid-decode.

    '
  acceptance_criteria: 'Given an MTP request outside the envelope or with a config fault,
    Then a

    typed loud error is returned and no plain-decode fallback occurs. Given

    every envelope condition, Then mtp_unsupported_reason returns "" (the

    envelope is fully open). Given a 1–2 layer draft on the classical path,

    Then INCOMPATIBLE_CONFIG names the layer count and the mtp flag. Given a

    per-tier speculative_mtp override, Then it wins over the global flag.

    '
  verified_by: 'TEST_CASE "gh#108 MTP envelope: the safe case yields no error", "tools are

    NOT guarded", "all conditions are now open", "temperature is not guarded

    at any value", "grammar is not guarded", "streaming is not guarded",

    "gh#107: looks_like_mtp_head detects small-layer GGUFs" / "message

    mentions mtp flag" — tests/unit/inference/mtp_envelope_test.cpp;

    TEST_CASE "gh#108 MTP guards: out-of-envelope requests fail loud",

    "MTP + flash attention succeeds", "MTP + flash + q4 KV succeeds" —

    tests/model/test_gh108_mtp_guards.cpp;

    TEST_CASE "gh#108 MTP loud error propagates through orchestrator (no

    fallback)", "gh#108 per-tier speculative_mtp=false overrides the global

