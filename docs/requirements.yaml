- id: REQ-INFER-007
  name: Named grammars are registered, validated, and resolved by a fixed precedence
  module: Inference Backends
  description: 'GrammarRegistry is the single store for named GBNF grammars: it loads

    bundled *.gbnf from a directory (file stem becomes the key), accepts

    runtime registration from a string or a file, validates on registration

    via a throwaway llama sampler (an invalid grammar is still registered but

    flagged with error metadata rather than silently dropped), and is

    thread-safe for concurrent register/get.


    Resolution into GenerationParams::grammar follows one precedence: an

    explicit raw params.grammar wins outright; otherwise params.grammar_key

    is looked up; otherwise the tier''s identity frontmatter `grammar:` field

    (with .gbnf extension normalised away).


    A TIER stem that does not resolve fails LOUD at FIRST USE, never

    silently (gh#154). Configure WARNS, naming every unresolved tier, its

    stem, every directory searched and how to register it; a run that then

    SELECTS such a tier returns ENTROPIC_ERROR_GRAMMAR_NOT_FOUND

    (ModelOrchestrator::refuse_unresolved_tier_grammar) with nothing

    decoded — the check runs before get_model, so no model swap and no

    prefill happen either. Configure does not refuse, because

    entropic_grammar_register / entropic_grammar_register_file both require

    an orchestrator and therefore cannot be called until configure has

    returned: refusing there would make the documented

    configure-then-register sequence impossible to perform.

    The fail-open it replaces was undetectable from outside, because

    constrained and unconstrained output have the same shape whenever the

    prompt also describes the shape. An unresolvable RUNTIME key

    (params.grammar_key) is per-call and still logs a warning and leaves the

    decode unconstrained — it may name a grammar registered later — and the

    miss is reported on the result as grammar.resolved == false with the

    named key carried.

    '
  acceptance_criteria: 'Given a registry, When grammars are registered from string/file/directory

    and deregistered, Then get/has/list/size reflect the mutations and

    duplicate keys are rejected. Given a malformed GBNF, Then validate returns

    a non-empty error and the entry records it. Given params carrying a raw

    grammar, a grammar_key, and a tier frontmatter grammar, Then resolution

    picks them in that order; an unknown runtime key leaves the params

    unconstrained and is recorded with resolved == false. Given a tier naming

    a grammar stem with no matching .gbnf in any search path, Then configure

    SUCCEEDS with a warning naming the tier, the stem and every directory

    searched, And a run selecting that tier returns

    ENTROPIC_ERROR_GRAMMAR_NOT_FOUND with no content and no tokens, And

    registering that key afterwards lets the same tier run normally.

    '
