- id: REQ-LOOP-003
  name: Fixed per-iteration pipeline with pre-generate cancellation
  module: Agent Loop
  description: 'Each loop iteration runs a fixed ordered pipeline: refresh context

    limit -> prune old tool results -> check compaction -> fire

    ON_CONTEXT_ASSEMBLE -> set EXECUTING -> fire PRE_GENERATE (a

    non-zero return cancels the iteration and forces COMPLETE) ->

    generate -> dispatch POST_GENERATE -> parse tool calls -> execute

    tools or evaluate the no-tool decision -> charge thinking budget ->

    dispatch any pending delegation/pipeline or halt.

    Dispatch of a queued delegation/pipeline is guarded twice: an

    interrupt observed during tool processing transitions to INTERRUPTED

    instead of launching a child (gh#81), and a terminal state set by a

    sibling tool call (e.g. entropic.complete emitted alongside

    entropic.pipeline) drops the queued action rather than running it

    (gh#77). Delegation and pipeline dispatch decrement the iteration

    counter so a child run does not consume the parent''s budget.

    '
  acceptance_criteria: 'Given a PRE_GENERATE hook returning non-zero, When the iteration

    runs, Then generation is skipped and state becomes COMPLETE.

    Given entropic.complete and entropic.pipeline in the same batch,

    When tool results are processed, Then the pipeline is dropped and

    the turn ends COMPLETE.

    Given interrupt() raised while tools execute, When dispatch is

    reached, Then state is INTERRUPTED and no delegation starts.

    '
  verified_by: 'TEST_CASE "hook dispatch: info / PRE_GENERATE cancel /

    POST_GENERATE rewrite / ON_ERROR"; SCENARIO "gh#77: entropic.complete

    is terminal when emitted with sibling pipeline"; SCENARIO "gh#81:

    interrupt during tool processing halts before pending dispatch" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/engine_test.cpp

