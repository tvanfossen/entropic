- id: REQ-INFER-006
  name: Sampler chain construction has a fixed order and default-preserving gating
  module: Inference Backends
  description: 'Per-generation sampling is built behind the Sampler / SamplerFactory seam

    so the chain is constructible and observable without a GPU. The

    production chain order is fixed: grammar -> penalties -> top-k -> top-p ->

    min-p -> temperature -> dist. Stages are gated so that a default-valued

    knob leaves the chain shape byte-identical to before that knob existed —

    temperature==0 omits the temperature sampler entirely (true greedy),

    min_p==0 omits min-p, empty logit_bias omits the bias stage, and

    zero penalties leave the penalties stage disabled.


    This ordering is a correctness contract, not a style choice: the

    speculative path builds a common_params_sampling that must mirror it

    exactly, or speculative output stops being distribution-identical to

    plain decode (REQ-INFER-016).

    '
