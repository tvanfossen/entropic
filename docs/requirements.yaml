- id: REQ-INFER-020
  name: Tier routing, handoff rules and secondary model roles
  module: Inference Backends
  description: 'When no explicit tier is given, the orchestrator routes by running a small

    router model as a raw completion (no chat template) and mapping the emitted

    digit to a tier via the configured tier_map. Routing is skipped — falling

    through to the default tier — when routing is disabled or no router is

    configured. Each decision is recorded in a RoutingResult carrying the

    selected tier, the previous tier, the raw model output, the swap action

    (none/reused/loaded), and routing plus adapter-swap timing; a bounded tier

    history is kept. Handoff rules restrict which tier may hand off to which,

    and an empty rule set denies all pairs.


    Non-primary models live in a role-keyed SecondaryModelLoader ("router",

    "draft", future "thinking") with independent lifecycle: lazily loaded,

    idempotent against the same path, reloaded when the path changes, released

    per role, and included in the pool-wide prompt-cache invalidation. A draft

    model that fails to load logs and degrades to plain decode but never

    blocks engine initialisation, because speculative is opt-in.


    Scope note: this requirement owns tier routing and secondary model roles. Handoff rules
    and auto-chain continuation are REQ-IDEN-003.'
  acceptance_criteria: 'Given routing disabled or no router configured, Then route returns
    the

    default tier and records swap_action "none". Given a router configured but

    unloadable, Then routing degrades without crashing. Given an empty handoff

    rule set, Then can_handoff is false for any pair. Given a bogus secondary

    model path, Then ensure_loaded fails cleanly, the role is not listed as

    loaded, and shutdown/clear_all_prompt_caches are safe no-ops.

    '
  verified_by: 'SCENARIO "Handoff rules", "Orchestrator route() exercises both enabled and

    disabled paths", "Orchestrator can_handoff with empty rules returns false

    for any pair" and TEST_CASE "Orchestrator route() with router configured

    but unloadable" — tests/unit/inference/orchestrator_test.cpp;

    TEST_CASE "SecondaryModelLoader: empty loader has no roles", "release of

    unknown role is false", "ensure_loaded with bogus path fails cleanly",

    "shutdown is idempotent on empty", "clear_all_prompt_caches no-op when

    empty", "v2.3.10 topup — failure isolation + idempotency" —

    tests/unit/inference/secondary_model_loader_test.cpp;

    SCENARIO "Classification runs the router and yields a configured tier" and

    "Cleared classification_prompt makes routing a no-op (RED control)" —

    tests/model/test_tier_routing.cpp

    '
  version: 2.10.4
- id: REQ-INFER-021
  name: Per-tier sampler configuration applies only where the caller did not decide
  module: Inference Backends
  description: 'A tier''s identity frontmatter may set temperature, max_output_tokens,

    top_p, top_k, min_p, presence_penalty, frequency_penalty, repeat_penalty,

    enable_thinking and tool_call_mode. Each is optional, and each is applied

    to the outgoing GenerationParams ONLY when the tier set it AND the

    incoming param is still at the GenerationParams struct default — so an

    explicit per-call value always survives. The rule lives in a free function

    so the precedence is unit-testable without a model, and the member wrapper

    that copies tier fields into that struct is separately reachable from a

    test because the hand-copy itself is a place mistakes hide.


    Alongside this, ThroughputTracker maintains an EWMA of tokens/sec from

    completed generations (ignoring degenerate samples under 4 tokens or with

    non-positive elapsed time) so max_tokens can be recommended against a

    wall-clock budget with a headroom fraction and a floor, returning the floor

    when there is no data.

    '
  acceptance_criteria: 'Given a tier that sets a knob and a call that leaves it at default,
    Then

    the tier value is applied; given a call that sets it explicitly, Then the

    call value survives; given a tier that does not set it, Then nothing

    changes. Given the member path, Then all tier knobs map to their params

    counterparts. Given throughput samples, Then EWMA smoothing, prediction

    and recommendation behave as documented and degenerate samples are ignored.

    '
  verified_by: 'SCENARIO "gh#82: apply_tier_sampler_overrides honors tier baseline +

    per-call override", "gh#85: the remaining sampler knobs apply with the

    same precedence", "gh#86: enable_thinking + repeat_penalty thread through

    to params", "Orchestrator member apply_tier_sampler_defaults maps all 8 …"

    — tests/unit/inference/orchestrator_test.cpp;

    SCENARIO "First sample sets initial EWMA", "Subsequent samples smooth via

    EWMA", "Degenerate samples are ignored", "recommend_tokens with headroom"

    / "respects floor" / "returns floor with no data", "EWMA adapts to

    sustained throughput change", "Concurrent record and read are thread-safe"

    — tests/unit/inference/throughput_tracker_test.cpp

    '
  version: 2.10.4
- id: REQ-INFER-023
  name: LoRA adapters hot-swap under a single-HOT-per-context constraint
  module: Inference Backends
  description: 'AdapterManager owns LoRA lifecycle: COLD -> WARM (loaded against a base

    model) -> HOT (attached to a llama_context). At most one adapter is HOT

    per context, so activating a second one deactivates the incumbent

    atomically; swapping to the already-active adapter is a no-op. Loading a

    duplicate name, loading against a null model, activating an unknown

    adapter, or swapping a COLD adapter all fail cleanly rather than

    corrupting state.


    The orchestrator drives this per tier: a tier with adapter_path activates

    its adapter on the active context, and a tier without one deactivates

    whatever is HOT — so a tier never silently inherits the previous tier''s

    LoRA. Swap timing and the active adapter name are recorded on the routing

    result. An ON_ADAPTER_SWAP pre-hook can veto a swap. State queries are

    safe under concurrent access.


    Adapters are preloaded at the ACTIVATION of their base model, not at

    engine init — the init-time preload required a loaded model, which is true

    of one tier only, so every other tier''s adapter silently never loaded.

    Two ways of losing a model are therefore distinguished: a tier being

    REPLACED erases its adapter entries (unload_all_for_model), while a tier

    being RELEASED for later reuse (gh#164) frees only the llama handles and

    keeps the name → path/scale registration, COLD, to be re-bound at the next

    activation. Loading a name whose registration was released re-initialises

    it in place; loading a name that still holds a handle is still a duplicate

    and still fails.

    '
  acceptance_criteria: 'Given the documented transitions, Then load/activate/deactivate/unload
    and

    swap move adapters between COLD/WARM/HOT as specified and activating one

    deactivates the current HOT. Given a duplicate name, a null model, an

    unknown name, or a COLD swap target, Then the operation returns false.

    Given a registered ON_ADAPTER_SWAP hook that cancels, Then the swap does

    not occur. Given concurrent state queries during a swap, Then no data race

    or inconsistent read occurs.

    '
  verified_by: 'TEST_CASE "AdapterManager load transitions COLD to WARM", "activate

    transitions WARM to HOT", "Activate deactivates current HOT adapter",

    "Deactivate transitions HOT to WARM", "Unload transitions any state to

    COLD", "Swap atomically switches adapters", "Swap on COLD adapter fails",

    "Load duplicate name fails", "Load with null model fails", "Activate

    unknown adapter fails", "Swap to already active adapter is no-op",

    "ON_ADAPTER_SWAP hook fires during swap" / "can cancel swap", "State

    queries during swap are thread-safe" —

    tests/unit/inference/adapter_manager_test.cpp;

    SCENARIO "LoRA adapter load failure is handled gracefully" —

    tests/model/test_adapter_lifecycle.cpp;

    SCENARIO "gh#164: releasing a model''s handles keeps its registrations",

    "gh#164: a WARM duplicate is still refused" —

    tests/unit/inference/adapter_manager_test.cpp

    '
  version: 2.13.0
- id: REQ-INFER-024
  name: Backends declare capabilities and expose state and log-probability introspection
  module: Inference Backends
  description: 'A backend declares what it supports through a capability bitmask

    (queryable individually or as a set) and publishes metadata via

    BackendInfo populated from model metadata after load; the base class

    default is "no capabilities" and a name-only info, so an unimplemented

    backend under-promises rather than over-promises. Capability declaration

    is what gates sequence state save/restore: with neither KV_CACHE nor

    HIDDEN_STATE the C ABI returns NOT_SUPPORTED instead of attempting the

    operation. Architecture detection at load time (recurrent, hybrid) feeds

    capability reporting and the speculative and batch gates.


    Sequence state can be saved to, restored from, and cleared by a caller-

    owned byte buffer (seq_id -1 clears all). Log-probability evaluation

    computes per-token log-softmax values plus perplexity for a token

    sequence, requires ACTIVE and at least 2 tokens, runs under its own mutex

    on a temporary KV sequence id so it neither blocks nor mutates generation

    state, and is deterministic across repeated calls.

    '
  acceptance_criteria: 'Given a base backend, Then no capability is reported and info carries
    only

    the name; given an overriding backend, Then declared capabilities and

    populated info are reported and the capability count matches the enum.

    Given state operations on a backend without support or not loaded, Then

    they return false. Given fewer than 2 tokens or a non-ACTIVE model, Then

    evaluate_logprobs is rejected; given a valid sequence, Then perplexity

    equals exp(-mean(logprobs)), total_logprob equals the sum, and repeated

    calls agree.

    '
  verified_by: 'SCENARIO "Base class defaults to no capabilities", "Overridden

    capabilities are reported correctly", "Default backend info has name

    only", "Overridden backend info populates fields", "Default state

    operations return false", "State operations require loaded model",

    "Overridden clear_state works when loaded", "_COUNT equals number of real

