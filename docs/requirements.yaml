- id: REQ-PROD-002
  name: mcp-bridge is a byte-transparent stdio-to-socket relay, never an engine
  module: CLI and Distribution
  description: "`entropic mcp-bridge` lets any MCP client (Claude Code, VSCode) consume a\n\
    running engine with zero code — the user writes\n`{\"command\": \"entropic\", \"args\"\
    : [\"mcp-bridge\"]}` into `.mcp.json` and\nnothing else. The bridge connects to the engine's\
    \ external MCP unix socket\nand shuttles newline-framed JSON-RPC 2.0 bytes in both directions.\n\
    \nProduct guarantees the user relies on:\n  - It creates no engine handle and loads no\
    \ model. An engine must already be\n    running for the same project directory; the bridge\
    \ is an optional service\n    on top of one, never a substitute.\n  - The socket path\
    \ is derived by hashing the canonicalized project directory\n    (`compute_socket_path`,\
    \ shared with the engine), so consumers never write\n    a path into their config. `--project-dir\
    \ DIR` retargets it; `--socket PATH`\n    bypasses discovery entirely for non-standard\
    \ deployments and deterministic\n    tests.\n  - Relay is byte-transparent — no JSON-RPC\
    \ parsing at all. Server-initiated\n    frames (notifications/progress, streaming, out-of-order\
    \ responses) pass\n    through a poll(2) loop that services both directions independently,\
    \ so\n    pushed frames arrive even with no request in flight. Future MCP protocol\n \
    \   revisions ride through without code change here.\n  - stdout carries relayed bytes\
    \ only. Every diagnostic goes to stderr, per\n    the MCP stdio transport contract — a\
    \ single stray banner on stdout would\n    corrupt the client's frame stream.\n  - Missing\
    \ engine is a fast, loud failure: exit 1 with a diagnostic naming\n    cwd, canonical\
    \ path, hash, and computed socket path — not a hang, and not\n    a silently-started second\
    \ engine.\n  - stdin EOF (client exited) triggers `shutdown(SHUT_WR)` on the socket so\n\
    \    the engine's `serve_client` tears the per-client thread down cleanly.\n"
  acceptance_criteria: "- Spawning the bridge against a nonexistent socket path exits with\
    \ status 1.\n- A line written to bridge stdin arrives byte-for-byte at the socket peer,\n\
    \  and a line written by the peer arrives byte-for-byte on bridge stdout.\n- Nothing other\
    \ than relayed frames is ever written to stdout.\n"
  verified_by: 'SCENARIO "mcp-bridge exits non-zero with diagnostic when no engine" and

    SCENARIO "mcp-bridge relays bytes between stdio and the socket"

    (tags [mcp_bridge][cli][2.1.7][gh34]) in

    /home/tvanfossen/Projects/entropic/tests/unit/mcp/mcp_bridge_relay_test.cpp

    — the test forks the real `entropic` binary, so it covers the shipped CLI,

    not a library stand-in. Socket-path discovery from project_dir and the

    stderr-only discipline are not directly asserted (tests use `--socket`).

    '
