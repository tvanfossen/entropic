  version: 2.13.0
- id: REQ-HOOK-001
  name: Thread-safe hook dispatch with priority, chaining and isolation
  module: Hook Points
  description: 'HookRegistry holds a priority-ordered entry list per hook point

    behind a per-point shared_mutex. Registration/deregistration take a

    write lock; dispatch takes a read lock only long enough to copy a

    snapshot, so a callback may register or deregister hooks without

    deadlocking. Dispatch has three shapes with distinct contracts:

    fire_pre chains each handler''s modified JSON into the next and a

    non-zero return CANCELS the chain (freeing accumulated buffers);

    fire_post chains transformations but cannot cancel; fire_info

    ignores both return values and modified output. A handler that

    throws is logged and skipped — one bad consumer hook cannot abort

    the engine. Deregistration matches on the (point, callback,

    user_data) triple and is idempotent; an out-of-range hook point is

    rejected with ENTROPIC_ERROR_INVALID_CONFIG and firing on it is a

    no-op returning proceed.

    '
  acceptance_criteria: 'Given multiple hooks with different priorities, When fired, Then

    they execute in ascending priority order.

    Given a pre-hook returning non-zero, Then the chain stops and the

    caller sees cancellation; given a pre-hook returning modified JSON,

    Then the next hook receives it.

    Given a post-hook returning non-zero, Then dispatch is not

    cancelled; given fire_info, Then returns and modified_json are

    ignored.

    Given a throwing hook, Then it is logged and the remaining hooks

    still run.

    Given deregistration of an unregistered hook, Then it returns OK;

    given an invalid hook point, Then registration is rejected.

    Given concurrent registration and dispatch, Then no data race or

    deadlock occurs.

    '
  verified_by: 'SCENARIO "Register a single hook"; "Multiple hooks execute in

    priority order"; "Pre-hook cancellation stops chain"; "Pre-hook

    modification chains through"; "Post-hook transforms result";

    "Post-hook cannot cancel"; "Failing hook is logged and skipped";

    "Deregister removes hook"; "Deregister non-existent hook is

    idempotent"; "Invalid hook point rejected"; "fire_info ignores

    return values and modified_json"; "Concurrent registration and

    dispatch"; "Empty registry fire_pre returns 0"; "Hook count for all

    22 hook points" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/hook_registry_test.cpp

    '
  version: 2.10.4
- id: REQ-HOOK-002
  name: Engine fires hooks at every lifecycle boundary, including a vetoable completion
  module: Hook Points
  description: 'The engine must fire hooks at fixed lifecycle points so consumers

    can observe and intervene without patching core: ON_LOOP_START /

    ON_LOOP_END around the loop, ON_LOOP_ITERATION and

    ON_CONTEXT_ASSEMBLE per iteration, PRE_GENERATE (cancellable) and

    POST_GENERATE (content-rewriting) around generation,

    ON_STATE_CHANGE / ON_ERROR on transitions, ON_PRE_COMPACT

    (cancellable) / ON_POST_COMPACT around compaction, ON_DELEGATE

    (cancellable) / ON_DELEGATE_COMPLETE around a child loop, and

    ON_COMPLETE around an entropic.complete directive.

    ON_COMPLETE is a veto point, not a notification: the engine first

    transitions to VERIFYING, then fires with {summary, tier,

    tool_results, iteration, validation-verdict block}; a non-zero

    return REJECTS the completion, restores the prior state, sets

    metadata["validator_phase"] = "revising" and lets the model retry,

    while any JSON the hook returns is UTF-8-sanitized and injected as a

    "[CITATION VALIDATION] ..." user message. WHY: this is how citation

    and constitutional validators block an unsupported final answer.

    Bytes returned by consumer hooks are sanitized before entering a

    Message, since they later flow through json::dump() (gh#111/gh#113).

    '
  acceptance_criteria: 'Given a PRE_GENERATE hook returning non-zero, Then the iteration is

    cancelled; given a POST_GENERATE hook returning modified JSON, Then

    the generated content is rewritten; given ON_ERROR, Then it fires on

    entry to ERROR.

    Given an ON_COMPLETE hook returning non-zero, When

    entropic.complete is processed, Then the completion is rejected, the

    prior state is restored, validator_phase is "revising", and the

    hook''s feedback appears as a [CITATION VALIDATION] user message.

    Given an ON_DELEGATE hook returning non-zero, Then the delegation is

    cancelled and the loop returns to EXECUTING.

    Given raw UTF-8 in hook or child output, Then it is sanitized before

    reaching a JSON dump sink.

    '
  verified_by: 'SCENARIO "hook dispatch: info / PRE_GENERATE cancel / POST_GENERATE

    rewrite / ON_ERROR"; "dir_complete: hook rejection + coverage_gap

    metadata"; "gh#111: a delegation whose child produces raw UTF-8

    content does not ..."; "gh#111: raw UTF-8 in backend-cleaned content

    is sanitized before it ..."; "gh#113:

    build_delegate_complete_json sanitizes summary at dump sink" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/engine_test.cpp;

