# SPDX-License-Identifier: Apache-2.0
name: Docs — clew wiki → GitHub Pages

# Builds and deploys entropic's clew wiki on every published GitHub Release
# (gh#229; replaces the doxygen site). Triggering on `release.published`
# version-aligns the published docs with what actually shipped.
#
# The wiki carries the public API reference (one page per header under
# include/, declared as `wiki.api` in .clew.yaml), per-file symbol pages for
# src/, the requirements catalog with its implementers and tests, and the
# traceability views. clew's composite action indexes the checkout from
# scratch and builds the HTML site; it deploys nothing, so the Pages steps
# below stay ours.
#
# Pages source must be set to "GitHub Actions" in repo settings
# (Settings → Pages → Source).
#
# Public URL: https://tvanfossen.github.io/entropic/
#

on:
  release:
    types: [published]
  # Manual rebuild without cutting a release, e.g. after a workflow change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy can be in flight at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build clew wiki + deploy to Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On release events, build from the tagged ref so the docs match
          # the release. On workflow_dispatch, use the default ref (main).
          ref: ${{ github.event.release.tag_name || github.ref }}
          # Full history: clew's change-impact and version views read git.
          fetch-depth: 0

      - name: Build the clew wiki
        id: wiki
        uses: tvanfossen/clew/.github/actions/wiki@v2.0.1
        with:
          version: "2.0.1"
          format: html
          out: build/clew-wiki

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.wiki.outputs.site }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
