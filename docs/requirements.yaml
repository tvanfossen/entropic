- id: REQ-ABI-002
  name: C++ exceptions never cross any .so boundary
  module: Cross-Cutting ABI
  description: "Architecture design rule 6, stated once. A C consumer — or a ctypes/FFI consumer\
    \ — has no frame that can catch a C++ exception, so an escape is a process abort, not\
    \ an error. Every extern \"C\" entry point in every library therefore wraps its body in\
    \ a try/catch barrier and maps the exception families the engine actually raises onto\
    \ documented error codes:\n\n  std::filesystem::filesystem_error -> ENTROPIC_ERROR_IO\n\
    \  nlohmann::json::exception         -> ENTROPIC_ERROR_INVALID_CONFIG\n  any other std::exception\
    \          -> ENTROPIC_ERROR_INTERNAL\n\nOn every catch the barrier records e.what() into\
    \ the handle's last_error so the caller can recover a diagnostic without a frame. The\
    \ facade implements this as the c_api_try(handle, fn) template; inference and storage\
    \ each carry an equivalent barrier at their own boundary.\n\nMerged in reconciliation\
    \ from REQ-API-006 plus the exception-containment halves of REQ-INFER-003 and REQ-STOR-007."
  acceptance_criteria: '[REQ-API-006]

    GIVEN a project_dir under a path that cannot be a directory ("/dev/null/...")

    WHEN entropic_configure_dir is called THEN REQUIRE_NOTHROW holds and a non-OK

    error code is returned.

    GIVEN an empty-string project_dir WHEN entropic_configure_dir is called THEN

    REQUIRE_NOTHROW holds regardless of the returned code.

    GIVEN malformed messages JSON WHEN entropic_run_messages is called THEN it

    returns GENERATE_FAILED rather than propagating a json::exception.'
  verified_by: '[REQ-API-006]

    TEST_CASE("entropic_configure_dir on /dev/null subpath returns an error, not an exception")
    — tests/unit/api/entropic_capi_test.cpp

    TEST_CASE("entropic_configure_dir with empty string path returns an error code, not an
    exception") — tests/unit/api/entropic_capi_test.cpp

    SCENARIO("entropic_run_messages with malformed JSON returns GENERATE_FAILED") — tests/unit/api/facade_integration_test.cpp'
