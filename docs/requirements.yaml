- id: REQ-MCP-015
  name: Duplicates, errors, and denials return corrective guidance, not bare failure
  module: MCP Servers and Tool Dispatch
  description: 'Repeated identical calls are detected by a key of tool name plus sorted

    arguments. A duplicate returns the previous result plus an explicit "Do NOT

    call this tool again, use the previous result" instruction; when the prior

    result was itself a denial the message instead tells the model the tool is

    unavailable and that retrying will not help. Repeated duplicates escalate to

    a circuit-breaker message. Denials render as "Tool `X` was denied: <reason>

    ... Do NOT retry it. Use a different approach"; execution errors render as

    "Tool `X` failed with error: ... RECOVERY: check arguments / try a different

    approach / do NOT retry with the same arguments". Error results are NOT

    cached for duplicate detection, so a transient failure does not permanently

    poison the call. Servers may opt individual tools out of duplicate detection

    (`skip_duplicate_check`) — filesystem.read_file does so because it must

    always run to update the read tracker, and entropic.delegate/pipeline

    because they are legitimately repeatable side effects. WHY: a bare error

    invites the model into a retry spiral; the guidance text is the steering

    signal.

    '
  acceptance_criteria: 'Given a tool called twice with identical arguments, When the second
    call is

    processed, Then it is rejected with the previous result and do-not-retry

    guidance rather than re-executing; Given a call that errored, When it is

    repeated, Then it is not treated as a cached duplicate;

    Given filesystem.read_file, Then skip_duplicate_check is true.

    '
  verified_by: '"Error result not cached for dedup", "Permission denied returns feedback"

    — tests/unit/mcp/tool_calling_loop_test.cpp;

    "test_skip_duplicate_check_read"

    — tests/unit/mcp/servers/filesystem_test.cpp;

    "test_delegate_skips_duplicate_check"

    — tests/unit/mcp/servers/entropic_test.cpp;

    "skip_duplicate_check delegates and falls back to false"

    — tests/unit/mcp/server_manager_test.cpp

    '
