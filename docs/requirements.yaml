- id: REQ-INFER-025
  name: Multimodal input is bounded, tier-gated and degrades gracefully
  module: Inference Backends
  description: 'A multimodal turn is only dispatched to a tier that declares the "vision"

    capability; the orchestrator can answer whether any such tier exists and

    select the canonical one, so the facade can short-circuit with

    ENTROPIC_ERROR_NO_VISION_TIER before dispatching a turn no tier can

    handle. A text-only model presented with image content must degrade

    gracefully rather than fault.


    Whether a NAMED tier is vision-capable is answered from CONFIG — the

    declared capability or a configured mmproj path — not from the backend.

    The backend only knows once its mmproj context has been built during

    activation, so asking it returned a confident 0 for a tier that simply was

    not loaded yet, and models.defer_load (REQ-INFER-019) makes not-loaded the

    normal state.


    Images are preprocessed before reaching the vision encoder: format

    validated, file size bounded (20 MB default), dimensions bounded (1280x1280

    default) with aspect ratio preserved on resize, decoded to RGB pixel data.

    A missing file, an oversize file, or a non-image is rejected with an

    exception rather than passed downstream. Adapters may reshape the system

    prompt and content parts for the family''s expected multimodal format,

    defaulting to the OpenAI content array. When a multimodal prefill runs it

    mutates seq 0 out of band, so it invalidates the warm-keep resident record

    (REQ-INFER-017), and the mtmd context is created and destroyed with the

    ACTIVE state alongside the llama context.

    '
  acceptance_criteria: 'Given a config with no vision-capable tier, Then has_vision_capable_tier

