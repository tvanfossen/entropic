- id: REQ-MCP-007
  name: Tool calls route by server prefix uniformly across all three server kinds
  module: MCP Servers and Tool Dispatch
  description: 'A fully-qualified tool name is `<server>.<tool>`. ServerManager splits the

    prefix and routes, in order, to an in-process MCPServerBase, then a dlopen

    PluginServer, then an ExternalMCPClient. Plugins and external clients are

    deliberately parallel peers rather than MCPServerBase subclasses (the base''s

    list_tools/execute are non-virtual and would present an empty registry).

    `list_tools()` concatenates definitions from all three sources so the model

    sees one flat tool list. An unrecognised prefix returns an error envelope

    naming the unknown server; a known-but-disconnected external server returns

    a disconnected-server error envelope. `server_names()` and

    `list_server_info()` report all kinds with transport, status, source, and

    tool list.

    '
  acceptance_criteria: 'Given a registered in-process server and a loaded plugin,

    When list_tools() is called,

    Then both servers'' tools appear; When a plugin-prefixed tool is executed,

    Then the call reaches the plugin and its envelope is returned; When a call

    names an unknown prefix, Then an error envelope is returned rather than a

    throw.

    '
  verified_by: '"Tool routing", "Unknown server returns error", "server_names returns the

    registered server list", "get_server returns nullptr for unknown server

    name" — tests/unit/mcp/server_manager_test.cpp;

    "gh#133 a configured plugin''s tools appear in list_tools", "gh#133 a tool

    call routes through to the plugin", "gh#133 a plugin registers as a named

    server" — tests/unit/mcp/plugin_loader_test.cpp

    '
