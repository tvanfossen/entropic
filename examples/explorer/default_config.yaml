# SPDX-License-Identifier: Apache-2.0
# Entropic Explorer — default configuration.
#
# Repo knowledge assistant with 8 identities and 4 pipeline flows.
# Constitutional validation enforces architectural rules on all output.

# gh#154 (v2.13.0): a tier `grammar:` stem must resolve at CONFIGURE time —
# an unresolvable one is now ENTROPIC_ERROR_INVALID_CONFIG instead of a
# warning followed by an unconstrained decode. config_dir names the root the
# engine searches for `grammars/`, so `data/grammars/quiz.gbnf` is registered
# during configure and the quizzer tier's `grammar: quiz` resolves. This
# replaces the post-configure entropic_grammar_register_file() call in
# main.cpp, which could only ever run AFTER the tier had been validated.
config_dir: data

app_context: prompts/app_context.md
constitution: prompts/constitution.md

models:
  lead:
    path: primary
    adapter: qwen35
    identity: prompts/identity_lead.md
    context_length: 65536

  researcher:
    path: primary
    adapter: qwen35
    identity: prompts/identity_researcher.md
    context_length: 65536

  architect:
    path: primary
    adapter: qwen35
    identity: prompts/identity_architect.md
    context_length: 65536

  reviewer:
    path: primary
    adapter: qwen35
    identity: prompts/identity_reviewer.md
    context_length: 65536

  critic:
    path: primary
    adapter: qwen35
    identity: prompts/identity_critic.md
    context_length: 65536

  teacher:
    path: primary
    adapter: qwen35
    identity: prompts/identity_teacher.md
    context_length: 65536

  quizzer:
    path: primary
    adapter: qwen35
    identity: prompts/identity_quizzer.md
    grammar: data/grammars/quiz.gbnf
    context_length: 16384

  tracer:
    path: primary
    adapter: qwen35
    identity: prompts/identity_tracer.md
    context_length: 65536

  default: lead

routing:
  enabled: false
  handoff_rules:
    lead: [researcher, architect, reviewer, teacher, tracer]
    reviewer: [critic]

permissions:
  auto_approve: true

mcp:
  enable_entropic: true
  enable_filesystem: true
  enable_git: true
  enable_bash: false
  enable_diagnostics: false
  enable_web: false
  working_dir: ../..
  filesystem:
    allow_outside_root: false
    max_read_bytes: 32768  # Cap single reads to prevent context overflow

constitutional_validation:
  enabled: true
  max_revisions: 2

lsp:
  enabled: false

log_level: INFO
