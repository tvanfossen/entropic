- id: REQ-MCP-019
  name: Tool results are size-capped with a marker and classified into typed kinds
  module: MCP Servers and Tool Dispatch
  description: 'At the inbound boundary — before classification, duplicate recording, and

    history — result content exceeding `max_tool_result_bytes` is truncated in

    place to `cap - tail` bytes followed by a `[... truncated, N more bytes]`

    marker, so the model, the classifier, and the dedup cache all see the same

    bounded form and know bytes were lost. A cap of 0 disables truncation, and

    content already within cap is untouched. The (possibly truncated) content is

    then classified: byte-level emptiness (whitespace-only counts) and an

    error-shape heuristic recognising leading `Error:`/`ERROR`/`[error]` and a

    top-level `{"error": ...}` object, while the word "error" mid-string does

    NOT classify as an error. The resulting ToolResultKind round-trips through

    its string form for hook consumers.

    '
  acceptance_criteria: 'Given cap 0 or content within cap, Then truncate_to_cap is a no-op;
    Given

    oversized content, Then the final size is <= cap and ends with the

    truncation marker; Given "Error: ..." / "[error] ..." / `{"error":...}`,

    Then looks_like_tool_error is true; given the word error mid-sentence, false;

    given whitespace-only content, is_effectively_empty is true.

    '
  verified_by: '"truncate_to_cap is a no-op when cap is 0", "truncate_to_cap is a no-op when

    content is already within cap", "truncate_to_cap shrinks oversized content

    with a marker tail", "is_effectively_empty bucket", "looks_like_tool_error

    positive cases", "looks_like_tool_error negative cases",

    "ToolResultKind::ok_empty round-trips through string form",

    "delegation_failed and rejected_anti_spiral round-trip ..."

    — tests/unit/mcp/tool_result_classify_test.cpp

    '
