- id: REQ-CFG-006
  name: Fail-loud validation — reject bad or inert configuration at load time
  module: Configuration
  description: "Validation is a distinct pass from parsing and runs on the fully merged\n\
    config before it is handed to the engine. It returns an error string that\naborts configuration;\
    \ it never clamps a value into range, never silently\nsubstitutes a default, and never\
    \ lets an explicitly-enabled feature degrade\ninto a no-op. Enforced classes:\n  - RANGE\
    \ / SHAPE: context_length in [512, 131072]; adapter non-empty;\n    n_batch >= 1; compaction.threshold_percent\
    \ in [0.5, 0.99];\n    warning_threshold_percent strictly below threshold_percent;\n \
    \   preserve_recent_turns in [1, 10]; tool_result_ttl >= 1 (lower bound\n    only — the\
    \ upper bound is advisory, since long delegations on wide\n    contexts legitimately want\
    \ large TTLs); allowed_tools entries must be\n    `server.tool`.\n  - CROSS-FIELD REFERENCE:\
    \ models.default_tier must exist in tiers;\n    routing.fallback_tier, every routing.tier_map\
    \ value, and every\n    handoff_rules key and target must name a defined tier.\n  - INERT-FEATURE\
    \ REJECTION: `routing.enabled` with no `models.router`;\n    `routing.classification_prompt`\
    \ set with an EMPTY `tier_map` (the\n    router burns a generation emitting a digit that\
    \ maps to nothing and\n    every route silently falls back to the default tier); `prompt_cache\n\
    \    .enabled` with `max_bytes == 0`; a partial `family`/`size`/`quant`\n    selector,\
    \ or a complete selector matching no registry entry.\n  - STRUCTURE: a config file whose\
    \ YAML root is not a mapping, and an\n    unreadable/missing config path, are both errors,\
    \ not empty configs.\nNon-fatal advice travels on a separate channel: `validate_config`\
    \ fills a\n`warnings` vector (e.g. a tier with `auto_chain` but no handoff_rules\nentry)\
    \ which is logged, not raised. Errors are logged at ERROR with the\noffending field path\
    \ (`models.<tier>: ...`, `models.router: ...`) before\nbeing returned.\n"
  acceptance_criteria: 'GIVEN routing enabled without a router model / a fallback_tier not
    in tiers

    / a tier_map value naming an undefined tier / a handoff_rules source or

    target not in tiers / routing enabled with a classification_prompt and an

    empty tier_map, WHEN validate_routing is called, THEN each fails with a

    message naming the offending key. GIVEN a ModelConfig with out-of-range

    context_length, an empty adapter, or an allowed_tools entry lacking a dot,

    THEN validate fails. GIVEN a ModelsConfig whose default tier is absent from

    a non-empty tiers map, THEN validate fails. GIVEN compaction thresholds

    that invert or fall out of range, THEN validate fails. GIVEN a missing

    config file path, THEN parse_config_file returns a read error and

    load_config_from_file propagates it without running validation.

    '
  verified_by: "SCENARIO(\"ModelConfig validation\"),\nSCENARIO(\"ModelConfig validation —\
    \ failure modes\"),\nSCENARIO(\"Allowed tools validation\"),\nSCENARIO(\"ModelsConfig\
    \ validation\"),\nSCENARIO(\"ModelsConfig validation — default tier must exist\"),\nSCENARIO(\"\
    RoutingConfig validation\") (all six GIVEN branches, including\n  the classification_prompt\
    \ + empty tier_map inert-routing rejection),\nSCENARIO(\"CompactionConfig validation\"\
    ) —\n  tests/unit/config/validate_test.cpp\nSCENARIO(\"parse_config_file rejects missing\
    \ file with read error\"),\nSCENARIO(\"load_config_from_file forwards file errors through\
    \ the chain\") —\n  tests/unit/config/loader_test.cpp\n"
