- id: REQ-MCP-021
  name: Filesystem tools are root-confined, read-before-write gated, and size-bounded
  module: MCP Servers and Tool Dispatch
  description: 'FilesystemServer resolves every requested path against its root and

    canonicalises it; a path under the root is served. A path OUTSIDE the root

    (v2.13.0) is decided by, highest precedence first: `outside_root_deny`

    (always refused, `outside_root_denied`), `outside_root_allow` (served with

    no prompt), then the tri-state `mcp.filesystem.allow_outside_root` —

    `false` refuses with "Path escapes project root: <path>" (logged "Path

    escape blocked"), `true` serves, and `optional` (THE DEFAULT, in the C++

    type and in data/default_config.yaml) asks the host''s path approver

    (`entropic_set_path_approval_callback`) with the canonical path, the root,

    the fully-qualified tool and READ/WRITE (read_file and list_directory read;

    write_file and edit_file write). An approver rejection refuses with

    `outside_root_rejected`; NO approver refuses with

    `outside_root_approval_required`, naming the path and how to configure

    access — `optional` never fails open. List matching is by canonical

    SUBTREE via lexically_relative, never string prefix (`/opt/data` does not

    cover `/opt/database`, `/home/u/project` does not contain

    `/home/u/projectile`); entries are absolute, `~`-expanded, and a relative

    entry or an unknown `allow_outside_root` value fails the config load.

    `permissions.auto_approve` does NOT approve an escape. A named

    workspace''s servers are forced to `false` with an empty allow list and no

    approver (REQ-MCP-027). Every refusal is thrown, so the server-base barrier

    turns it into a tool error AND skips the ContextAnchor. Until v2.13.0 the

    flag was a bool and the bundled default shipped `true` — unconfined read

    and write of the whole filesystem for every consumer on bundled defaults.

    Writes and edits to an existing

    file are refused with a `read_before_write` error unless THE CALLING

    SESSION has a prior read recorded in the FileAccessTracker (gh#158,

    v2.13.0): reads are kept per session key — the key the ToolExecutor

    routed the call on, which a delegated child inherits from its parent —

    so another session''s read of the same file unlocks nothing, and a

    session''s reads are released when its conversation ends

    (entropic_session_drop, entropic_session_context_clear,

    entropic_session_context_set, entropic_context_clear). NOT IMPLEMENTED:

    the external-modification gate — the tracked hash is never compared on

    the write path, so a file changed on disk after the read is still

    writable (was_read_unchanged, which compared it, had no production

    caller and was removed in v2.11.0). Reads

    are gated by a size

    limit derived from config `max_read_bytes`, else a percentage of the model

    context, else a 32KB default, returning a `size_exceeded` error that pushes

    the model to offset/limit. Reads also refuse ignored paths, and a directory

    argument produces an `is_directory` error rather than a spurious read.

    Errors are structured `{"error":"<code>","message":...}` objects with codes

    such as not_found, is_directory, ignored, size_exceeded, read_before_write,

    not_found/multiple_matches (edits), invalid_regex, not_directory — and the

    not_found message names the tool to use instead ("Use list_directory(\".\")

    to see available files", gh#124). Optional parameters carry documented

    defaults: `list_directory` path defaults to the project root, recursive to

    false, max_depth to 3 (gh#116). `set_working_dir` re-roots the server and

    reloads the ignore rules.

    '
  acceptance_criteria: 'Given a path containing traversal outside the root, When any filesystem

    tool resolves it, Then the call is refused; Given an existing unread file,

    When write_file runs, Then a read_before_write error is returned; Given

    session A read a file and session B did not, When B writes or edits it,

    Then B is refused read_before_write and the file is untouched; Given a

    delegated child read it, Then its parent may write it; Given a session''s

    conversation is dropped, cleared or restored, Then its reads are released

    and a write must read again, while other sessions keep theirs; Given a

    file changed on disk after being read, Then the write is still allowed

    (no external-modification gate); Given a

    file exceeding the size gate, Then size_exceeded is returned; Given

    list_directory with `path` omitted, Then the project root is listed; Given

    read_file on a directory, Then an is_directory error is returned; Given a

    missing file, Then the error names list_directory.

    Given the shipped default config, or no allow_outside_root key at all, and no

    path approver, When a tool reads outside the root, Then nothing is read and

    the refusal is typed outside_root_approval_required and names the path;

    Given optional and an approver, Then it is asked with the canonical path and

    READ or WRITE, an approval serves the call and a rejection refuses it

    (outside_root_rejected) with nothing written and no ContextAnchor; Given a

    path under outside_root_deny, Then it is refused even with

    allow_outside_root true or an overlapping outside_root_allow; Given a path

    under outside_root_allow, Then it is served with no prompt, and its

    string-prefix sibling is not; Given legacy true or false, Then they mean

    what they did before v2.13.0 and never consult the approver; Given

    permissions.auto_approve, Then an escape is still refused without the

    approver; Given a workspace, Then an allowlisted or approvable outside path

    is refused and the approver is never asked.

    '
  verified_by: '"test_path_security_rejects_traversal", "test_write_file_requires_read",

    "test_write_file_allows_write_after_read_even_if_changed",

    "gh#158: the read tracker is per session, and a lookup never grows it",

    "gh#158: write_file consults the CALLING session''s reads",

    "test_read_file_size_gate",

    "test_read_file_not_found", "test_read_file_refuses_ignored_path",

    "test_grep_invalid_regex_returns_structured_error", "test_read_file_anchor_key",

    "gh#116: list_directory with path omitted uses project root default",

    "gh#116: read_file with a directory path returns is_directory error",

    "gh#124: read_file not-found error message names list_directory",

    "gh#120: read_file lines are an ordered array not a keyed object",

    "gh#126: glob ** pattern matches files at root and in subdirectories",

    the "outside-root optional:" / "outside-root: the approver is asked ONLY

    ..." cases — tests/unit/mcp/servers/filesystem_test.cpp; every

    "outside-root:" scenario — tests/unit/api/path_approval_test.cpp;

    SCENARIOs "gh#158: read-before-write is judged per session — another

    session''s read unlocks nothing", "gh#158: a delegated child''s read

    satisfies its parent''s write — the child runs under the parent''s

    session", "gh#158: ending a session''s conversation releases its read

    tracker and todo list — and only its own", "gh#158: clearing the default

    conversation releases the default session''s read tracker" —

    tests/unit/api/builtin_server_sharing_test.cpp;

    "mcp.filesystem.allow_outside_root is tri-state and defaults to optional",

    "mcp.filesystem outside_root_allow / outside_root_deny parse as absolute

    paths" — tests/unit/config/loader_test.cpp; model:

    tests/model/test_outside_root_approval.cpp

    '
