    the next prompt is built, Then the line appears once and the field

    is cleared.

    Given an entropic.complete tool result and an empty trailing

    assistant message plus explicit_completion_summary metadata, When

    results are processed, Then the summary is folded into the assistant

    message and no raw JSON user message is pushed; and each stated

    precondition failure refuses the fold.

