- id: REQ-CFG-008
  name: Build configuration is frontend-swappable via generated entropic_config.h
  module: Configuration
  description: 'All compile-time configuration reaches source code exclusively through

    `CONFIG_ENTROPIC_*` macros in `entropic_config.h`, generated by CMake from

    `entropic_config.h.in`. Source must never test a CMake variable, a

    toolchain define, or an ad-hoc feature macro directly. WHY: this is the

    seam that makes the configuration frontend swappable — CMake today, Kconfig

    later for embedded targets — without touching a line of engine code.


    The generated surface is: version quadruple (MAJOR/MINOR/PATCH/STRING) and

    `ENTROPIC_API_VERSION`; linkage (SHARED/STATIC); inference backend variant

    (CUDA / VULKAN / CPU_ONLY / HAS_CUDA); compiled-in MCP servers (FILESYSTEM,

    BASH, GIT, DIAGNOSTICS, WEB, ENTROPIC); storage (SQLITE); feature flags

    (STREAMING); and the data-dir pair `CONFIG_ENTROPIC_DATA_DIR` /

    `CONFIG_ENTROPIC_SOURCE_DATA_DIR`.


    Version is single-sourced from the repo-root `VERSION` file, read by CMake

    at configure time, so the runtime value of `entropic_version()` must equal

    that file''s contents on every build — a divergence means either a stale

    build or drift between the read paths, both real bugs.

    `ENTROPIC_API_VERSION` bumps only on breaking C-ABI changes; additive

    functions do not bump it. Runtime path resolution layers on top of the

    generated defines: `resolve_data_dir()` prefers `config.config_dir/data`,

    then `CONFIG_ENTROPIC_DATA_DIR`, then the source tree — so a consumer can

    relocate bundled data without a rebuild.

    '
  acceptance_criteria: 'GIVEN the library is loaded, WHEN entropic_api_version() is called,
    THEN it

    returns the ENTROPIC_API_VERSION baked into the header (currently 2).

    GIVEN a build, WHEN entropic_version() is compared to the repo-root VERSION

    file contents read at test time, THEN they are identical.

    A source-tree check asserts no engine translation unit branches on a raw

    CMake/toolchain variable in place of a CONFIG_ENTROPIC_* macro.

    '
  verified_by: "SCENARIO(\"API version is queryable at runtime\") —\n  tests/unit/api/api_version_test.cpp\n\
    (frontend-swappability itself — that no source reads a CMake variable\n directly — and\
    \ resolve_data_dir priority: none)\n"
  version: 2.10.4
- id: REQ-COMPACT-001
  name: Threshold compaction preserving task-bearing messages, snapshot first
  module: Context Management
  description: 'When estimated tokens (~4 chars/token, cached) reach

    threshold_percent of the context window, the engine compacts

    deterministically — structured extraction, no model inference. Order

    matters: the full pre-compaction history is snapshotted through the

    storage interface first (when save_full_history and a conversation

    id are set) so nothing is lost, then the message list is rebuilt as

    [system] + [structured summary] + all source == "user" messages +

    the single most recent assistant message; everything else is

    counted as stripped. A `force` flag bypasses the threshold. When

    compaction is disabled, crossing the threshold logs a warning and

    changes nothing. Compaction is pluggable: a per-identity compactor

    wins over a global custom compactor, which wins over the built-in

    default, and a custom compactor that fails falls back to the default

    rather than losing the conversation.

    The compaction pass is bracketed by ON_PRE_COMPACT (which can cancel)

    and ON_POST_COMPACT plus the on_compaction callback.

    '
  acceptance_criteria: 'Given usage below threshold, When check_and_compact runs, Then the

    message list is unchanged; with force = true it compacts anyway.

    Given usage above threshold, When compaction runs, Then the system

    message and all user-sourced messages survive and a summary message

    is present.

    Given compaction disabled, When the threshold is crossed, Then a

    warning is logged and nothing is compacted.

    Given a registered per-identity compactor, a global compactor and

    the default, Then precedence is per-identity > global > default, a

    NULL compactor is rejected, and a failing custom compactor falls

    back to the default.

    '
  verified_by: 'TEST_CASE "Compaction below threshold returns unchanged";

    "Compaction above threshold compacts"; "Force compaction bypasses

    threshold"; "System message preserved in compaction"; "User messages

    preserved in compaction"; "Compaction disabled warns"; "TokenCounter

    heuristic ~4 chars/token" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/compaction_test.cpp;

    TEST_CASE "Default compactor runs when no custom registered";

    "Per-identity compactor overrides default"; "Per-identity takes

    precedence over global"; "Deregistration falls back to global";

    "Custom compactor failure falls back to default"; "NULL compactor

    rejected" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/compactor_registry_test.cpp

    '
