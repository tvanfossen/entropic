- id: REQ-INFER-005
  name: Every decode path honours cooperative cancellation within one token
  module: Inference Backends
  description: 'Streaming, buffered and speculative decode all poll a caller-owned cancel

    flag per decode iteration and stop within roughly one token. The result

    carries finish_reason="cancelled" and error_code=ENTROPIC_ERROR_CANCELLED

    so the caller can distinguish an interrupt from a natural stop.


    gh#81 (v2.4.2) added the buffered-with-cancel overload specifically

    because the non-streaming engine path previously ran to max_tokens with no

    way to honour an interrupt — measured at roughly 60s of lag on a 13B model

    at default max_tokens. A NULL cancel pointer is accepted and means "never

    cancel"; backends that do not opt in fall back to the no-cancel override

    without behaviour change.

    '
