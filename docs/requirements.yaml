- id: REQ-TYPE-001
  name: Shared types is the leaf library — links nothing, everything links it
  module: Shared Types
  description: '`librentropic-types` (CMake target `entropic-types`, built from

    src/types/) is the bottom of the dependency graph: every other engine

    library (inference, core, mcp, config, storage, facade, CLI, test

    plugins) links it, and it links no other entropic target. It carries the

    vocabulary those layers must agree on — Message/ContentPart, ToolCall/

    ToolResult, GenerationResult, LogprobResult, BackendInfo/BackendCapability,

    Violation/CritiqueResult/ValidationResult, the whole ParsedConfig tree,

    the C ABI enums, and the one shared cross-.so facility: `entropic::log`.


    Its header surface must stay third-party-free so those types can appear in

    interface contracts (architecture-cpp.md design rule #6). Two deliberate

    consequences: spdlog is the ONLY third-party dependency exposed PUBLIC —

    logging is the shared facility, so the logger type must cross — and

    nlohmann/json, used by messages_json.cpp, is linked PRIVATE with no

    nlohmann type in messages_json.h. Any header reachable from the C boundary

    (error.h, enums.h, hooks.h) must additionally be valid C99 with no C++

    leakage, because they are consumed from pure C and from ctypes.


    A leaf that acquired an upward dependency would make the graph cyclic and

    break the pure-C .so boundary; a leaked vendor header in a types header

    would force every consumer of an interface to link that vendor.

    '
  acceptance_criteria: "- `src/types/CMakeLists.txt` declares only spdlog PUBLIC and\n  nlohmann_json\
    \ PRIVATE; no `entropic-*` target appears in its\n  target_link_libraries.\n- No header\
    \ under include/entropic/types/ includes a vendor header other\n  than spdlog (grep for\
    \ nlohmann/, yaml-cpp/, llama.h yields only prose in\n  comments).\n- GIVEN entropic.h\
    \ (which transitively includes types/error.h and\n  types/hooks.h) WHEN compiled as pure\
    \ C99 THEN it compiles and the C\n  handle/error/hook types and callbacks are visible.\n\
    - The shared logging seam is usable by every library and routes per-handle:\n  two registered\
    \ handle log dirs receive only their own scope-bracketed\n  lines, scopes nest and restore,\
    \ and lines emitted outside any scope\n  route to no handle file.\n"
  verified_by: "tests/unit/api/header_c99_test.c (compiled as entropic-c99-test; asserts\n\
    \  the C-boundary headers are C99-clean)\nSCENARIO(\"Per-handle log scope routes session.log\
    \ writes per handle\") —\n  tests/unit/types/logging_test.cpp\nSCENARIO(\"HandleLogScope\
    \ nests correctly (gh#59)\") —\n  tests/unit/types/logging_test.cpp\nSCENARIO(\"Lines\
    \ emitted with no handle scope route nowhere by handle\") —\n  tests/unit/types/logging_test.cpp\n\
    Link topology and header purity: none (build-graph property, not asserted\n  by any test)\n"
  version: 2.10.4
- id: REQ-TYPE-002
  name: C ABI enums are append-only and pinned to the Python IntEnum mirrors
  module: Shared Types
  description: 'The `typedef enum` blocks in types/enums.h (entropic_model_state_t,

    entropic_agent_state_t, entropic_directive_type_t,

    entropic_compute_backend_t), types/error.h (entropic_error_t) and

    types/hooks.h (entropic_hook_point_t) are the wire format across the .so

    boundary. Members are appended only — never reordered, renumbered or

    removed — because consumers compare integer values, not names.


    The same values are hand-mirrored in python/src/entropic/_bindings.py as

    IntEnums. Drift is silent and mislabels state by integer: issue #1 shipped

    a 7-member Python AgentState against the 10-member C ABI in v2.1.0, so a

    DELEGATING engine reported as something else entirely. Conformance is

    therefore enforced in BOTH directions — every C member must exist in

    Python at the same value, and Python must invent no member the engine

    never emits.

    '
  acceptance_criteria: "- GIVEN the entropic_error_t enum WHEN all values are collected THEN\
    \ no\n  two values are equal, and ENTROPIC_OK == 0.\n- GIVEN enums.h parsed for entropic_agent_state_t\
    \ WHEN compared against\n  the AgentState IntEnum THEN every (name, value) pair matches,\
    \ there are\n  no Python-only entries, and the cardinalities are equal.\n- GIVEN error.h\
    \ parsed for entropic_error_t WHEN compared against the\n  EntropicError IntEnum THEN\
    \ every C code has a Python entry at the same\n  integer value.\n- GIVEN hooks.h parsed\
    \ for entropic_hook_point_t (sentinel excluded) WHEN\n  compared against EntropicHookPoint\
    \ THEN names and values match in both\n  directions.\n- The Python-side comparison parses\
    \ the C headers as text rather than\n  importing the module, so it runs without librentropic.so\
    \ present.\n"
  verified_by: "TestAgentStateAbiConformance / TestEntropicErrorAbiConformance /\n  TestEntropicHookPointAbiConformance\
    \ — tests/unit/test_bindings_abi.py\nSCENARIO(\"All error codes have distinct values\"\
    ) —\n  tests/unit/api/error_enum_test.cpp\nSCENARIO(\"ENTROPIC_OK is zero\") — tests/unit/api/error_enum_test.cpp\
    \ and\n  tests/unit/types/error_test.cpp\n"
  version: 2.10.4
- id: REQ-TYPE-003
  name: Every consumer-facing enum has a total, wire-stable string projection
  module: Shared Types
  description: "Consumers branch on categorical outcomes, and they must never have to\nregex-match\
    \ engine-authored prose — denial messages and error text are\nfree to change wording across\
    \ releases; the enum string forms are not.\nThe shared types therefore own the enum →\
    \ string projections:\n\n  - `entropic_error_name(code)` — 55 codes, one static name each.\n\
    \  - `result_kind_to_string(ToolResultKind)` — serialized as `result_kind`\n    in the\
    \ POST_TOOL_CALL hook context JSON (tool_result.h, E10/rc19).\n  - `mcp_access_level_name`\
    \ / `parse_mcp_access_level` — the only\n    round-trippable pair, \"NONE\"/\"READ\"/\"\
    WRITE\", case-sensitive.\n\nEach projection is TOTAL: it is defined for every declared\
    \ value AND for\nvalues outside the declared range, returning a static, never-NULL string\n\
    (\"ENTROPIC_ERROR_UNKNOWN\", \"UNKNOWN\"). A projection that could return NULL\nwould\
    \ crash a logging call site at exactly the moment something has\nalready gone wrong.\n"
  acceptance_criteria: "- GIVEN each defined error code WHEN entropic_error_name is called\
    \ THEN it\n  returns a non-null, non-empty string starting with \"ENTROPIC_\".\n- GIVEN\
    \ an out-of-range code (9999) WHEN entropic_error_name is called\n  THEN it returns exactly\
    \ \"ENTROPIC_ERROR_UNKNOWN\", not NULL.\n- GIVEN ToolResultKind values WHEN converted\
    \ to string form THEN each\n  round-trips to its documented spelling (ok_empty, delegation_failed,\n\
    \  rejected_anti_spiral, …) and the values are never reordered.\n- Assert the name lookup\
    \ table in error.cpp has one entry per declared\n  entropic_error_t member, in declaration\
    \ order.\n"
  verified_by: "SCENARIO(\"Error codes have human-readable names\") —\n  tests/unit/types/error_test.cpp\n\
    SCENARIO(\"Error names are non-null for all codes\") /\n  SCENARIO(\"Unknown error code\
    \ returns UNKNOWN\") —\n  tests/unit/api/error_enum_test.cpp\nSCENARIO(\"ToolResultKind::ok_empty\
    \ round-trips through string form\") /\n  SCENARIO(\"delegation_failed and rejected_anti_spiral\
    \ round-trip\") —\n  tests/unit/mcp/tool_result_classify_test.cpp\nmcp_access_level_name\
    \ / parse_mcp_access_level: none\n"
