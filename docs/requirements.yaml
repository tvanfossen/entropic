- id: REQ-MCP-010
  name: Per-identity MCP key authorization is opt-in but default-deny once enabled
  module: MCP Servers and Tool Dispatch
  description: 'MCPAuthorizationManager holds one MCPKeySet per identity/tier. An identity

    with NO registered key set passes every authorization check (backward

    compatible, allows incremental adoption); once an identity is registered —

    even with an empty set — enforcement is on and it starts with ZERO

    authorized tools. Keys are granted per pattern with an access level and

    resolved most-specific-first: exact tool name, then server wildcard

    ("filesystem.*"), then full wildcard ("*"), then denied. A granted level

    satisfies any required level at or below it (WRITE implies READ, READ does

    not imply WRITE). Granting an existing pattern replaces the level (it can

    downgrade). Cross-identity `grant_from` requires the granter to be

    registered, the grantee to be registered, and the granter to actually hold

    the key at or above the level being granted. Key sets serialize/deserialize

    as JSON (invalid entries logged and skipped) so authorization survives

    persistence. All mutations and reads are mutex-guarded.

    '
  acceptance_criteria: 'Given an unregistered identity, When a tool is checked, Then it passes;

    Given a registered identity with no keys, Then every tool is denied;

    Given a grant of "filesystem.*" at READ and an exact grant of

    "filesystem.read_file" at WRITE, Then the exact grant wins for that tool;

    Given a granter lacking the key or holding a lower level, Then grant_from

    returns ENTROPIC_ERROR_PERMISSION_DENIED; an unregistered granter or

    grantee returns ENTROPIC_ERROR_IDENTITY_NOT_FOUND; serialize/deserialize

    round-trips the full set.

    '
  verified_by: '"Unregistered identity passes authorization", "Registered empty identity

    denies all", "Grant then check succeeds", "Revoke then check fails", "Grant

    from valid granter succeeds", "Grant from insufficient level denied", "Grant

    from missing key denied", "Grant from unregistered granter returns

    NOT_FOUND", "Serialize all roundtrip", "Unregister disables enforcement",

    "is_enforced correct" — tests/unit/mcp/mcp_authorization_test.cpp;

    "MCPKeySet empty denies all", "MCPKeySet WRITE implies READ", "MCPKeySet

    READ does not authorize WRITE", "MCPKeySet most specific wins: exact over

    wildcard", "MCPKeySet most specific wins: server over full", "MCPKeySet

    serialize roundtrip", "MCPKeySet deserialize skips invalid entries"

    — tests/unit/mcp/mcp_key_set_test.cpp

    '
