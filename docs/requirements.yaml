  version: 2.10.4
- id: REQ-LOOP-009
  name: Per-session-key run concurrency, on by default, with one lock on the generation path
  module: Agent Loop
  description: 'The run guard is scoped to a SESSION KEY, not to the handle. A second

    run on the SAME key is always ENTROPIC_ERROR_ALREADY_RUNNING — the two

    would share one conversation. A run on a DIFFERENT key proceeds

    concurrently by default; `concurrent_sessions: false` is a KILL SWITCH

    that refuses any second run and reproduces v2.12.0 semantics exactly.


    The default is on because the audit it waited for is complete: every

    piece of per-handle mutable state a turn touches is per-run or locked.

    Per-run: the interrupt token, the session binding, the loop context, the

    cancel token published to the run''s own thread, and the validator''s

    per-turn context (tier, tool manifest, tool evidence, identity system

    prompt — thread-local, because a mutex would have left session A''s

    critique prompt built from session B''s evidence). Locked:

    `conversations_` (its own mutex), the run registry (`runs_mutex_`, held

    for O(1) map operations and NEVER across a decode, which is what keeps

    gh#109''s property true), `per_tier_metrics_` + `last_metrics_`

    (`metrics_mutex_`), `context_anchors_` (`anchors_mutex_`),

    `system_prompt_` (`prompt_mutex_`), the lazily-built sandbox manager and

    repo-dir cache as one unit (`sandbox_mutex_`), the base project snapshot

    the sandbox manager materializes (`base_mutex_`), the external MCP

    client''s JSON-RPC id counter (atomic, REQ-MCP-026), the filesystem

    server''s read-before-write tracker and the entropic server''s todo list

    (one FilesystemServer / EntropicServer serves every unbound session, so

    both were first locked and are now PER SESSION: keyed by the session the

    ToolExecutor routed the call on — published to its thread for the

    dispatch — and released through `ServerManager::release_session` when

    the session is dropped, cleared or restored, so neither grows by one

    entry per session a host ever served), the working directory every

    in-process and plugin server resolves against (the ServerManager''s

    ToolRootLock: SHARED around each dispatch, EXCLUSIVE while a sandboxed

    delegation has the set re-rooted, so another session''s call waits and

    then resolves against its own root — never the sandbox), and the whole

    generation path.

    Deleted rather than locked: the TokenCounter memo, an

    address-keyed map written from a const method, which was both a data

    race and a correctness bug (a Message address is not an identity).


    A per-session interrupt must stop the DECODE, not only the loop and the

    tool call: the per-token poll and the batch cancel poller consult this

    run''s token as well as the handle-wide flag, and the batch poller —

    which runs on its own thread, where the thread-local is not installed —

    captures the token pointer on the run thread before spawning. The pause

    prompt''s "no injection" path cancels THIS run rather than the handle.


    `pause_flag_` stays handle-wide by design: `pause()` is raised from a

    thread that owns no run and names no key, so there is nothing to route

    it by. What is scoped is the CLEAR — a fresh turn no longer un-pauses a

    run already in flight.


    ONE lock serializes generation: `ModelOrchestrator::generation_mutex_`,

    recursive, taken at the five generate entry points and nowhere else.

    Order: ToolRootLock (exclusive across a sandboxed child''s run) ->

    generation_mutex_ -> swap_mutex_ / records_mutex_ -> the backend''s

    transition_mutex_ / mtp_mutex_. It cannot be inverted because no holder of

    an inner lock calls a generate entry point; `get_model` releases

    `swap_mutex_` before returning; and ToolRootLock''s shared side is taken

    only at tool dispatch, where a run thread holds none of the others.


    `entropic_interrupt` means every run; `entropic_interrupt_session` means

    one, and deliberately does not trip the handle-wide external-transport

    latch — that would abort another session''s in-flight MCP call (gh#150''s

    failure mode). The interrupted run''s own tool call still aborts, because

    the run publishes its cancel token to its own thread (`RunCancelScope`)

    and the transport polls it per request.


    A same-prefix batch owns only its own temporary sequences and clears only

    those: it may not clear the whole KV cache, and no arm may land on a

    sequence a session holds. Delegated children inherit the parent''s session

    key.'
  acceptance_criteria: 'Given the shipped default and a run in flight on key A,

    When a second run claims A, Then it is refused; When a run claims B,

    Then it proceeds and both are counted active.

    Given `concurrent_sessions: false`, When a run is in flight on any key,

    Then a run on any other key is refused.

    Given two concurrent runs, When one counts tokens while the other

    compacts, Then every count agrees and nothing is corrupted; When both

