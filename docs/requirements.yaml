- id: REQ-TYPE-006
  name: Multimodal message vocabulary keeps text readable to text-only callers
  module: Shared Types
  description: 'A Message carries content two ways at once: `content` (always populated

    plain text) and `content_parts` (ordered ContentPart list, empty for

    text-only messages). Part order is preserved because image position

    relative to text changes what some models see. Any code path that builds

    content_parts must also set `content = extract_text(content_parts)`, so

    every pre-multimodal call site that reads `content` directly keeps working

    — this dual representation is the reason vision support (v1.9.11) did not

    require touching every consumer of Message.


    The wire format is the OpenAI-compatible messages array, and the single

    shared parser `parse_messages_json` (extracted from the inference C API to

    types/ in v2.1.8 so the facade''s entropic_run_messages reuses it rather

    than duplicating it) is tolerant by construction: a missing "role" defaults

    to "user", a missing "content" yields empty, an unrecognized part "type"

    is treated as text, and a NULL pointer yields an empty vector without

    throwing. Malformed JSON is the one case that propagates — it is a caller

    bug, not a tolerable omission. `has_images` / `any_message_has_images`

    are the shared predicate the vision-tier routing depends on.

    '
  acceptance_criteria: "- GIVEN a JSON array with a string-content message WHEN parsed THEN\
    \ one\n  Message with content set and content_parts empty.\n- GIVEN a text+image content\
    \ array WHEN parsed THEN content_parts is\n  populated in order and content equals the\
    \ extracted text.\n- GIVEN an image part using a data: URI WHEN parsed THEN image_url\
    \ is\n  preserved verbatim.\n- GIVEN a message object with no role field WHEN parsed THEN\
    \ role defaults\n  to \"user\".\n- GIVEN a null pointer WHEN parsed THEN an empty vector\
    \ is returned and\n  nothing is thrown; GIVEN an unterminated JSON string THEN the parser\n\
    \  throws.\n- GIVEN mixed parts THEN extract_text joins TEXT parts with single spaces\n\
    \  and skips IMAGE parts; empty and images-only inputs yield \"\".\n- GIVEN two text-only\
    \ messages and one with an image THEN\n  any_message_has_images returns true; has_images\
    \ returns false for\n  text-only and for empty part lists.\n- GIVEN a multimodal Message\
    \ THEN its metadata map survives alongside\n  content_parts, and a default-constructed\
    \ Message has empty\n  content_parts with zero-valued image dimensions.\n"
  verified_by: "SCENARIO(\"parse_messages_json: text-only string content\" / \"multimodal\n\
    \  content array\" / \"image data URI\" / \"missing role defaults to user\" /\n  \"malformed\
    \ JSON throws\" / \"NULL input returns empty\") and\n  SCENARIO(\"any_message_has_images:\
    \ detects across multiple messages\") —\n  tests/unit/types/messages_json_test.cpp\nTEST_CASE(\"\
    extract_text from mixed parts\" / \"from text-only parts\" /\n  \"from empty parts\" /\
    \ \"from images only\"), TEST_CASE(\"has_images detects\n  images\" / \"returns false\
    \ for text-only\" / \"returns false for empty\"),\n  TEST_CASE(\"ContentPart default dimensions\
    \ are zero\") —\n  tests/unit/types/content_test.cpp\nTEST_CASE(\"Text-only message has\
    \ empty content_parts\" / \"Message with\n  content_parts populated\" / \"Message content_parts\
    \ with data URI\" /\n  \"Multimodal message preserves metadata\") —\n  tests/unit/types/message_multimodal_test.cpp\n"
  version: 2.10.4
- id: REQ-VALID-001
  name: Layered validation gating with cheap-path skips
  module: Constitutional Validation
  description: 'Whether a generation is validated is decided by a strict precedence:

    an explicit per-identity override wins; otherwise a tier listed in

    config.skip_tiers is skipped (the lead is skipped by default because

    it streams before the hook fires); otherwise the runtime-toggleable

    global gate decides. Independently, content that is empty or a pure

    tool call after the tier''s reasoning delimiters are stripped is

    skipped — there is nothing to critique and a critique pass costs a

    full 20-30s generation. Reasoning delimiters are resolved per tier

    through a registered marker resolver, because one validator serves

    every tier and thinking format is per model family (gh#108).

    All skips are recorded as verdict `skipped` and stored as the last

    result, and a disabled validator must never call inference.

    '
  acceptance_criteria: 'Given a tier in skip_tiers, When validate runs, Then the verdict is

    skipped; a per-identity override set to true beats skip_tiers, and a

    non-listed tier is validated.

    Given the global gate toggled off at runtime, When validate runs,

    Then the verdict is skipped.

    Given content that is empty or a pure tool call, When validate runs,

    Then the verdict is skipped and no critique generation occurs.

    Given a disabled validator, When validate runs, Then the inference

    interface is not called.

    '
  verified_by: 'SCENARIO "Lead tier skipped by default skip_tiers"; "Non-lead tiers

    are validated with default skip_tiers"; "skip_tiers config excludes

    listed tiers from validation"; "Per-identity override beats

    skip_tiers"; "Per-identity opt-out"; "Per-identity override at

    runtime"; "Global enable toggle at runtime"; "Validation skips pure

    tool-call output"; "Disabled validator does not call inference" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/constitutional_validator_test.cpp;

    SCENARIO "Identity opt-out skips validation in hook" —

    /home/tvanfossen/Projects/entropic/tests/unit/core/validation_hook_test.cpp

    '
