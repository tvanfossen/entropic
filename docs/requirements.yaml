- id: REQ-LOOP-001
  name: Agent state machine with observable, dual-channel transitions
  module: Agent Loop
  description: 'The engine carries exactly ten execution states (IDLE, PLANNING,

    EXECUTING, WAITING_TOOL, VERIFYING, DELEGATING, COMPLETE, ERROR,

    INTERRUPTED, PAUSED) that map 1:1 onto the C ABI

    entropic_agent_state_t. COMPLETE, ERROR and INTERRUPTED are the

    three terminal states; every other state is re-enterable. A run

    always begins by transitioning to PLANNING, and every transition

    fires (a) the EngineCallbacks::on_state_change callback, (b) the

    persistent state observer slot, and (c) the ON_STATE_CHANGE hook

    with {previous, current}; entering ERROR additionally fires

    ON_ERROR with iteration and consecutive-error counts.

    WHY the persistent observer exists as a second channel: the

    streaming entry points replace the whole EngineCallbacks struct via

    set_callbacks() to install their token callback, which silently

    orphaned on_state_change for streaming consumers (gh#40 fallout,

    v2.1.10). The persistent slot survives that shuffle.

    '
  acceptance_criteria: 'Given a wired engine and a mock inference that completes in one

    turn, When run() executes, Then the observed state sequence is

    IDLE -> PLANNING -> EXECUTING -> COMPLETE.

    Given a consumer that calls set_state_observer and then a streaming

    entry point that internally calls set_callbacks, When states change,

    Then the persistent observer still fires.

    Assert is_terminal_state() is true for exactly COMPLETE, ERROR and

    INTERRUPTED.

    '
  verified_by: 'TEST_CASE "State transitions IDLE->PLANNING->EXECUTING->COMPLETE"

    and TEST_CASE "hook dispatch: info / PRE_GENERATE cancel /

    POST_GENERATE rewrite / ON_ERROR" —

