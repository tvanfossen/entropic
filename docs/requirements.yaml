- id: REQ-MCP-008
  name: Plugin tools are argument-validated on the same terms as built-ins
  module: MCP Servers and Tool Dispatch
  description: '`ServerManager::get_tool_schema()` resolves a tool''s JSON input schema from

    the in-process registry, and falls back to parsing the plugin''s

    `list_tools()` descriptor array for its `inputSchema`. Unknown tools return

    an empty schema. WHY: ToolExecutor::check_schema skips validation when the

    schema string is empty, so without the plugin lookup a plugin''s declared

    schema would be invisible and its tools would silently forgo the argument

    checking every built-in tool gets. A plugin descriptor that fails to parse

    logs an error and degrades to "no schema" rather than throwing through the

    routing path.

    '
  acceptance_criteria: 'Given a registered server whose tool declares an input schema,

    When get_tool_schema() is called with the qualified name,

    Then the schema JSON is returned; for an unknown tool an empty string is

    returned; for a plugin tool the schema comes from the plugin''s own

    descriptor list.

    '
  verified_by: '"get_tool_schema returns the registered tool''s schema",

    "get_tool_schema returns empty for unknown tool"

    — tests/unit/mcp/server_manager_test.cpp

    '
  version: 2.10.4
- id: REQ-MCP-009
  name: Operator permission gate with deny precedence and server-derived patterns
  module: MCP Servers and Tool Dispatch
  description: 'Before routing, ServerManager builds a pattern `<tool>:<args-summary>` and

    consults PermissionManager. Deny patterns take precedence over allow

    patterns; matching uses fnmatch semantics so patterns can be tool-level

    ("git.commit"), server-level ("filesystem.*"), or argument-level

    ("bash.execute:python*"). A denied call short-circuits into an error

    envelope without reaching the server. Tools not named in either list are

    NOT denied here — the engine''s approval callback handles prompting.

    Permission patterns for "always allow/deny" are generated by delegating to

    the owning server class (`get_permission_pattern`), so a server can choose a

    finer granularity than the tool name. `add_permission()` inserts allow/deny

    patterns at runtime.

    '
  acceptance_criteria: 'Given both an allow and a deny pattern matching a call,

    When permission is evaluated,

    Then the call is denied; a glob pattern matches every tool under its

    server; an argument-level pattern matches only the qualifying arguments;

    with both lists empty nothing is denied; a runtime-added allow pattern

    takes effect on the next call; get_permission_pattern delegates to the

    server when the prefix is known and falls back otherwise.

    '
  verified_by: '"Deny takes precedence", "Glob pattern matching", "Tool level pattern",

    "Argument level pattern", "Add permission runtime", "Empty lists — nothing

    denied" — tests/unit/mcp/permission_manager_test.cpp;

    "Permission denied blocks execution", "get_permission_pattern delegates to

    server when prefix is known", "is_explicitly_allowed checks the permission

    allow-list", "add_permission inserts a runtime allow pattern"

    — tests/unit/mcp/server_manager_test.cpp

    '
