- id: REQ-API-014
  name: Header is the generator input for the Python wrapper; drift is a commit gate
  module: Public C API and Facade
  description: '`python/src/entropic/_bindings.py` and `_bindings_manifest.py` are AUTO-GENERATED

    from `include/entropic/**.h` by `scripts/gen_bindings.py` — they are never

    hand-edited. Every `ENTROPIC_EXPORT` declaration becomes a ctypes prototype, and

    the manifest''s `EXPORTS` frozenset is the canonical lazy-export set that

    `entropic/__init__.py` imports. Public enums (`entropic_error_t`,

    `entropic_hook_point_t`, `entropic_agent_state_t`) are mirrored as Python

    IntEnums with the same integer values.


    Drift is blocked at commit time: the `gen-bindings-check` pre-commit hook runs

    `inv gen-bindings --check` over

    `include/entropic/*.h`, `python/src/entropic/_bindings(_manifest)?.py`, and

    `scripts/gen_bindings.py`, and fails if the committed files do not match what the

    generator produces from the current header. The fix is always to regenerate and

    commit — never to edit the generated file.


    WHY (gh#55, v2.2.1 defence-in-depth): adding an export to the header without

    regenerating leaves a symbol the C consumer can call and the Python consumer

    cannot, discovered only at a consumer''s runtime AttributeError.


    Merged in reconciliation with REQ-PROD-004 — the same rule stated from another subsystem''s
    end.'
