- id: REQ-MCP-012
  name: Tool calls pass an ordered precondition pipeline with typed rejection kinds
  module: MCP Servers and Tool Dispatch
  description: 'ToolExecutor evaluates preconditions in a fixed order before dispatch:

    anti-spiral hard block, then argument-schema validation, then MCP key

    authorization, then tier allowed_tools, then duplicate detection, then

    operator approval. The anti-spiral block runs first because it is cheapest

    and short-circuits a call the engine has already decided to refuse. Each

    rejection carries both the model-facing message and a categorical

    ToolResultKind (rejected_anti_spiral, rejected_schema,

    rejected_precondition, rejected_unauthorized, rejected_duplicate) so

    POST_TOOL_CALL hook consumers branch on a typed enum instead of grepping

    engine-authored prose. Batch handling additionally sorts `entropic.delegate`

    last (stable sort, so other ordering is preserved) and truncates the batch

    to the effective per-turn call limit, which a per-identity override can

    raise or lower relative to the global LoopConfig value.

    '
  acceptance_criteria: 'Given a tool call that violates more than one precondition,

    When preconditions are checked,

    Then the earliest gate in the documented order produces the rejection and

    its kind; the delegate call sorts to the end of a mixed batch; a batch

    longer than the effective limit is truncated to that limit.

    '
  verified_by: '"Schema validation rejects invalid enum value", "Schema validation rejects

    missing required field", "effective_max_tool_calls_per_turn overrides global

    limit", "POST_TOOL_CALL fires on duplicate rejection with kind",

    "POST_TOOL_CALL fires on schema rejection with kind"

    — tests/unit/mcp/tool_executor_test.cpp

    '
  version: 2.10.4
- id: REQ-MCP-013
  name: Tool arguments are validated against the declared JSON schema before dispatch
  module: MCP Servers and Tool Dispatch
  description: 'Before a tool runs, ToolExecutor fetches its input schema and validates the

    serialised arguments: required fields must be present, and constrained

    fields (e.g. enums) must hold declared values. A violation produces a

    denial message naming the specific problem and a rejected_schema kind; the

    tool never executes. An empty schema (tool not found, or a plugin whose

    descriptor omits inputSchema) skips validation, and unparseable arguments

    are treated as "nothing to validate" rather than throwing through the

    dispatch path.


    gh#143 (v2.12.0): "unparseable" was too narrow. `null`, an array and a

    scalar are all VALID JSON, so they parse cleanly and defeat a guard that

    only tests for a parse failure — while still throwing type_error.306 at

    the first `args.value(key, default)` inside the server. Two places now

    guarantee an object reaches a tool: `ToolExecutor::serialize_args` seeds

    its accumulator as an object, so an argument-free call serialises as `{}`

    rather than the four characters `null`; and `MCPServerBase::execute`

    normalises any payload that is empty or parses to a non-object to `{}`

    before dispatch, covering payloads entropic did not generate (plugin

    `.so`, external MCP server). A non-empty payload that fails to parse is

    deliberately left alone and surfaces as a tool error, so a malformed

    emission is reported to the model rather than silently rewritten.


    Independently, no exception escapes tool dispatch at all:

    `MCPServerBase::execute` converts any throw into error text in the

    response `result` with an empty directives array — the in-process

    counterpart of the plugin guarantee gh#133 added in

    `ServerManager::route_plugin_call`. The barrier sits above

    `inject_anchor_if_needed` so a failed call never has its arguments

    anchored into context.

    '
  acceptance_criteria: 'Given a tool whose schema declares an enum, When the model supplies
    a value

    outside the enum, Then the call is rejected with kind rejected_schema and

    the tool is not invoked; Given a schema with a required field, When it is

    omitted, Then the call is likewise rejected;

    Given a tool declaring NO required fields, When a call arrives carrying no

    arguments at all, Then the tool runs and observes its declared defaults,

    and the run is not aborted;

    Given arguments that are valid JSON but not an object (null, array,

    scalar), When the tool is dispatched, Then they are normalised to an empty

    object; Given arguments that cannot be parsed at all, Then they are NOT

    normalised and the failure is returned to the model as a tool error;

    Given a tool that throws, When it is dispatched, Then the exception is

    converted to a tool error result carrying the message, no ContextAnchor is

    injected for that call, and the exception does not unwind through the

    agent loop.

    '
  verified_by: '"Schema validation rejects invalid enum value", "Schema validation rejects

    missing required field" — tests/unit/mcp/tool_executor_test.cpp.

    gh#143 (v2.12.0): "gh#143: an argument-free call to a no-required-fields tool

    does not kill the run", "gh#143: dispatch converts a throwing tool into a tool

    error", "gh#143: an argument-free call serialises as an object everywhere it is

    observable" — tests/unit/mcp/tool_executor_test.cpp; "gh#143: git.diff with no

    arguments does not throw" — tests/unit/mcp/servers/git_test.cpp (the reported

