- id: REQ-INFER-010
  name: One template-first / adapter-second rule parses every raw emission
  module: Inference Backends
  description: 'Raw model output is parsed by a single shared rule (response_parse.h),

    used by both the orchestrator''s buffered result and the agent-loop tool

    parse. Duplicating that branch is how a fix reached one path and not the

    other (gh#108).


    The rule separates two concerns that compose differently. CONTENT cleanup

    composes: run the template parse when an arena exists, then ALWAYS run the

    adapter''s reasoning strip over the result — stripping is idempotent, so no

    decision logic is needed and no path can be missed. TOOL-CALL extraction

    does not compose: two call lists cannot be merged, so it is either/or —

    the template wins when trustworthy, the adapter is the fallback.


    Trustworthiness needs an a-posteriori check, not a try/catch: common_chat''s

    PEG autoparser silently extracts only the FIRST <parameter=> of a

    multi-parameter call and returns a well-formed ToolCall with arguments

    missing. So the template''s calls are validated against the staged tool

    schema, and a call missing a declared `required` parameter routes to the

    adapter''s hand-rolled parser. A call naming an unknown tool is left alone.


    Because that parse MOVES tool calls out of `content`, the post-parse

    empty-content diagnosis must be told whether any were found

    (diagnose_empty_content, gh#159): a turn whose whole output was a tool

    call — the normal shape under `tool_call_mode: sequential` — is content

    empty / raw non-empty / finish "stop", which is byte-for-byte gh#137''s

    failure shape. Without that input the engine reported a well-behaved turn

    as an unterminated reasoning block that was "not converging", on tiers

    with `enable_thinking: false`. The parameter has no default so no caller

    can omit what it knows, and a parsed call is reported at INFO, never as a

    fault.

    '
  acceptance_criteria: 'Given a reliable (dedicated-grammar) format and a complete parse,
    Then the

    template''s calls are used and used_template is true. Given a template

    parse missing a declared required parameter, Then the adapter parser is

    used instead. Given no backend or no captured arena, Then the adapter

    parses. Given any branch, Then the adapter''s reasoning strip runs over the

    resulting content. Given empty content with at least one parsed tool call,

    Then the diagnosis is tool_call_only and its message names neither a

    reasoning block nor max_tokens; given the same shape with zero tool calls,

    Then the gh#137 reasoning-block diagnosis is unchanged.

    '
  verified_by: 'TEST_CASE "gh#87 diag: multi-parameter tool call — gemma4 (dedicated

    PEG)" — tests/model/test_gh87_multiparam_diag.cpp;

    SCENARIO "gh#93: autoparser family parses a multi-parameter tool call" —

    tests/model/test_gh93_behavioral.cpp;

    SCENARIO "Model output is correctly parsed into tool calls" —

    tests/model/test_tool_call_parsing.cpp

    (calls_satisfy_schema / parse_model_response have no direct CPU unit

    test — see GAPS);

