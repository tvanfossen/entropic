- id: REQ-API-004
  name: Three configure entry points, one shared body, one-shot per handle
  module: Public C API and Facade
  description: "Configuration reaches the engine through exactly three exported entry points,\n\
    all of which funnel into one shared `configure_common` body so no path can drift:\n  -\
    \ `entropic_configure(handle, config_json)` — JSON at the boundary because any\n    language\
    \ can emit it (config FILES are YAML, parsed inside the config `.so`).\n  - `entropic_configure_from_file(handle,\
    \ path)` — dispatches on extension,\n    YAML via ryml or JSON via nlohmann.\n  - `entropic_configure_dir(handle,\
    \ project_dir)` — the recommended path;\n    applies the layered resolution order (compiled\
    \ defaults < bundled default <\n    `~/.entropic/config.yaml` < `{project_dir}/config.local.yaml`\
    \ < `ENTROPIC_*`\n    env), and additionally fixes the working directory used for session\
    \ logs and\n    state.\nConfigure is one-shot: a second `entropic_configure*` on an already-configured\n\
    handle is refused with ENTROPIC_ERROR_INVALID_STATE and `last_error` set to\n\"handle\
    \ already configured\". Configure does NOT load model weights — that is\ndeferred to first\
    \ generate or explicit activation.\n\nWHY: reconfiguration would have to tear down and\
    \ rebuild the orchestrator,\nengine, validator and every observer wire-up while consumer\
    \ callbacks may be\nin flight. Refusing is the fail-fast-and-loud answer; the consumer\
    \ creates a\nnew handle instead.\n"
  acceptance_criteria: 'GIVEN a created handle WHEN configured from a valid JSON string THEN

    ENTROPIC_OK and the handle reports configured.

    GIVEN a NULL config_json or NULL handle THEN INVALID_ARGUMENT / INVALID_HANDLE

    respectively, with no crash.

    GIVEN a configured handle WHEN entropic_configure is called again THEN

    ENTROPIC_ERROR_INVALID_STATE and last_error reads "handle already configured".

    GIVEN entropic_configure_from_file with a path that does not exist THEN an error

    code, never an exception.

    '
  verified_by: 'SCENARIO("Configure from JSON string") — tests/unit/api/facade_integration_test.cpp

    SCENARIO("Configure with null JSON returns error") — tests/unit/api/facade_integration_test.cpp

    SCENARIO("Double-configure on one handle is refused") — tests/unit/api/multi_handle_test.cpp

    TEST_CASE("entropic_configure rejects NULL handle") — tests/unit/api/entropic_capi_test.cpp

    TEST_CASE("entropic_configure_from_file rejects missing file") — tests/unit/api/entropic_capi_test.cpp

    TEST_CASE("entropic_configure_dir on a tmp dir runs the loader path") — tests/unit/api/entropic_capi_test.cpp

    '
