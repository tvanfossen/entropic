    "vision" and has never been loaded, Then entropic_model_has_vision reports

    it as vision-capable. Given a text-only model and

    multimodal input, Then the turn completes gracefully. Given a non-existent

    file, an oversize file, or a non-image, Then preprocessing throws; given a

    valid image within bounds, Then it is not resized; given one exceeding max

    dimensions, Then it is resized preserving aspect ratio. Given the base

    adapter, Then format_content_parts produces the OpenAI content array.

    '
