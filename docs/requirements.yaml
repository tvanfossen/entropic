- id: REQ-DELEG-004
  name: Sequential pipeline with forward carry and per-stage reporting
  module: Delegation and Pipelines
  description: 'A pipeline runs its stages strictly in order. Each stage receives a

    [PIPELINE CONTEXT] preamble stating stage i of N and its role, plus

    the previous stage''s summary as a [PRIOR STAGE OUTPUT] block —

    forward-carry semantics (issue #11); pre-2.1.4 stages ran in

    isolation against the original task and lost intermediate output.

    The whole pipeline takes ONE consumer pre-flight gate (fired with

    is_pipeline = 1) and ONE shared sandbox, so later stages observe

    earlier stages'' file edits; a REJECT skips every stage and a failed

