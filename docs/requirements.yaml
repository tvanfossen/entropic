- id: REQ-DELEG-005
  name: Opt-in delegation sandbox isolation, wired end to end
  module: Delegation and Pipelines
  description: '`delegation.isolation` selects how a delegated child''s filesystem

    writes are contained: `none` (the default) shares the parent''s

    working directory, `sandbox` runs the child in a copy and returns a

    patch. An unrecognized mode is a config ERROR, never a silent

    downgrade to `none`. Under `sandbox` the engine (1) snapshots the

    SESSION''S TOOL ROOT — AgentEngine::resolve_session_root, the same

    directory the MCP servers resolve against — rather than its own repo

    dir; (2) points every in-process and plugin server at the sandbox for

    the child''s turns via ServerManager::enter_working_dir and points

    them back on the way out (leave_working_dir), restoring the PARENT''S

    active root so a nested delegation does not hand the outer child the

    project tree — holding that server set''s root lock for the child''s

    whole run, so another session dispatching on the same set meanwhile

    waits and then resolves against its own root, never the sandbox

    (gh#158);

    (3) mints a unique sandbox id per delegation so siblings at one depth

    neither share a directory nor overwrite each other''s

    pending/<id>.patch; (4) refuses the delegation when the child can

    reach an external MCP tool that does not declare `readOnlyHint: true`,

    since an external server is a separate process that cannot be moved.

    Under `none` nothing here runs: no snapshot, no swap, no patch, and

    delegation ids keep their pre-2.13.0 spelling.

    WHY (gh#160): DelegationManager::set_dir_swap had NO production

    caller from v2.1.5 to v2.12.2, so every ScopedSandbox took the

    non-sandboxed branch — children wrote into the real repository while

    the engine snapshotted the host process''s cwd and delivered 0-byte

    patches.

    '
  acceptance_criteria: 'Given delegation.isolation unset, When a delegation runs, Then no
    sandbox

    manager is created and the child uses the parent''s working directory.

    Given delegation.isolation: sandbox and a session root that differs

    from the engine repo dir, When a delegation runs, Then the sandbox is

    rooted at the session root.

    Given two sibling delegations at the same depth, When both complete,

    Then they produce two distinct ids and two distinct patches.

    Given a delegation nested inside another, When the inner one

    finishes, Then the tools are restored to the OUTER sandbox.

    Given a sandboxed delegation on a server set, When another session

    dispatches a tool on that set meanwhile, Then its call resolves

    against its own root and not the sandbox.

    Given a child-visible external tool without readOnlyHint: true, When

    the delegation is dispatched, Then it is rejected with a typed

    message naming the offending tool and no child loop runs.

    Given an unknown delegation.isolation value, When config is parsed,

    Then the load fails with an error naming the value.

    '
