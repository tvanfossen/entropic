- id: REQ-INFER-011
  name: Reasoning-block markers are declared once per model family
  module: Inference Backends
  description: 'Thinking format is a property of the chat template, not the transport:

    Qwen and Nemotron wrap reasoning in <think>…</think>, Gemma-4 QAT uses

    <|channel>…<channel|> (note the close is <channel|>, not a mirrored

    </|channel>). Each adapter declares its pair once via thinking_markers(),

    and both consumers read it: the buffered strip (strip_think_blocks) and

    the live stream filter (StreamThinkFilter wrapping on_token in

    generate_streaming). Before v2.10.3 these were two independent hardcoded

    literals and gemma4 matched neither, so raw reasoning reached consumers

    and conversation history on every path — plain, streaming, MTP and batch.


    Matching is plain substring, not regex, because <|channel> contains a

    regex metacharacter. An unclosed opening marker (the budget ran out

    mid-reasoning) erases to end of content and WARNs: no answer was ever

    produced, so returning the reasoning would be worse than nothing. The live

    filter matters independently because ResponseGenerator::generate_streaming

    builds content from its own token accumulator, so on the agent-loop

    streaming path the filter is the only thing between raw reasoning and

    history.

    '
  acceptance_criteria: 'Given a gemma4 tier, When its adapter is resolved, Then that adapter

    strips its own family''s marker. Given the gemma4 adapter and the stream

    filter, Then both agree on the same marker pair. Given a live token

    stream containing the family''s markers, Then the filter suppresses the

    reasoning span incrementally.

    '
  verified_by: 'SCENARIO "gh#108 the adapter a gemma4 tier resolves to strips its own

    marker", "gh#108 the gemma4 adapter and the stream filter agree on

    markers", "gh#108 StreamThinkFilter suppresses the family''s marker live"

