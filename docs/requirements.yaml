- id: REQ-API-007
  name: Per-handle error state and a stable, append-only error enum
  module: Public C API and Facade
  description: 'Cross-`.so` error reporting uses exactly three channels: (1) the

    `entropic_error_t` return code, (2) a per-handle error message readable via

    `entropic_last_error(handle)`, and (3) an optional async

    `entropic_set_error_callback` invoked on the thread where the error occurred.


    `entropic_last_error` never returns NULL. With a non-null handle it copies the

    handle''s `last_error` into a thread-local cache under `HandleApiLock` and returns

    a pointer valid until the same thread calls it again — matching the documented

    v1.8.0 "owned by the handle, valid until the next call" contract without handing

    out a pointer into live handle state. With a NULL handle it returns a

    thread-local pre-create buffer (empty string when there is no error), so the

    failure path of `entropic_create` itself is still diagnosable.

    `entropic_error_name(code)` returns a static string for every code and "UNKNOWN"

    for an out-of-range value; it never returns NULL.


    The enum is ABI: ENTROPIC_OK is 0, all values are distinct, and new codes are

    appended only — never renumbered or removed — because the generated Python

    IntEnum mirrors these integers. Renumbering would require bumping

    `entropic_api_version()`.


    WHY: pre-v2.2.6 the exported `entropic_last_error` ignored its handle argument

    entirely, so every `handle->last_error` write in the facade was invisible to

    consumers — a silent diagnostic dead end.


    Scope note: this requirement owns per-handle last_error state only. Append-only stability
    of the error enum itself is REQ-TYPE-002.'
  acceptance_criteria: 'ENTROPIC_OK == 0. All enumerators have distinct values. entropic_error_name

    returns non-NULL for every declared code and "UNKNOWN" for an unknown one.

    entropic_last_error(NULL) returns "" (not NULL). Two handles with different

    failures return their own messages. The Python EntropicError IntEnum has exactly

    the C enumerators, with matching integer values and no Python-only entries.

    '
  verified_by: 'SCENARIO("ENTROPIC_OK is zero") — tests/unit/api/error_enum_test.cpp

    SCENARIO("All error codes have distinct values") — tests/unit/api/error_enum_test.cpp

    SCENARIO("Error names are non-null for all codes") — tests/unit/api/error_enum_test.cpp

    SCENARIO("Unknown error code returns UNKNOWN") — tests/unit/api/error_enum_test.cpp

    SCENARIO("entropic_last_error returns empty string for NULL handle") — tests/unit/api/multi_handle_test.cpp

    TestEntropicErrorAbiConformance — tests/unit/test_bindings_abi.py

    '
  version: 2.10.4
- id: REQ-API-008
  name: Single cross-boundary allocator pair and explicit ownership transfer
  module: Public C API and Facade
  description: "`entropic_alloc(size)` / `entropic_free(ptr)` are the only allocator pair\
    \ that\nmay be used for memory crossing the `.so` boundary in either direction. Consumer\n\
    and engine may be linked against different C runtimes, so a consumer `free()` of\nan engine-allocated\
    \ pointer is undefined behaviour.\n\nThe ownership rules are uniform:\n  - Any `char**`\
    \ out-parameter or `char*` return value transfers ownership to the\n    caller; the caller\
    \ MUST release it with `entropic_free()`. Internally these\n    are produced by the private\
    \ `alloc_cstr` helpers, which route through\n    `entropic_alloc` and return NULL on OOM.\n\
    \  - Any buffer the consumer hands to the engine for the engine to free (notably\n   \
    \ a hook's `modified_json`) MUST be allocated with `entropic_alloc()`.\n  - `const char*`\
    \ returns (`entropic_version`, `entropic_last_error`,\n    `entropic_error_name`) are\
    \ NOT owned by the caller and must not be freed;\n    `entropic_version`/`entropic_error_name`\
    \ have static lifetime,\n    `entropic_last_error` is valid until the next call on that\
    \ thread.\n  - `entropic_free(NULL)` is a no-op.\n  - `entropic_free_logprob_result` is\
    \ the dedicated releaser for the one struct\n    with interior allocations.\n"
  acceptance_criteria: 'entropic_alloc returns a writable block of the requested size; writing
    to it and

    then entropic_free-ing it round-trips without corruption. entropic_free(NULL)

    does not crash. Every documented char**/char* producer either sets a freeable

    pointer or NULL, and no test leaks under the CI build.

    '
  verified_by: 'TEST_CASE("entropic_alloc / entropic_free round-trip") — tests/unit/api/entropic_capi_test.cpp

    SCENARIO("Grammar register and get round-trip") — tests/unit/api/facade_integration_test.cpp

    SCENARIO("List identities returns JSON array") — tests/unit/api/facade_integration_test.cpp

    SCENARIO("MCP key serialize/deserialize round-trip") — tests/unit/api/facade_integration_test.cpp

    '
  version: 2.10.4
- id: REQ-API-009
  name: Run entry-point family, result contract, and cross-thread interruptibility
  module: Public C API and Facade
  description: "Six run entry points share one result and precondition contract:\n  - `entropic_run`\
    \ — blocking agentic loop over a plain string input.\n  - `entropic_run_as` — same, under\
    \ a named tier/identity, selecting that tier's\n    grammar + system prompt + samplers\
    \ on the SHARED resident model with no second\n    model load and no reconfigure (gh#99);\
    \ an unknown tier is\n    ENTROPIC_ERROR_IDENTITY_NOT_FOUND.\n  - `entropic_run_batch`\
    \ — N same-prefix one-shot generations (no tool loop),\n    results returned in input\
    \ order.\n  - `entropic_run_streaming` — `entropic_run` plus a per-token callback and\
    \ an\n    optional `int* cancel_flag`.\n  - `entropic_run_messages` / `_streaming` — OpenAI-shaped\
    \ messages array,\n    supporting image content parts; an image with no vision-capable\
    \ tier\n    configured is ENTROPIC_ERROR_NO_VISION_TIER with diagnostics (gh#41).\n`entropic_run`,\
    \ `_as`, `_streaming`, and `_messages*` return the whole\nconversation as a JSON array\
    \ of `{role, content}`. `entropic_run_batch` returns\na JSON array of `{content, finish_reason,\
    \ tool_calls}`.\n\nOn failure the run entry points still define `*result_json`: they serialize\
    \ the\nengine's current message list so the caller can recover tool results and partial\n\
    assistant content accumulated before the fault, falling back to NULL only if\nthat serialization\
    \ also throws. `entropic_run_as` mirrors `entropic_run` here\nexactly, because the header\
    \ promises an \"identical result contract\".\n\nThe run entry points deliberately take\
