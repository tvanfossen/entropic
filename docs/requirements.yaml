- id: REQ-INFER-012
  name: Adapter registry resolves a family parser with a safe generic fallback
  module: Inference Backends
  description: 'ChatAdapter is a concrete base holding roughly 80% of the logic — system

    prompt assembly, tagged <tool_call>JSON</tool_call> parsing, bare-JSON

    fallback, malformed-JSON recovery, tool-result formatting, think-aware

    completeness detection. Concrete adapters override only the family

    specifics. create_adapter maps a config name (case-insensitively) to

    gemma4 / qwen35 / qwen36 / nemotron3, and anything unrecognised falls back

    to GenericAdapter rather than failing.


    Families whose calls fall to common_chat''s PEG autoparser (Qwen,

    Nemotron) keep their hand-rolled multi-parameter XML parser, which also

    tolerates the gh#79 </NAME> close tag, drops unterminated parameters

    without aborting the scan, and truncates at a nested <function= tag.

    Gemma-4 additionally gets two recovery behaviours on the reliable path:

    recovery of {"action": …} envelopes the model parrots back from primed

    meta-tool results (gh#88), and re-coercion of numeric-looking scalars back

    to strings when the staged schema declares "type":"string" (gh#90) — the

    <|"|> escape loses type through PEG_GEMMA4 and a string-typed schema then

    rejects the call, circuit-breaking delegation.

    '
