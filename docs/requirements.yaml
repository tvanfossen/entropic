- id: REQ-INFER-009
  name: Tool staging drives a native render whose parse context is captured
  module: Inference Backends
  description: 'Before every generate dispatch the orchestrator stages the turn''s MCP tool

    definitions (and the tier''s require_tool_call flag) on the backend. When

    tools are staged, the render routes through common_chat with

    inputs.tools so the model is instructed in — and emits — its native

    tool-call wire format, and the render''s outputs are captured for the

    subsequent parse: format, generation_prompt, the serialized PEG parser

    arena, and (since v2.10.4) the derived tool-call GBNF plus its lazy flag.


    Two distinct captures are kept. A LIVE capture is overwritten by every

    render, including a toolless interleave, and answers "what did THIS

    render produce" for close-marker selection. A STICKY snapshot is written

    only by a successful tooled render and never cleared by a toolless one,

    because the engine re-parses the main output AFTER a constitutional

    validator''s toolless critique render — gh#105: without stickiness that

    interleave clobbered the parser arena and the main call extracted zero

    tool calls.

    '
  acceptance_criteria: 'Given tools staged and a render performed, When parse_response runs,

    Then it reloads the serialized PEG arena and extracts the model''s native

