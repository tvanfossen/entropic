- id: REQ-STOR-004
  name: Referential integrity, cascade cleanup, and FTS index coherence
  module: Persistence and Storage
  description: 'The schema declares FK constraints from messages, delegations (both parent
    and

    child) and compaction_snapshots onto `conversations(id)` with ON DELETE CASCADE,

    and `PRAGMA foreign_keys=ON` is set at every open so they are actually enforced.

    An FTS5 external-content table `messages_fts` mirrors `messages.content` and is

    kept coherent by AFTER INSERT / AFTER UPDATE / AFTER DELETE triggers rather than

    by application code, so no code path can insert a message that is unsearchable or

    delete one that leaves a phantom hit. `search_conversations` queries that index

    with an FTS5 MATCH, orders by rank, and returns per-hit snippets delimited by

    `>>>`/`<<<`. `get_stats` reports total_conversations, total_messages and summed

    token_count (COALESCE''d to 0 on an empty database).

    WHY: orphaned messages or a stale search index would surface deleted content back

    into an agent''s context; enforcing this in the schema makes it unbypassable.

    '
  acceptance_criteria: 'Given a parent conversation with a message and a delegation, When
    the parent is

    deleted, Then both the message and the delegation rows are gone.

    Given messages inserted normally, When messages_fts is queried, Then the content

    is present; When a message is deleted, Then the FTS row is removed too.

    Given conversations containing known text, When search_conversations runs, Then

    matching conversations are returned with a snippet.

    Given a database with conversations and messages, When get_stats is called, Then

    the counts and token sum reflect the stored rows.

    '
  verified_by: 'SCENARIO("CASCADE delete removes messages and delegations") — tests/unit/storage/database_test.cpp

    SCENARIO("FTS5 triggers populate on INSERT") — tests/unit/storage/database_test.cpp

    SCENARIO("FTS5 triggers clean up on DELETE") — tests/unit/storage/database_test.cpp

    SCENARIO("FTS5 search returns results with snippets") — tests/unit/storage/backend_test.cpp

    SCENARIO("Storage statistics") — tests/unit/storage/backend_test.cpp

    '
