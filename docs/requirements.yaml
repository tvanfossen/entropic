  version: 2.10.4
- id: REQ-INFER-017
  name: Prompt-prefix KV reuse never serves a stale or desynchronised cache
  module: Inference Backends
  description: 'Two mechanisms avoid re-prefilling an unchanged prompt prefix. The

    PromptCache stores KV snapshots in host RAM, keyed by a content hash of

    (system prompt text + model path), with LRU eviction under a byte budget

    (0 = disabled), and is thread-safe. WARM-KEEP reuse (gh#96) instead reuses

    the KV already resident in seq 0: warm_keep_cut computes how many leading

    tokens may be kept, the divergent tail is seq_rm''d, and only the delta is

    decoded.


    The correctness rules are the reason this is a pure, unit-testable

    function: no resident KV or a prompt under 2 tokens falls back cold; the

    KV must actually hold the matched prefix (kv_pos_max+1 >= common) or

    something mutated seq 0 out of band; and the final token is ALWAYS

    re-decoded so its logits are fresh for sampling. Every path that mutates

    seq 0 out of band — multimodal, raw complete, speculative, MTP — calls

    invalidate_resident_kv so the next text turn cannot reuse a stale record.

    Caches are invalidated across the whole pool (including secondary roles)

    when identity or prompt-prefix content changes.


    gh#97: on a hybrid/recurrent arch a partial seq_rm is rejected by the

    memory implementation, leaving an un-removed tail that inflates kv_pos_max

    and eventually exhausts the context with the cache mostly empty — so

    kv_pos_max is exposed as an observable and reuse must not inflate it.

    '
  acceptance_criteria: 'Given resident and incoming token sequences, Then warm_keep_cut reuses
    the

    common prefix, caps at len-1, and returns 0 on degenerate inputs, no

    shared prefix, or an occupancy mismatch. Given a multi-turn agent loop,

    Then per-turn prefill tokens do not grow with history. Given a hybrid

    model, Then kv_pos_max stays below input + max_tokens (no desync). Given

    the prompt cache, Then keys are content-addressed, LRU order is respected,

    lookup updates recency, an oversize entry is refused, and zero max_bytes

    disables caching.

    '
  verified_by: 'TEST_CASE "common_prefix_len matches leading tokens", "warm_keep_cut:

    happy path reuses the shared prefix" / "divergence mid-history caps reuse

    at the cut" / "no shared prefix falls back" / "occupancy gate catches

    out-of-band KV wipe" / "degenerate inputs fall back" / "identical sequence

    still decodes the last token" —

    tests/unit/inference/warm_keep_util_test.cpp;

    SCENARIO "Store and lookup", "Content-addressed keys", "Same prompt

    different model", "LRU eviction order", "Lookup updates LRU", "Entry

    exceeds limit", "Zero max_bytes disables caching", "Concurrent access" —

    tests/unit/inference/prompt_cache_test.cpp;

    SCENARIO "gh#96: agent-loop prefill must not grow with history

    (warm-keep)" — tests/model/test_gh96_warmkeep.cpp;

    SCENARIO "gh#97: prompt-cache/warm-keep must not corrupt KV on a hybrid

    model" — tests/model/test_gh97_hybrid_cache.cpp

    '
  version: 2.10.4
- id: REQ-INFER-018
  name: Same-prefix batch generation is gated, per-request-constrained and seq-safe
  module: Inference Backends
  description: 'For traffic where N requests share a large verbatim prefix and differ only

    in a short suffix (NPC agents per game tick), the shared prefix is

    prefilled once into seq 0, seq_cp''d to N sequences, and the suffixes plus

    outputs are decoded in batched forward passes — one llama_decode per step

    over N tokens — each sampled under its OWN request''s grammar.


    The fast path engages only when batch_is_viable: at least 2 requests; the

    arch is NOT hybrid/recurrent (seq-level KV ops are unsafe there — gh#97);

    n <= n_parallel; a real shared prefix exists; and the suffix tokens fit one

    decode batch. Otherwise it falls back transparently to running each

    request through the proven single-request path — always correct, just

    without the shared-prefill win. Like warm-keep, the shared prefix is capped

    at shortest_len - 1 so every sequence retains a non-empty suffix and its

    final logits are fresh.


    Temporary sequence ids come from a pool with a monotonic high-water mark;

    the pre-gh#98 "1 + free_size" scheme handed out duplicate ids on an empty

    pool, colliding the batch''s sequences. A model test cannot catch that

    collision because a forcing grammar makes output independent of the

    corrupted KV — hence the CPU unit test on distinctness.

    '
  acceptance_criteria: 'Given N sequences, Then batch_shared_prefix_len returns the common
    prefix

    capped one below the shortest and 0 for <2 sequences, any empty sequence,

    a single-token shortest, or no common first token. Given each viability

    condition individually violated (hybrid, n<2, no shared prefix, n >

    n_parallel, suffixes over n_batch), Then batch_is_viable is false. Given

    an empty pool, Then successive allocate_temp_seq_id calls return distinct

    ids and released ids are reused. Given a real batch, Then the batched

    decode step count is about the longest output, not the serial sum; on a

    hybrid arch it falls back to serial.

    '
  verified_by: 'TEST_CASE family "batch_shared_prefix_len: …" and "batch_is_viable: …" —

    tests/unit/inference/batch_util_test.cpp;

    TEST_CASE "temp seq_id pool hands out distinct ids on an empty pool

    (gh#98)" and "released temp seq_ids are reused, keeping the high-water

    bounded" — tests/unit/inference/seq_id_pool_test.cpp;

    SCENARIO "gh#98: multi-seq batch decodes N sequences together" and "gh#98:

    hybrid arch falls back to serial (no seq-op corruption)" —

    tests/model/test_gh98_batch.cpp

    '
  version: 2.10.4
- id: REQ-INFER-019
  name: Model pool dedup and VRAM residency policy govern which tier is resident
  module: Inference Backends
  description: 'ModelOrchestrator keeps one backend per unique .gguf path (many tiers may

    map to one backend) and enforces a single ACTIVE main tier: activating a

    tier first deactivates the incumbent, to WARM when keep_warm is set and to

    COLD otherwise. An unknown tier name falls back to routing.fallback_tier

    before failing.


    Before a cold activation, a budget gate runs: the tier''s estimated

    footprint is compared against the engine VRAM budget. A tier that does not

    fit is refused with ENTROPIC_ERROR_TIER_MODEL_TOO_LARGE stashed for the

    facade to translate, rather than being loaded and aborting the process on a

    failed device allocation.


    The budget resolves from ENTROPIC_VRAM_BUDGET_BYTES when set, else from the

    FREE VRAM the active GPU device reports; 0 (no GPU device at all) means

    unknown and the gate is disabled. Free rather than total, because the

    failure case is an operator whose GPU is busier than the developer''s.


    The footprint prices weights by their OFFLOAD PLACEMENT, KV by its CACHE

    TYPE, and counts the vision projector when the tier declares one. A

    partially offloaded tier is deliberately UNPRICEABLE — how much of the file

    lands on the device depends on a layer count not knowable without reading

    GGUF metadata — and reports itself unknown, which leaves the gate open. That

    asymmetry is intentional: refusing a configuration that works is a worse

    failure than missing one that does not, because the operator cannot tell a

    false refusal from a real one.


    A refusal also logs what WOULD fit — the largest context length that fits

    the measured budget, or a statement that context length is not the lever

    when nothing fits at any size.


    Two explicit configurations are refused with a typed code BEFORE the

    footprint is priced, rather than being discovered as an OOM kill or a

    buffer-allocation abort: use_mlock on a model larger than RLIMIT_MEMLOCK

    allows (MLOCK_LIMIT_EXCEEDED — pinned pages cannot be reclaimed, which is

    what turns partial offload from slow into fatal), and a GPU offload

    requested on a card whose free VRAM cannot hold the compute buffers alone

    (TIER_MODEL_TOO_LARGE). Both are floor-gated to models above the

    large-model threshold, because refusing a configuration that works is a

    worse failure than missing one that does not, and neither rule can fire

    on an ordinary model. Judging a SPECIFIC partial split is deliberately

    not attempted: it needs a layer count the gate does not read. The engine

    never silently corrects either setting; each refusal names the one to

    change.


    gpu_layers: auto is the opt-in that asks the engine to derive the split

    from the model size and the free VRAM it measured, logging the number it

    chose. It derives the layer split and nothing else — the model-test

    harness, which used to compute the split AND flip use_mlock off behind

    the operator, now goes through this same engine path.


    A resident model can also be released ON DEMAND, without destroying the

    handle: entropic_release_model unloads one named tier or every resident

    model (tiers plus the router/draft roles, and any MTP head its target

    owns), fires EVICTED for each affected tier, and clears the active-tier

    record so the next use reloads through the gate. The handle, its config,

    its MCP registrations, every session conversation AND the tier''s LoRA

    adapter REGISTRATIONS survive — only the adapters'' llama handles are

    freed, to be re-bound at the next activation. The call claims the handle''s

    turn and refuses with ALREADY_RUNNING while one is in flight, because the

    swap mutex does not serialise generation and unloading frees the context a

    decode is running on. An unknown tier name is MODEL_NOT_FOUND; releasing

    an already-unloaded tier is a no-op.


    WHEN the default tier is loaded is a config choice, not a fixed

    lifecycle. models.defer_load == false (the default) loads and activates it

    during configure; true leaves it COLD until the first caller needs it.

    BOTH paths run through the same residency-gated activation, so the budget

    gate, the Loaded event and the footprint record apply to the startup load

    exactly as they do to a mid-session swap — before v2.13.0 the eager path

    bypassed all three. A tier''s LoRA adapters are preloaded at the

    ACTIVATION of their base model rather than at engine init, which is the

    only moment at which a non-default tier''s model exists.


    Every VRAM state change (Loaded, Evicted, ActivationSwap) fires a

    registered residency observer synchronously under the swap mutex, and the

    residency set is serialisable as a JSON snapshot. Named GPU resource

    profiles (maximum/balanced/background/minimal, plus runtime-registered

    ones) resolve load-time resource settings, falling back to "balanced" with

    a warning on an unknown name rather than failing.

    '
  acceptance_criteria: 'Given a configured VRAM budget smaller than a tier''s footprint, When
    the

    tier is requested, Then activation is refused and last_residency_error is

    TIER_MODEL_TOO_LARGE (cleared after translation). Given no

    ENTROPIC_VRAM_BUDGET_BYTES and a GPU device present, Then the budget is the

    device''s free VRAM and the gate enforces. Given a tier with gpu_layers set

    to a specific positive count below the all-layers sentinel, Then the

    footprint is reported unknown and the tier is NOT refused. Given a KV cache

    type of q4_0, Then its per-token cost is priced below f16 rather than at a

    flat rate. Given a tier declaring an mmproj, Then the projector''s bytes are

    included when the weights are offloaded and excluded when they are not.

    Given use_mlock true on a model larger than RLIMIT_MEMLOCK and not fully

    offloaded, Then the tier is refused with MLOCK_LIMIT_EXCEEDED; given the

    same on an ordinary-sized model, Then it is admitted. Given a positive

    gpu_layers and free VRAM at or below the compute reserve on a large

    model, Then the tier is refused; given free VRAM above it, Then the split

    is admitted. Given gpu_layers: auto in YAML, Then the tier records the

    opt-in and no layer count is invented at parse time. Given a residency

    observer, Then it can be registered and cleared and the event enum matches

    the public C ABI. Given a default-constructed orchestrator, Then

    residency_snapshot_json is well-formed and reports the configured budget.

    Given an unknown profile name, Then "balanced" is returned with a warning.

    Given models.defer_load true, When the orchestrator initializes, Then no

    model is loaded and no residency event fires; When the first caller asks

    for the tier, Then it loads and fires exactly one Loaded event, and a

    second ask reuses the resident model without a second event. Given

    defer_load false, When the orchestrator initializes, Then the default tier

    is loaded at init.

    Given a resident tier, When it is released, Then EVICTED fires for it, it

    is no longer in the residency set, the active-tier record is cleared, and

    the next use reloads it; When it is released twice, Then the second is a

    no-op. Given an unknown tier name, Then release returns MODEL_NOT_FOUND.

    Given a turn in flight, Then release returns ALREADY_RUNNING. Given a

    released model whose adapters were registered, Then the registrations

    survive the release and are re-bound at the next activation.

    '
  verified_by: 'TEST_CASE "Residency snapshot on a default-constructed orchestrator",

    "Residency observer slot accepts and clears callables", "Last residency

    error defaults to OK and clears on demand",

    "ENTROPIC_ERROR_TIER_MODEL_TOO_LARGE has a stable name", "Residency event

    enum matches the public C ABI" — tests/unit/inference/residency_test.cpp;

    SCENARIO "gh#142 KV is priced by its cache type, not a flat rate",

    "gh#142 offload placement decides whether weights count against VRAM",

    "gh#142 the vision projector is counted — it is what actually failed",

    "gh#142 the config that aborted the process is refused instead"

    — tests/unit/inference/vram_footprint_test.cpp;

    SCENARIO "Orchestrator VRAM budget env override is read at initialize",

    "Orchestrator residency observer set/clear + speculative setters" and

    TEST_CASE "Orchestrator residency_snapshot_json reports configured budget"

    — tests/unit/inference/orchestrator_test.cpp;

    SCENARIO "Load bundled profiles", "Get unknown name falls back to

    balanced", "load_bundled is idempotent", "Concurrent register and get are

    thread-safe" — tests/unit/inference/profile_registry_test.cpp;

    SCENARIO "gh#157: defer_load decides whether init touches the model at

    all", "gh#157: a deferred tier answers vision from config while unloaded",

    "gh#157: the first use loads exactly once, through the gate" —

    tests/unit/inference/deferred_load_test.cpp;

    SCENARIO "gh#164: releasing an unknown tier is refused, not silently

    ignored", "gh#164: release evicts the model and the next use brings it

    back" — tests/unit/inference/release_model_test.cpp;

    SCENARIO "gh#148: use_mlock on an oversized model is refused, not

    flipped", "gh#148: an offload with no room for compute buffers is

    refused" — tests/unit/inference/partial_offload_test.cpp;

    SCENARIO "gh#148: gpu_layers accepts a count or the word auto" —

    tests/unit/config/loader_test.cpp;

    TEST_CASE "gh#164 entropic_release_model rejects a NULL handle", "gh#164

    entropic_release_model needs a configured engine", "gh#164

    entropic_release_model names an unknown tier", "gh#164

    entropic_release_model refuses to unload mid-turn" —

    tests/unit/api/entropic_capi_test.cpp;

    TEST_CASE "gh#164: release then reload decodes correctly on gemma4 (plain

    KV)", "gh#164: release then reload decodes correctly on a hybrid arch",

    "gh#164: entropic_release_model frees VRAM through the C ABI" —

    tests/model/test_gh164_release_reload.cpp

    '
