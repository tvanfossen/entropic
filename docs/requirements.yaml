- id: REQ-TYPE-005
  name: Config types declare their own defaults; optional means absent, not default
  module: Shared Types
  description: 'types/config.h is the single declaration of the engine''s configuration

    shape (~25 structs: ModelConfig, TierConfig, GenerationParams, MCPConfig,

    SpeculativeConfig, ParsedConfig, PhaseConfig, …). Two rules govern it.


    First, every scalar field carries its default as a member initializer in

    the struct, not in the YAML loader. The struct IS the default spec, so a

    default-constructed value is already valid and a consumer that never

    touches the loader gets the same behavior the engine documents.


    Second, `std::optional<T>` is reserved for fields where "absent" and

    "the default value" are genuinely different resolutions, and the resolver

    lives elsewhere (loader / orchestrator / identity frontmatter). Examples:

    `allowed_tools` nullopt = all tools allowed, vs an empty vector = none;

    `routable` nullopt = defer to the identity''s frontmatter, vs false =

    explicitly not routable; TierConfig''s per-tier sampler knobs (temperature,

    top_p, top_k, min_p, presence/frequency penalty, repeat_penalty,

    enable_thinking, speculative_mtp, require_tool_call) nullopt = inherit the

    global/profile value rather than override it. Collapsing nullopt into a

    concrete default would silently override settings the operator never set.


    Merged in reconciliation with REQ-CFG-004 — the same rule stated from another subsystem''s
    end.'
  acceptance_criteria: "[REQ-TYPE-005]\n- GIVEN a default-constructed ModelConfig THEN adapter\
    \ == \"qwen35\",\n  model_format == \"gguf\", context_length == 16384, gpu_layers == -1,\n\
    \  keep_warm == false, use_mlock == true, flash_attn == true, n_batch == 512,\n  n_ubatch\
    \ == 0, split_mode empty, main_gpu == 0, offload_kqv == true,\n  rope_freq_base/scale\
    \ == 0.0, n_parallel == 1, n_threads == 0,\n  cache_type_k/v == \"f16\", reasoning_budget\
    \ == -1.\n- GIVEN a default-constructed ModelConfig THEN allowed_tools is nullopt\n  (meaning\
    \ all tools), not an empty vector.\n- GIVEN a default-constructed GenerationParams THEN\
    \ temperature == 0.7,\n  top_p == 0.9, top_k == 40, max_tokens == 4096, repeat_penalty\
    \ == 1.1,\n  reasoning_budget == -1, grammar empty (unconstrained).\n- GIVEN YAML that\
    \ omits the per-tier sampler knobs WHEN parsed into\n  TierConfig THEN those optionals\
    \ stay nullopt so the orchestrator applies\n  the inherited value; GIVEN YAML that sets\
    \ them THEN each parses through.\n- GIVEN a tier that does not mention speculative.mtp\
    \ THEN speculative_mtp\n  stays nullopt (inherit global) rather than becoming false.\n\
    \n[REQ-CFG-004]\nGIVEN a tier YAML node declaring temperature, enable_thinking, top_k,\
    \ top_p,\nmin_p, repeat_penalty and max_output_tokens, WHEN parsed, THEN each\ncorresponding\
    \ TierConfig optional has_value() and carries the declared value.\nGIVEN a tier YAML node\
    \ with NO sampler keys, WHEN parsed, THEN every\nsampler optional remains nullopt so the\
    \ orchestrator's incoming\nGenerationParams defaults stand. GIVEN a tier declaring `allowed_tools`,\n\
    THEN the optional has_value(); an absent key leaves it nullopt.\nGIVEN a tier with no\
    \ `capabilities:` key, THEN capabilities == {\"text\"}."
  verified_by: "[REQ-TYPE-005]\nSCENARIO(\"ModelConfig has correct defaults\") / SCENARIO(\"\
    GenerationParams\n  has correct defaults\") — tests/unit/types/config_structs_test.cpp\n\
