    get_tier_param is called through the internal trampoline, Then the

    override values are returned and unset (-1) overrides return "".

    Given a per-identity max_iterations lower than LoopConfig, When the

    loop runs, Then the identity value caps it.

    Given set_tier_info for a name, Then has_tier reflects it and

