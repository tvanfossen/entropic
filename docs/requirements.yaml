- id: REQ-MCP-026
  name: A JSON-RPC response is paired with the request that asked for it
  module: MCP Servers and Tool Dispatch
  description: 'Every request ExternalMCPClient sends carries a unique JSON-RPC id

    from an ATOMIC counter, and every response is checked against the id of the

    request that was sent. A response whose id does not match is discarded and

    reported as a typed is_error envelope naming the mismatch, never returned as

    that call''s result.


    The pairing exists because a request can be ABANDONED — a read timeout, or a

    per-session interrupt tripping `request_cancelled()` mid-poll — while the

    server still answers. `StdioTransport::send_request` holds `io_mutex_`

    across write-then-read so bytes never interleave, but it cannot un-send an

    abandoned request: the late answer sits in the pipe and would be read as the

    result of the NEXT request. With one run per handle that was a stale answer

    to yourself; with per-session runs (gh#158) it is a CROSS-SESSION leak of

    real content, which is the gh#150 failure mode arriving through another

    door. The transport therefore marks the pipe desynced on an abandoned read

    and drains orphaned lines before the next write; the id check is what

    catches whatever the drain missed, rather than trusting it.


    The id counter is atomic because ServerManager shares one client per server

    across every run, and the HealthMonitor''s reconnect thread has issued

    initialize/tools/list through the same counter since v1.8.7 — two requests

    sharing an id is exactly what would defeat the check.'
  acceptance_criteria: 'Given a transport whose reply carries a different id, When a tool is

    executed, Then the other request''s payload is not returned and the envelope

    is is_error.

    Given many threads executing tools through one client, When every request is

    sent, Then no two requests share an id and no call is answered by another''s

    response.

    Given an abandoned request, When the next request is sent, Then the orphaned

    reply is drained before the write rather than read as the new result.'
  verified_by: 'SCENARIO "gh#158: a response that answers another request is refused";

    "gh#158: concurrent tool calls on one client get distinct ids" —

    /home/tvanfossen/Projects/entropic/tests/concurrency/test_thread_safety.cpp;

    TEST_CASE "gh#158: an abandoned request''s late reply is drained, not

    returned" —

    /home/tvanfossen/Projects/entropic/tests/unit/mcp/stdio_transport_test.cpp

    '
