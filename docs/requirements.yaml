- id: REQ-TYPE-004
  name: Sentinel count members bound enum validity and force exhaustive wiring
  module: Shared Types
  description: "Enums that are iterated, indexed, or dispatched on carry a trailing\nsentinel\
    \ as their last member — `ENTROPIC_HOOK_COUNT_` (hooks.h),\n`BackendCapability::_COUNT`\
    \ (backend_capability.h), `GrammarSource::count`\n(src/inference/grammar_source.h). The\
    \ sentinel serves two purposes and\nboth are load-bearing:\n\n  1. Bounds validation.\
    \ It is NOT a valid value: the hook registry rejects\n     registration at or past the\
    \ sentinel with ENTROPIC_ERROR_INVALID_CONFIG\n     rather than indexing off the end of\
    \ the callback array, and the\n     capability dispatch sizes its table from _COUNT.\n\
    \  2. A tripwire on the declaration itself. A test pins the sentinel's\n     integer value,\
    \ so appending a member fails that test deliberately and\n     forces the author to wire\
    \ the new member everywhere it must appear.\n\nThe tripwire exists because of a repeated\
    \ incident class: gh#95, gh#108 and\ngh#134 were each a grammar source that reached the\
    \ engine and never reached\nthe sampler. Each got a bespoke regression test for its own\
    \ source and\nnobody asserted the general property, so source N+1 shipped unwired every\n\
    time. The sentinel makes \"declared but unwired\" a build-time failure.\n\nScope note:\
    \ this requirement owns the sentinel-count pattern. The grammar-source instance of it\
    \ is REQ-INFER-008."
  acceptance_criteria: "- GIVEN the hook enum THEN ENTROPIC_HOOK_COUNT_ == 23; WHEN registering\
