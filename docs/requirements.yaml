- id: REQ-LOOP-004
  name: Empty-turn allowance and tool-call correction nudge
  module: Agent Loop
  description: 'For a tier whose identity declares explicit_completion, a turn that

    emits no tool call is a protocol violation, not automatically a

    failure. The engine keeps a per-context counter

    (metadata["zero_tool_call_retries"]) and, while it is below the

    ceiling, pushes a "[SYSTEM] Your previous response contained no tool

    call ... Retry." correction naming the tier''s actual allowed_tools

    and returns to EXECUTING. On reaching the ceiling it records

    metadata["failure_reason"] = "zero_tool_calls_with_explicit_completion"

    plus failure_tier and transitions to ERROR. The ceiling defaults to

    3 and is overridable per tier via the max_consecutive_empty_turns

    identity parameter (gh#123). A genuinely executed tool call resets

    the counter to 0 so earlier empty-turn debt is cleared.

    WHY: a small quantized specialist that reasons in prose for one turn

    must be nudged, not failed; but a tier that never emits a tool call

    must fail loudly rather than burn the lead''s whole iteration budget.

    '
