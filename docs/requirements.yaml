- id: REQ-INFER-013
  name: Sequential tool-call mode hard-stops at the first closed call
  module: Inference Backends
  description: 'A tier in "sequential" tool_call_mode implements observe-between-actions:

    one tool call per turn. The backend derives the family''s per-call CLOSE

    marker from the format the CURRENT render resolved (</tool_call> for the

    PEG native/simple families, <tool_call|> for gemma4) and appends it to the

    effective stop list POST-render — gh#103 originally injected it pre-render

    off the previous or empty format, so it never fired on the call it was

    configured for.


    The marker is RETAINED in the generated content (the stop check does not

    truncate) so common_chat still sees a complete <tool_call>…</tool_call>

    block to parse. Any format without a confirmed marker returns "" and no

    stop is injected, leaving batch behaviour byte-identical — "" is always

    safe: it can never corrupt a parse or fire a spurious stop. Appending

    dedupes against a stop the caller already supplied. Markers track the

    vendored PEG parser defaults and must be re-checked on a llama.cpp pin

    bump.

    '
