- id: REQ-INFER-008
  name: Every declared grammar source reaches the sampler and exactly one wins
  module: Inference Backends
  description: 'Two grammar sources reach a decode and they cannot compose, because they

    constrain output to different languages: the REQUEST grammar (params.

    grammar, itself fed by grammar_key and identity frontmatter) and the

    TOOL-CALL grammar llama.cpp derives from the staged tool schemas during

    common_chat_templates_apply. resolve_grammar_source gives the request

    grammar precedence — it is an explicit caller instruction, whereas the

    tool grammar is merely implied by staging tools — and a collision is

    logged at ERROR at the application site rather than silently resolved,

    because the losing constraint''s absence would otherwise be undiagnosable.


    The tool-call grammar must be applied as COMMON_GRAMMAR_TYPE_TOOL_CALLS

    with the render''s generation_prompt prefilled, never as _USER: the model''s

    output begins mid-template, and the USER type skips prefill so the grammar

    would reject from the first sampled token (surfacing as GENERATE_FAILED

    with empty content).


    The GrammarSource::count sentinel exists so that adding a fifth source

    without wiring it breaks the invariant test deliberately. gh#95, gh#108

    and gh#134 were each a grammar source that reached the engine and never

    reached the sampler, and each got only a bespoke regression test.


    gh#154 names a fourth source, `tier`: the identity frontmatter `grammar:`

    stem reaches the sampler through GenerationParams::grammar exactly as a

    caller-supplied grammar does, so it is APPLIED identically (application

    sites ask is_request_grammar, never `== request`) and differs only in

    reporting. GenerationResult::grammar carries {source, key, resolved,

    conflict_winner} so a consumer can read which source won, which key was

    named, and whether anything constrained the decode at all — previously

    observable only as the ABSENCE of a log line.

    '
  acceptance_criteria: 'Given the declared source set, Then grammar_source_count() equals
    the

    number the invariant test exercises and every non-none source is

    producible from resolve_grammar_source. Given only a request grammar,

    Then request wins; given only a tool grammar, Then tool_call wins; given

    neither, Then none; given a request-side grammar that came from the tier,

    Then tier. Given both, Then request wins and grammar_sources_collide

    reports true so the collision is loggable and lands in

    GenerationResult::grammar.conflict_winner. Given a named key that

    resolved to nothing, Then the naming source is reported with

    resolved == false.

    '
  verified_by: 'SCENARIO "gh#134 every declared grammar source is wired to the sampler"

    and "gh#134 exactly one grammar source constrains a decode" —

    tests/unit/inference/grammar_source_invariant_test.cpp;

    TEST_CASE "gh#134 (v2.10.4) require_tool_call forces a tool call under

    MTP" / "A/B: the knob, not the model, produces the call" —

    tests/model/test_gh108_mtp_stream_grammar.cpp;

