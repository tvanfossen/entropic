- id: REQ-API-012
  name: Final-answer selection from a serialized conversation
  module: Public C API and Facade
  description: "When the facade must reduce a serialized conversation to one operator-visible\n\
    answer string (the external MCP bridge's `ask` paths), the rule is fixed in\n`src/facade/final_text.h`:\n\
    \  - Scan the message array BACKWARDS for the most recent `assistant` message\n    whose\
    \ `content` is non-empty, SKIPPING empty assistant turns.\n  - Never fall back to a `user`-role\
    \ message. Tool results and delegation\n    summaries are injected as `role: \"user\"\
    `, and `serialize_messages` emits only\n    `{role, content}` — at this layer a delegation\
    \ summary is indistinguishable\n    from the operator's own prompt, so a user-message\
    \ fallback would echo the\n    operator's question back as the answer.\n  - When there\
    \ is no answer, return a diagnostic that distinguishes \"no assistant\n    message at\
    \ all\" from \"every assistant message was empty\", instead of a bare\n    sentinel. All\
    \ diagnostics keep `\"(no response\"` as their leading substring so\n    consumers doing\
    \ prefix/substring matching on the old sentinel still fire.\n  - Report only what the\
    \ conversation itself proves — iteration counts and the\n    specific precondition that\
    \ fired are not in this JSON and are not invented.\n\nWHY (gh#130): a turn ending without\
    \ `entropic.complete` leaves a trailing EMPTY\nassistant message. Stopping at it made\
    \ the bridge answer \"(no response)\" while\nthe real answer — including a `fold_delegation_summary`\
    \ result from a completed\nsub-tier delegation — sat one or two messages earlier. It was\
    \ a one-line scanning\nbug in a `static` helper no test could reach, which is why the\
    \ rule now lives in\na directly unit-testable private header.\n"
  acceptance_criteria: 'GIVEN a conversation ending in an empty assistant message preceded
    by a

    non-empty one WHEN extract_final_text runs THEN the earlier non-empty assistant

    content is returned.

    GIVEN a conversation whose last non-empty message is a user message THEN the

    result is empty — the user text is never returned as the answer.

    GIVEN a conversation with no assistant message versus one where all assistant

    messages are empty THEN the two diagnostics differ, and both begin with

    "(no response".

    '
