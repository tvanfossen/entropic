  version: 2.10.4
- id: REQ-INFER-001
  name: Backend lifecycle is a three-state machine with gated generation
  module: Inference Backends
  description: 'Every inference backend exposes exactly three lifecycle states — COLD

    (nothing allocated), WARM (weights in CPU RAM), ACTIVE (GPU layers +

    llama_context live) — and the concrete base class InferenceBackend owns

    the transitions: load (COLD->WARM), activate (WARM->ACTIVE, auto-loading

    if COLD), deactivate (ACTIVE->WARM), unload (any->COLD, idempotent).

    Invalid transitions are logged no-ops, not errors, so a caller can drive

    the machine idempotently.


    Every generation and evaluation entry point (generate, generate with

    cancel, generate_streaming, generate_batch, generate_seq, complete,

    evaluate_logprobs, save/restore state) refuses to run outside ACTIVE and

    returns a typed ENTROPIC_ERROR_INVALID_STATE result rather than

    dereferencing a null llama_context. state() is a lock-free atomic read;

    only transitions take the transition mutex; evaluation takes a separate

    eval mutex so it can run concurrently with generation.

    '
  acceptance_criteria: 'Given a COLD backend, When load/activate/deactivate/unload are driven
    in

    valid and invalid orders, Then the observed state follows the documented

    machine and repeated calls are no-ops. Given a non-ACTIVE backend, When

    any generation or evaluation entry point is called, Then it returns

    ENTROPIC_ERROR_INVALID_STATE and never crashes. Given a failing do_load,

    Then the backend remains COLD.

    '
  verified_by: 'SCENARIO "Backend lifecycle transitions" / "Idempotent transitions" /

    "Generation requires ACTIVE state" / "load_and_activate from COLD" /

    "Load failure keeps COLD state" and TEST_CASE "v2.3.10 backend topup —

    lifecycle error paths" / "generation rejects non-ACTIVE" —

    tests/unit/inference/backend_lifecycle_test.cpp;

    SCENARIO "LlamaCppBackend::load against a vocab-only GGUF exercises

    do_load" / "unload after failed load is a safe no-op" / "re-load after

    unload reuses do_load" — tests/unit/inference/vocab_only_smoke_test.cpp;

    TEST_CASE "LlamaCppBackend lifecycle on a small real model (one load)" —

    tests/unit/inference/backend_real_model_smoke_test.cpp

    '
  version: 2.10.4
- id: REQ-INFER-002
  name: Teardown releases every model, context and adapter handle
  module: Inference Backends
  description: 'Destroying an engine handle must return all RAM and VRAM the inference

    subsystem acquired. LlamaCppBackend owns a destructor that frees model_,

    ctx_ and the mtmd context; ModelOrchestrator''s destructor runs shutdown()

    (unloading every pooled backend) and then AdapterManager::unload_all(),

    in that order, because LoRA handles must outlive the contexts that

    referenced them.


    This is not hygiene: leaked llama.cpp allocations stay visible to CUDA''s

    pool as stale-but-occupied, so a second engine handle created in the same

    process fails its GPU model load. The gh#58 series recorded this shape

    repeatedly (v2.2.8 backend leak, v2.2.9 missing shutdown-on-destroy,

    v2.3.0 AdapterManager leak).


    Acquisition is counted as carefully as release. A COLD tier reaches

    ACTIVE in ONE whole-file read, straight into the residency its config

    asks for; before v2.13.0 it read the whole GGUF once to place every

    layer on the CPU and then immediately discarded that model and read the

    whole file again with the configured split. A WARM tier still reloads on

    promotion — llama.cpp binds offloading to the model load — and that

    reload is what keep_warm pays for.

    '
  acceptance_criteria: 'Given two orchestrators constructed and destroyed side by side in
    one

    process, Then both construct and tear down cleanly with no residual

    state. Given a backend that failed to load, When unloaded, Then teardown

    is a safe no-op. Given loaded LoRA adapters, When the orchestrator is

    destroyed, Then unload_all frees every adapter handle and is safe to call

    repeatedly. Given a COLD backend, When load_and_activate runs, Then the

    model file is read exactly ONCE and the backend is usable; Given a WARM

    backend, When it is activated, Then the file is read again (two reads in

    total), which is the documented cost of the WARM state.

    '
  verified_by: 'SCENARIO "Orchestrator multi-instance side-by-side construction" /

    "Orchestrator shutdown is safe on uninitialized state" —

    tests/unit/inference/orchestrator_test.cpp;

    TEST_CASE "Unload all for model clears all adapters" / "Unload all

    ignores adapters for different model" —

    tests/unit/inference/adapter_manager_test.cpp;

    SCENARIO "LlamaCppBackend unload after failed load is a safe no-op" —

    tests/unit/inference/vocab_only_smoke_test.cpp;

    SCENARIO "gh#148: one cold activation reads the model file once",

    "gh#148: the WARM path deliberately keeps its reload" —

    tests/unit/inference/load_count_test.cpp

    (GPU-side VRAM reclamation across two real handles: none)

    '
