- id: REQ-LOOP-005
  name: Opt-in thinking-budget gating with nudge then hard cut
  module: Agent Loop
  description: 'When budget_mode is tokens or wall_clock and budget_limit > 0, the

    engine charges generation that produces no executed tool call

    against the budget (tokens estimated at ~4 chars/token, or wall-clock

    seconds since the window opened). On first exhaustion it pushes a

